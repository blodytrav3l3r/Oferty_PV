version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: sok-oferty
        restart: unless-stopped
        ports:
            - '3000:10000'
        environment:
            - NODE_ENV=production
            - PORT=10000
            - HOST=0.0.0.0
            # Wymagane przy pierwszym starcie - ensureAdminExists() rzuci wyjatek bez tej zmiennej
            - "DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?Wymagane: ustaw DEFAULT_ADMIN_PASSWORD w .env}"
        volumes:
            - sok_data:/var/data
        networks:
            - sok-network
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://localhost:10000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

volumes:
    sok_data:
        driver: local

networks:
    sok-network:
        driver: bridge
