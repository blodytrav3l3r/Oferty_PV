version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: sok-oferty
        restart: unless-stopped
        ports:
            - '3000:10000'
        environment:
            - NODE_ENV=production
            - PORT=10000
            - HOST=0.0.0.0
            # Wymagane przy pierwszym starcie - bez tej zmiennej konto admina nie zostanie utworzone (wyjatek jest logowany, start kontynuowany)
            - 'DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:?Wymagane: ustaw DEFAULT_ADMIN_PASSWORD w .env}'
            # Snapshot cen domyslnych z ./data (price_defaults.json) - przywracany przy starcie
            - 'PRICE_DEFAULTS_PATH=/var/data/price_defaults.json'
        volumes:
            # Bind mount zamiast named volume: baza i backupy widoczne na hoscie,
            # dzieki czemu backup/restore dziala identycznie jak na bare-metal
            # (npm run backup / npm run restore wprost na hoscie).
            - ./data:/var/data
        networks:
            - sok-network
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "require('http').get('http://localhost:10000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

networks:
    sok-network:
        driver: bridge
