# Load — sustained (~15 min) — osobny workflow (nie część CI/CD Pipeline).
# Celowo poza ci.yml: na pushu/PR job byłby wiecznie Skipped i zaciemniał widok.
# Uruchomienia: nightly (cron) + ręcznie (workflow_dispatch, input users).
# Wynik domyka warunkowe werdykty E5 (docs/plans/archive/e5-decision.md).

name: Load — sustained nightly

on:
    workflow_dispatch:
        inputs:
            users:
                description: 'Liczba wirtualnych userów (sustained)'
                required: false
                default: '100'
            skip:
                description: 'Świadome pominięcie load (true = SKIPPED, nie PASS)'
                required: false
                default: 'false'
    schedule:
        - cron: '0 2 * * *'

jobs:
    load-sustained:
        name: Load — sustained (~15 min, ręcznie/nightly)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
            PORT: '3000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Przygotuj testową bazę SQLite
              run: npx prisma db push --skip-generate

            - name: Seed bazy (produkty + preco)
              run: npm run prisma:seed

            - name: Start serwera w tle
              run: |
                  npm run build
                  nohup node dist/server.js > /tmp/sok-load.log 2>&1 &
                  echo $! > /tmp/sok-load.pid

            - name: Świadome pominięcie (jawne SKIPPED)
              run: |
                  if [ "${{ github.event.inputs.skip }}" = "true" ]; then
                    echo "LOAD_STATUS=SKIPPED (swiadome pominiecie przez operatora)" >> "$GITHUB_STEP_SUMMARY"
                    echo "LOAD_SKIP_CONSCIOUS=true" >> "$GITHUB_ENV"
                  fi

            - name: Czekaj na /health (brak serwera = FAIL)
              if: env.LOAD_SKIP_CONSCIOUS != 'true'
              run: |
                  for i in $(seq 1 30); do
                    if curl -sf http://localhost:3000/health >/dev/null 2>&1; then
                      echo "[OK] Serwer gotowy (proba $i)"
                      echo "LOAD_STATUS=PASS (serwer gotowy)" >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "[BLOCKED] Serwer nie wystartowal po 60 s — load-sustained FAIL (nie SKIP)."
                  tail -n 50 /tmp/sok-load.log || true
                  echo "LOAD_STATUS=BLOCKED (serwer nie wystartowal)" >> "$GITHUB_STEP_SUMMARY"
                  exit 1

            - name: Load sustained (self-cleaning zapisy, DoD PASS/FAIL)
              if: env.LOAD_SKIP_CONSCIOUS != 'true'
              run: |
                  USERS="${{ github.event.inputs.users }}"
                  if [ -z "$USERS" ]; then USERS="100"; fi
                  node scripts/load-100.mjs --sustained --users "$USERS"

            - name: Zatrzymaj serwer
              if: always()
              run: kill "$(cat /tmp/sok-load.pid)" || true
