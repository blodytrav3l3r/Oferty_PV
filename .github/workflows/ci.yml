# CI/CD Pipeline dla S.O.K.
# - push na main → lint + typecheck + testy + Docker build + weryfikacja + deploy (gdy włączony)
# - PR na main → lint + typecheck + testy (job `pr-gate` usunięty 2026-10-25: pokrycie
#   version/prisma/prices jest w jobach push-only `version-check` i `drift-check`).
#   Ciężkie gaty (drift, migrate-verify, load, docker) tylko push→main.
# - Load sustained (~15 min) mieszka w osobnym load-nightly.yml (cron + dispatch),
#   żeby nie wyświetlać wiecznego Skipped w widoku pushy/PR.
# - Deploy produkcyjny (Render): startuje tylko przy `vars.RENDER_DEPLOY_ENABLED == 'true'`.
#   Brak zmiennej → job `skipped`, nie zielony sukces.

name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint (ESLint + Prettier)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint (backend)
              run: npm run lint

            - name: Run ESLint (frontend)
              run: npm run lint:frontend

            - name: Run Prettier check
              run: npm run format:check

            - name: Run encoding check
              run: npm run encoding:check

            - name: Run appname check
              run: npm run appname:check

    typecheck:
        name: Typecheck (tsc)
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Typecheck backend
              run: npm run typecheck

            - name: Typecheck frontend
              run: npm run typecheck:frontend

    test:
        name: Test (Jest)
        runs-on: ubuntu-latest
        needs: [lint, typecheck]
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            POSTGRES_TEST_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install PostgreSQL 18 client tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ca-certificates curl gnupg
                  sudo install -d /usr/share/postgresql-common/pgdg
                  curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg > /dev/null
                  echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
                  sudo apt-get update
                  sudo apt-get install -y postgresql-client-18
                  echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
                  export PATH="/usr/lib/postgresql/18/bin:$PATH"
                  pg_dump --version | grep -E ' 18(\.|$)'
                  pg_restore --version | grep -E ' 18(\.|$)'

            - name: Apply PostgreSQL migrations
              run: npx prisma migrate deploy

            - name: Run tests
              run: npm test

            - name: Run git-safety tests (sequential, no index.lock)
              run: npx jest --selectProjects git-safety --runInBand --no-coverage

            - name: Coverage gate (blocking, progi scripts/coverage-check.mjs)
              run: node scripts/coverage-check.mjs --fail

            - name: Kontrakty instalatorów i PostgreSQL
              run: npm run test:installer-linux

            - name: Upload coverage
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 30

    flaky-detect:
        name: Flaky test detection (3x)
        runs-on: ubuntu-latest
        needs: test
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            POSTGRES_TEST_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install PostgreSQL 18 client tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ca-certificates curl gnupg
                  sudo install -d /usr/share/postgresql-common/pgdg
                  curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg > /dev/null
                  echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
                  sudo apt-get update
                  sudo apt-get install -y postgresql-client-18
                  echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
                  export PATH="/usr/lib/postgresql/18/bin:$PATH"
                  pg_dump --version | grep -E ' 18(\.|$)'
                  pg_restore --version | grep -E ' 18(\.|$)'

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Apply PostgreSQL migrations
              run: npx prisma migrate deploy

            - name: Utwórz katalog raportów
              run: mkdir -p junit

            - name: Run 1/3
              run: npx jest --no-coverage --testPathIgnorePatterns=git-safety --testPathIgnorePatterns=tests/pricelistChunk.test.ts --json --outputFile=junit/run1.json --testLocationInResults --silent || true

            - name: Run 2/3
              run: npx jest --no-coverage --testPathIgnorePatterns=git-safety --testPathIgnorePatterns=tests/pricelistChunk.test.ts --json --outputFile=junit/run2.json --testLocationInResults --silent || true

            - name: Run 3/3
              run: npx jest --no-coverage --testPathIgnorePatterns=git-safety --testPathIgnorePatterns=tests/pricelistChunk.test.ts --json --outputFile=junit/run3.json --testLocationInResults --silent || true

            # Bramka: stable FAIL lub flaky > max-flaky czerwieni job.
            # (pricelistChunk wykluczony — wolny test serializowany osobno w test:quick)
            - name: Compare flaky
              run: node scripts/flaky-compare.mjs junit/run1.json junit/run2.json junit/run3.json --max-flaky=0

            - name: Upload flaky report
              uses: actions/upload-artifact@v4
              with:
                  name: flaky-report
                  path: junit/
                  retention-days: 30

    docker-build:
        name: Docker build + health check
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        steps:
            - uses: actions/checkout@v7

            - name: Build Docker image
              run: docker build -t sok-oferty:${{ github.sha }} .

            - name: Provision least-privilege PostgreSQL roles
              run: |
                  docker run --rm -i --network host \
                    -e POSTGRES_ADMIN_URL='postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test' \
                    -e SOK_MIGRATOR_PASSWORD='ci-only-migrator' \
                    -e SOK_APP_PASSWORD='ci-only-app' \
                    -e SOK_BACKUP_PASSWORD='ci-only-backup' \
                    --entrypoint node sok-oferty:${{ github.sha }} - <<'NODE'
                  const { Client } = require("pg");
                  const client = new Client({ connectionString: process.env.POSTGRES_ADMIN_URL });
                  const roles = [["sok_migrator", "SOK_MIGRATOR_PASSWORD"], ["sok_app", "SOK_APP_PASSWORD"], ["sok_backup", "SOK_BACKUP_PASSWORD"]];
                  client.connect().then(async () => {
                    for (const [role, envName] of roles) {
                      const { rows } = await client.query(
                        "SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', $1::text, $2::text) AS statement",
                        [role, process.env[envName]]
                      );
                      await client.query(rows[0].statement);
                    }
                    await client.query("GRANT CONNECT ON DATABASE sok_test TO sok_migrator, sok_app, sok_backup");
                    await client.query("GRANT CREATE ON DATABASE sok_test TO sok_migrator");
                    await client.query("ALTER SCHEMA public OWNER TO sok_migrator");
                    await client.query("GRANT USAGE ON SCHEMA public TO sok_app, sok_backup");
                  }).catch(error => { console.error(error.message); process.exitCode = 1; }).finally(() => client.end());
                  NODE

            - name: Apply PostgreSQL migrations and bootstrap
              run: |
                  docker run --rm --network host \
                    -e DATABASE_URL='postgresql://sok_app:ci-only-app@localhost:5432/sok_test?schema=public' \
                    -e MIGRATION_DATABASE_URL='postgresql://sok_migrator:ci-only-migrator@localhost:5432/sok_test?schema=public' \
                    -e DEFAULT_ADMIN_PASSWORD='test-admin-pass' \
                    --entrypoint /bin/sh sok-oferty:${{ github.sha }} /app/scripts/docker-db-bootstrap.sh

            - name: Health check
              run: |
                  docker run --network host -d --name test-container \
                    -e DATABASE_URL='postgresql://sok_app:ci-only-app@localhost:5432/sok_test?schema=public' \
                    -e BACKUP_DATABASE_URL='postgresql://sok_backup:ci-only-backup@localhost:5432/sok_test?schema=public' \
                    sok-oferty:${{ github.sha }}
                  echo "Sprawdzanie stanu kontenera..."
                  for i in $(seq 1 15); do
                    if docker exec test-container node -e "require('http').get('http://localhost:10000/health/ready', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>/dev/null; then
                      echo "[OK] Health check OK (proba $i)"
                      break
                    fi
                    if [ "$i" -eq 15 ]; then
                      echo "[FAIL] Health check nie powiodl sie po 15 probach"
                      docker logs test-container
                  docker stop test-container && docker rm test-container
                  exit 1
                    fi
                    echo "  Proba $i/15 — oczekiwanie 2s..."
                    sleep 2
                  done
                  docker exec test-container node -e "const http=require('http');http.get({host:'localhost',port:10000,path:'/index.html',headers:{'x-forwarded-proto':'https'}},r=>{let b='';r.on('data',d=>b+=d);r.on('end',()=>{process.exit(/<script[^>]*>window\.APP_NAME=/.test(b)?0:1)})})"
                  docker stop test-container
                  docker rm test-container

    e2e-appname:
        name: E2E — nazwa aplikacji + harnessy cennika i zamówień
        runs-on: ubuntu-latest
        needs: test
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            PLAYWRIGHT_DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test'
            TEST_ADMIN_PASSWORD: test-admin-pass
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Apply PostgreSQL migrations
              run: npx prisma migrate deploy

            # Harnessy muszą działać na przeglądarce Playwrighta — twarda ścieżka
            # użytkownika (`C:\Users\...`) wywalała benchmark na runnerze Linux.
            - name: Guard — brak zaszytych ścieżek Chromium w harnessach
              run: npx jest tests/frontend/playwrightChromePath.test.ts --no-coverage

            - name: Setup Chromium (Playwright)
              run: npx playwright install --with-deps chromium

            - name: Run appname E2E (retry 1x, verbose)
              env:
                  SPAWN_VERBOSE: '1'
              run: |
                  for i in 1 2; do
                    npm run test:e2e-appname:spawn && break
                    echo "Próba $i nieudana, ponawiam..."
                    [ "$i" = "2" ] && exit 1
                  done

            - name: Upload E2E forensics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-appname-forensics
                  path: |
                      e2e-appname-fail.png
                      e2e-appname-server.log
                  if-no-files-found: warn

            # Harnessy spawnują własne serwery i własne bazy (izolacja), ale
            # uruchamiają dist/server.js — build musi być gotowy.
            - name: Build (dist dla harnessów spawn)
              run: npm run build

            - name: E2E cennik — podgląd i diff PRECO (:3179)
              run: node tests/playwright/pricelistPreview.cjs --spawn

            - name: E2E QE — edycja pól zamówienia (:3177)
              run: node tests/playwright/qeQuickEditSwitch.cjs --spawn

    excel-gates:
        name: Excel — parity + golden + align (blokuje)
        runs-on: ubuntu-latest
        needs: test
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            PLAYWRIGHT_DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test'
            TEST_ADMIN_PASSWORD: test-admin-pass
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
            PORT: '3000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Apply PostgreSQL migrations
              run: npx prisma migrate deploy

            - name: Seed bazy (użytkownik, modele AI, ustawienia)
              run: npm run prisma:seed

            - name: Setup Chromium (Playwright)
              run: npx playwright install --with-deps chromium

            - name: Start serwera :3000 w tle
              run: |
                  npm run build
                  PORT=3000 NODE_ENV=test DATABASE_URL='postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public' nohup node dist/server.js > excel-gates-server.log 2>&1 &
                  echo $! > /tmp/excel-gates-server.pid

            - name: Czekaj na /health/ready (brak serwera = FAIL)
              run: |
                  for i in $(seq 1 30); do
                    if curl -sf http://localhost:3000/health/ready >/dev/null 2>&1; then
                      echo "[OK] Serwer gotowy (proba $i)"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "[BLOCKED] Serwer nie wystartowal po 60 s — excel-gates FAIL (nie SKIP)."
                  tail -n 50 excel-gates-server.log || true
                  exit 1

            - name: Parity OFF vs ON (rozjazd = FAIL)
              env:
                  BASE_URL: 'http://localhost:3000'
              run: npm run test:parity

            - name: Golden DOM (BEZ --update)
              env:
                  BASE_URL: 'http://localhost:3000'
              run: node tests/playwright/excelDomGolden.cjs

            - name: Align empty-row (BASE :3000)
              env:
                  BASE_URL: 'http://localhost:3000'
              run: npm run test:alignment

            - name: Zatrzymaj serwer
              if: always()
              run: kill "$(cat /tmp/excel-gates-server.pid)" || true

            - name: Upload Excel forensics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: excel-gates-forensics
                  path: |
                      docs/plans/parity-excel-virtual-600.json
                      docs/plans/golden-excel-dom-1200.json
                      excel-gates-server.log
                  if-no-files-found: warn
                  retention-days: 30

    axe-a11y:
        # P1.7: BLOCKING dla critical/serious (spec filtruje tylko te impakty;
