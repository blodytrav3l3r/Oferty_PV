    e2e-extended:
        name: E2E — extended regressions (raport, nie blokuje)
        runs-on: ubuntu-latest
        needs: test
        continue-on-error: true
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
