# CI/CD Pipeline dla S.O.K.
# - push na develop → lint + typecheck + testy + deploy na test
# - push na main → lint + typecheck + testy + Docker build + weryfikacja + deploy na produkcję
# - PR na main → lint + typecheck + testy

name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint (ESLint + Prettier)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint (backend)
              run: npm run lint

            - name: Run ESLint (frontend)
              run: npm run lint:frontend

            - name: Run Prettier check
              run: npm run format:check

            - name: Run encoding check
              run: npm run encoding:check

            - name: Run appname check
              run: npm run appname:check

    typecheck:
        name: Typecheck (tsc)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Typecheck backend
              run: npm run typecheck

            - name: Typecheck frontend
              run: npm run typecheck:frontend

    test:
        name: Test (Jest)
        runs-on: ubuntu-latest
        needs: [lint, typecheck]
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Przygotuj testową bazę SQLite
              run: npx prisma db push --skip-generate

            - name: Run tests
              run: npm run test:quick

    docker-build:
        name: Docker build + health check
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v7

            - name: Build Docker image
              run: docker build -t sok-oferty:${{ github.sha }} .

            - name: Health check
              run: |
                  docker run -d --name test-container -e DEFAULT_ADMIN_PASSWORD=test-admin-pass sok-oferty:${{ github.sha }}
                  echo "Sprawdzanie stanu kontenera..."
                  for i in $(seq 1 15); do
                    if docker exec test-container node -e "require('http').get('http://localhost:10000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>/dev/null; then
                      echo "[OK] Health check OK (proba $i)"
                      break
                    fi
                    if [ "$i" -eq 15 ]; then
                      echo "[FAIL] Health check nie powiodl sie po 15 probach"
                      docker logs test-container
                  docker stop test-container && docker rm test-container
                  exit 1
                    fi
                    echo "  Proba $i/15 — oczekiwanie 2s..."
                    sleep 2
                  done
                  docker exec test-container node -e "const http=require('http');http.get({host:'localhost',port:10000,path:'/index.html',headers:{'x-forwarded-proto':'https'}},r=>{let b='';r.on('data',d=>b+=d);r.on('end',()=>{process.exit(/<title>\s*S\.O\.K\./.test(b)?0:1)})})"
                  docker stop test-container
                  docker rm test-container

    e2e-appname:
        name: E2E — spójność nazwy aplikacji
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Setup Chromium (Playwright)
              run: npx playwright install --with-deps chromium

            - name: Run appname E2E
              run: npm run test:e2e-appname:spawn

    version-check:
        name: Version check (standard-version dry-run)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Dry-run standard-version
              run: npm run release:dry

    deploy-test:
        name: Deploy — test (develop)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        environment: test
        env:
            RENDER_TEST_DEPLOY_HOOK: ${{ secrets.RENDER_TEST_DEPLOY_HOOK }}
        steps:
            - uses: actions/checkout@v7

            - name: Deploy to Render (test)
              if: env.RENDER_TEST_DEPLOY_HOOK != ''
              run: |
                  set -o pipefail
                  RESP=$(curl -sf -X POST "${{ secrets.RENDER_TEST_DEPLOY_HOOK }}")
                  echo "  Triggered: $RESP"

            - name: Skip — brak RENDER_TEST_DEPLOY_HOOK
              if: env.RENDER_TEST_DEPLOY_HOOK == ''
              run: echo "[INFO] Pomijam deploy testowy — ustaw RENDER_TEST_DEPLOY_HOOK w secrets"

    deploy-production:
        name: Deploy — produkcja (main)
        runs-on: ubuntu-latest
        needs: [docker-build, version-check]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        environment: production
        env:
            RENDER_PROD_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        steps:
            - uses: actions/checkout@v7

            - name: Deploy to Render (production)
              if: env.RENDER_PROD_DEPLOY_HOOK != ''
              run: |
                  set -o pipefail
                  RESP=$(curl -sf -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}")
                  echo "  Triggered: $RESP"

            - name: Skip — brak RENDER_PROD_DEPLOY_HOOK
              if: env.RENDER_PROD_DEPLOY_HOOK == ''
              run: echo "[INFO] Pomijam deploy produkcyjny — ustaw RENDER_PROD_DEPLOY_HOOK w secrets"
