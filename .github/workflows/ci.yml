                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            PLAYWRIGHT_DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test'
            TEST_ADMIN_PASSWORD: test-admin-pass
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Apply PostgreSQL migrations
              run: npx prisma migrate deploy

            - name: Seed bazy (użytkownik, modele AI, ustawienia)
              run: npm run prisma:seed

            - name: Setup Chromium (Playwright)
              run: npx playwright install --with-deps chromium

            - name: Draft recovery + loop (izolowane serwery :3177)
              run: |
                  node tests/playwright/draftRecovery.cjs --spawn
                  node tests/playwright/draftLoopProof.cjs --spawn

            - name: Start serwera :3198 w tle (izolowany)
              run: |
                  npm run build
                  PORT=3198 NODE_ENV=test RATE_LIMIT_MULT=100 CARE_SYNC_THROTTLE_MS=0 DATABASE_URL='postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public' nohup node dist/server.js > e2e-extended-server.log 2>&1 &
                  echo $! > e2e-extended-server.pid
                   for i in $(seq 1 30); do
                     curl -sf http://localhost:3198/health/ready && break
                     sleep 2
                   done
                   curl -sf http://localhost:3198/health/ready

            - name: Excel relief/empty-row + partial order (BASE :3198)
              env:
                  BASE_URL: 'http://localhost:3198'
              run: |
                  node tests/playwright/excelReliefPair.cjs
                  node tests/playwright/excelEmptyRowAlignment.cjs
                  node tests/playwright/partialOrderRury.cjs

            - name: SPA guard — niezapisane zmiany (reuse :3198)
              env:
                  BASE_URL: 'http://localhost:3198'
              run: node tests/playwright/spa-guard.cjs

            - name: E2E spec — care + AI dashboard (reuse :3198)
              env:
                  PLAYWRIGHT_PORT: '3198'
                  PLAYWRIGHT_BASE_URL: 'http://localhost:3198'
                  PLAYWRIGHT_REUSE_SERVER: '1'
              run: |
                  npx playwright test \
                    tests/playwright/carePanel.spec.ts \
                    tests/playwright/carePanelContact.spec.ts \
                    tests/playwright/carePanelR2R3.spec.ts \
                    tests/playwright/aiDashboardSmoke.spec.ts \
                    --project=chromium

            - name: Stop serwera
              if: always()
              run: kill $(cat e2e-extended-server.pid) || true

    load-quick:
        name: Load — quick (60 s, 100 userów)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
            PORT: '3000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Apply PostgreSQL migrations
              run: npx prisma migrate deploy

            - name: Seed bazy (użytkownik, modele AI, ustawienia)
              run: npm run prisma:seed

            - name: Start serwera w tle
              run: |
                  npm run build
                  nohup node dist/server.js > /tmp/sok-load.log 2>&1 &
                  echo $! > /tmp/sok-load.pid

            - name: Czekaj na /health/ready (brak serwera = FAIL)
              run: |
                  for i in $(seq 1 30); do
                    if curl -sf http://localhost:3000/health/ready >/dev/null 2>&1; then
                      echo "[OK] Serwer gotowy (proba $i)"
                      echo "LOAD_STATUS=PASS (serwer gotowy)" >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "[BLOCKED] Serwer nie wystartowal po 60 s — load-quick FAIL (nie SKIP)."
                  tail -n 50 /tmp/sok-load.log || true
                  echo "LOAD_STATUS=BLOCKED (serwer nie wystartowal)" >> "$GITHUB_STEP_SUMMARY"
                  exit 1

            - name: Load quick (self-cleaning zapisy, DoD PASS/FAIL)
              run: node scripts/load-100.mjs --quick

            - name: Zatrzymaj serwer
              if: always()
              run: kill "$(cat /tmp/sok-load.pid)" || true

    version-check:
        name: Version check (spójność wersji)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Sprawdź spójność wersji
              run: npm run version:check

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Migrate and seed PostgreSQL test database
              run: npx prisma migrate deploy && npx ts-node prisma/seed.ts

            - name: Bootstrap v1 (3x ACTIVE), check cenników i bramka cen
              run: |
                  npx ts-node scripts/backfill-pricelist-v1.ts
                  npm run pricelist:health
                  npm run prices:verify -- --strict

    drift-check:
        name: DB schema sanity (blokuje)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Walidacja schema.prisma (prisma validate)
              run: npx prisma validate

            - name: Generowanie SQL z pustej bazy (kontrola błędów schematu)
              run: node scripts/migrate-diff-check.mjs --from-empty

    migrate-deploy-verify:
        name: DB migrate deploy verify (blokuje)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                    POSTGRES_DB: sok_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Fresh DB — migrate deploy (scenariusz A)
              run: |
                  npx prisma migrate deploy
                  npx prisma migrate status

            - name: Seed na schemacie z migracji
              run: npm run prisma:seed

            - name: Status migracji po seedzie
              run: npx prisma migrate status

            # Świeża instalacja nie ma żadnej wersji cennika: bootstrap zakłada
            # v1 ACTIVE per oś z `data/seed_*.json`, a `--strict` wymaga ACTIVE
            # na każdej osi (regres „cennik wyłącznie z wersji").
            - name: Bootstrap v1 (3x ACTIVE) i bramka cen
              run: |
                  npx ts-node scripts/backfill-pricelist-v1.ts
                  npx ts-node scripts/prices-verify.ts --strict

    deploy-production:
        name: Deploy — produkcja (main)
        runs-on: ubuntu-latest
        needs:
            [
                docker-build,
                version-check,
                e2e-smoke,
                e2e-appname,
                excel-gates,
                drift-check,
                migrate-deploy-verify
            ]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY_ENABLED == 'true'
        environment: production
        env:
            RENDER_PROD_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        steps:
            - uses: actions/checkout@v7

            - name: Deploy to Render (production)
              if: env.RENDER_PROD_DEPLOY_HOOK != ''
              run: |
                  set -o pipefail
                  curl -sSf -o /dev/null -X POST "$RENDER_PROD_DEPLOY_HOOK"
                  echo "DEPLOY_STATUS=TRIGGERED (readiness not verified)" >> "$GITHUB_STEP_SUMMARY"

            - name: Skip — brak RENDER_PROD_DEPLOY_HOOK (NOT_CONFIGURED, nie DEPLOYED)
              if: env.RENDER_PROD_DEPLOY_HOOK == ''
              run: |
                  echo "[BŁĄD] RENDER_DEPLOY_ENABLED=true, ale brak sekretu RENDER_PROD_DEPLOY_HOOK."
                  echo "DEPLOY_STATUS=NOT_CONFIGURED (wdrożenie NIE wykonane — brak RENDER_PROD_DEPLOY_HOOK)" >> "$GITHUB_STEP_SUMMARY"
                  echo "::error::deploy NOT_CONFIGURED — ustaw sekret RENDER_PROD_DEPLOY_HOOK albo usuń zmienną RENDER_DEPLOY_ENABLED"
                  exit 1
