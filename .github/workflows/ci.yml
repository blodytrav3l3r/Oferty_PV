# CI/CD Pipeline dla S.O.K.
# - push na main → lint + typecheck + testy + Docker build + weryfikacja + deploy na produkcję
# - PR na main → lint + typecheck + testy
# - Load sustained (~15 min) mieszka w osobnym load-nightly.yml (cron + dispatch),
#   żeby nie wyświetlać wiecznego Skipped w widoku pushy/PR.

name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint (ESLint + Prettier)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint (backend)
              run: npm run lint

            - name: Run ESLint (frontend)
              run: npm run lint:frontend

            - name: Run Prettier check
              run: npm run format:check

            - name: Run encoding check
              run: npm run encoding:check

            - name: Run appname check
              run: npm run appname:check

    typecheck:
        name: Typecheck (tsc)
        runs-on: ubuntu-latest
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Typecheck backend
              run: npm run typecheck

            - name: Typecheck frontend
              run: npm run typecheck:frontend

    test:
        name: Test (Jest)
        runs-on: ubuntu-latest
        needs: [lint, typecheck]
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Przygotuj testową bazę SQLite
              run: npx prisma db push --skip-generate

            - name: Run tests
              run: npm test

            - name: Run git-safety tests (sequential, no index.lock)
              run: npx jest --selectProjects git-safety --runInBand --no-coverage

            - name: Coverage summary (informacyjnie)
              run: node scripts/coverage-check.mjs

            - name: Upload coverage
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: coverage/
                  retention-days: 30

    flaky-detect:
        name: Flaky test detection (3x)
        runs-on: ubuntu-latest
        needs: test
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Przygotuj testową bazę SQLite
              run: npx prisma db push --skip-generate

            - name: Utwórz katalog raportów
              run: mkdir -p junit

            - name: Run 1/3
              run: npx jest --no-coverage --json --outputFile=junit/run1.json --testLocationInResults --silent || true

            - name: Run 2/3
              run: npx jest --no-coverage --json --outputFile=junit/run2.json --testLocationInResults --silent || true

            - name: Run 3/3
              run: npx jest --no-coverage --json --outputFile=junit/run3.json --testLocationInResults --silent || true

            - name: Compare flaky
              run: node scripts/flaky-compare.mjs junit/run1.json junit/run2.json junit/run3.json

            - name: Upload flaky report
              uses: actions/upload-artifact@v4
              with:
                  name: flaky-report
                  path: junit/
                  retention-days: 30

    docker-build:
        name: Docker build + health check
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v7

            - name: Build Docker image
              run: docker build -t sok-oferty:${{ github.sha }} .

            - name: Health check
              run: |
                  docker run -d --name test-container -e DEFAULT_ADMIN_PASSWORD=test-admin-pass sok-oferty:${{ github.sha }}
                  echo "Sprawdzanie stanu kontenera..."
                  for i in $(seq 1 15); do
                    if docker exec test-container node -e "require('http').get('http://localhost:10000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" 2>/dev/null; then
                      echo "[OK] Health check OK (proba $i)"
                      break
                    fi
                    if [ "$i" -eq 15 ]; then
                      echo "[FAIL] Health check nie powiodl sie po 15 probach"
                      docker logs test-container
                  docker stop test-container && docker rm test-container
                  exit 1
                    fi
                    echo "  Proba $i/15 — oczekiwanie 2s..."
                    sleep 2
                  done
                  docker exec test-container node -e "const http=require('http');http.get({host:'localhost',port:10000,path:'/index.html',headers:{'x-forwarded-proto':'https'}},r=>{let b='';r.on('data',d=>b+=d);r.on('end',()=>{process.exit(/<script[^>]*>window\.APP_NAME=/.test(b)?0:1)})})"
                  docker stop test-container
                  docker rm test-container

    e2e-appname:
        name: E2E — spójność nazwy aplikacji
        runs-on: ubuntu-latest
        needs: test
        timeout-minutes: 15
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Setup Chromium (Playwright)
              run: npx playwright install --with-deps chromium

            - name: Run appname E2E (retry 1x, verbose)
              env:
                  SPAWN_VERBOSE: '1'
              run: |
                  for i in 1 2; do
                    npm run test:e2e-appname:spawn && break
                    echo "Próba $i nieudana, ponawiam..."
                    [ "$i" = "2" ] && exit 1
                  done

            - name: Upload E2E forensics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-appname-forensics
                  path: |
                      e2e-appname-fail.png
                      e2e-appname-server.log
                  if-no-files-found: warn

    axe-a11y:
        name: A11y — axe (wcag2a/aa, raport)
        runs-on: ubuntu-latest
        needs: test
        continue-on-error: true
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Przygotuj testową bazę SQLite
              run: npx prisma db push --skip-generate

            - name: Seed bazy (produkty + preco)
              run: npm run prisma:seed

            - name: Setup Chromium (Playwright)
              run: npx playwright install --with-deps chromium

            - name: Run axe a11y tests
              run: npm run test:axe

    e2e-smoke:
        name: E2E — smoke flow oferty (blokujący)
        runs-on: ubuntu-latest
        needs: test
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
            TEST_ADMIN_PASSWORD: test-admin-pass
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Przygotuj testową bazę SQLite
              run: npx prisma db push --skip-generate

            - name: Seed bazy (produkty + preco)
              run: npm run prisma:seed

            - name: Setup Chromium (Playwright)
              run: npx playwright install --with-deps chromium

            - name: Run smoke E2E (playwright.config webServer)
              run: npx playwright test tests/playwright/smokeOfferFlow.spec.ts --project=chromium

    load-quick:
        name: Load — quick (60 s, 100 userów)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
            PORT: '3000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Przygotuj testową bazę SQLite
              run: npx prisma db push --skip-generate

            - name: Seed bazy (produkty + preco)
              run: npm run prisma:seed

            - name: Start serwera w tle
              run: |
                  npm run build
                  nohup node dist/server.js > /tmp/sok-load.log 2>&1 &
                  echo $! > /tmp/sok-load.pid

            - name: Czekaj na /health (skip gdy brak środowiska)
              run: |
                  for i in $(seq 1 30); do
                    if curl -sf http://localhost:3000/health >/dev/null 2>&1; then
                      echo "[OK] Serwer gotowy (proba $i)"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "[SKIP] Brak serwera po 60 s — pomijam load-quick (nie FAIL)."
                  tail -n 50 /tmp/sok-load.log || true
                  echo "LOAD_SKIP=true" >> "$GITHUB_ENV"

            - name: Load quick (self-cleaning zapisy, DoD PASS/FAIL)
              if: env.LOAD_SKIP != 'true'
              run: node scripts/load-100.mjs --quick

            - name: Zatrzymaj serwer
              if: always()
              run: kill "$(cat /tmp/sok-load.pid)" || true

    version-check:
        name: Version check (spójność wersji)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Sprawdź spójność wersji
              run: npm run version:check

    drift-check:
        name: DB schema sanity (blokuje)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Walidacja schema.prisma (prisma validate)
              run: npx prisma validate

            - name: Generowanie SQL z pustej bazy (kontrola błędów schematu)
              run: node scripts/migrate-diff-check.mjs --from-empty

    migrate-deploy-verify:
        name: DB migrate deploy verify (blokuje)
        runs-on: ubuntu-latest
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
            DATABASE_URL: 'file:./test-ci.sqlite?connection_limit=1&busy_timeout=30000'
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Fresh DB — migrate deploy (scenariusz A)
              run: |
                  rm -f test-ci.sqlite test-ci.sqlite-wal test-ci.sqlite-shm
                  npx prisma migrate deploy
                  npx prisma migrate status

            - name: Seed na schemacie z migracji
              run: npm run prisma:seed

            - name: Status migracji po seedzie
              run: npx prisma migrate status

    deploy-production:
        name: Deploy — produkcja (main)
        runs-on: ubuntu-latest
        needs: [docker-build, version-check, e2e-smoke, e2e-appname, drift-check, migrate-deploy-verify]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        environment: production
        env:
            RENDER_PROD_DEPLOY_HOOK: ${{ secrets.RENDER_PROD_DEPLOY_HOOK }}
        steps:
            - uses: actions/checkout@v7

            - name: Deploy to Render (production)
              if: env.RENDER_PROD_DEPLOY_HOOK != ''
              run: |
                  set -o pipefail
                  RESP=$(curl -sf -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}")
                  echo "  Triggered: $RESP"

            - name: Skip — brak RENDER_PROD_DEPLOY_HOOK
              if: env.RENDER_PROD_DEPLOY_HOOK == ''
              run: echo "[INFO] Pomijam deploy produkcyjny — ustaw RENDER_PROD_DEPLOY_HOOK w secrets"
