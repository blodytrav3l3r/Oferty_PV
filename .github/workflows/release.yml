# Workflow: Release
# Uruchamiany po pushu taga zgodnego z v* (np. v1.0.0, v1.1.0)
# Buduje, testuje i tworzy GitHub Release z automatycznymi notatkami.

name: Release

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_DB: sok_test
                    POSTGRES_USER: sok_test
                    POSTGRES_PASSWORD: ci-only-sok-test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U sok_test -d sok_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 12
        permissions:
            contents: write
        env:
            DATABASE_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            POSTGRES_TEST_URL: 'postgresql://sok_test:ci-only-sok-test@localhost:5432/sok_test?schema=public'
            DEFAULT_ADMIN_PASSWORD: test-admin-pass
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install PostgreSQL 18 client tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ca-certificates curl gnupg
                  sudo install -d /usr/share/postgresql-common/pgdg
                  curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | gpg --dearmor | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg > /dev/null
                  echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
                  sudo apt-get update
                  sudo apt-get install -y postgresql-client-18
                  pg_dump --version

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Typecheck
              run: npm run typecheck

            - name: Fresh DB — migrate deploy (ścieżka produkcyjna)
              run: |
                  npx prisma migrate deploy
                  npx prisma migrate status

            - name: Seed na schemacie z migracji
              run: npm run prisma:seed

            - name: Status migracji po seedzie
              run: npx prisma migrate status

            - name: Run tests
              run: npm run test:quick

            # Badge „Latest" tylko dla najwyższego tagu vX.Y.Z. Push wielu tagów
            # naraz odpala kilka runów równolegle — z `make_latest: true` badge
            # dostawał ten, który skończył ostatni (v1.55.8 wyprzedził v1.55.9).
            # Krok liczy najwyższy tag w chwili publikacji, więc wynik nie zależy
            # od kolejności zakończenia runów.
            - name: Resolve highest semver tag
              id: latest
              run: |
                  # Tagi z checkoutu to snapshot sprzed testów; świeży fetch łapie
                  # też tag wypchnięty w trakcie budowania tego runu.
                  git fetch --tags --force --prune-tags --quiet origin
                  tags=$(git tag --list 'v*')
                  latest=$(printf '%s\n' "$tags" \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                      | sort -V | tail -n 1 || true)
                  if [ -n "$latest" ] && [ "$latest" = "$GITHUB_REF_NAME" ]; then
                      echo "is_latest=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "is_latest=false" >> "$GITHUB_OUTPUT"
                  fi
                  echo "Najwyższy tag: ${latest:-brak} | ten run: $GITHUB_REF_NAME"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  make_latest: ${{ steps.latest.outputs.is_latest }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
