# P0.3 — walidacja permissions Linux + Docker dla /var/data.
#
# Odpowiada na pytanie: czy USER node + ./data:/var/data dziala na swiezym
# deployment, szczegolnie gdy ./data jeszcze nie istnieje (Docker utworzy go
# wtedy jako root:root, a build-time chown z Dockerfile jest pod bind mountem
# nieskuteczny)?
#
# Kolejnosc faz jest celowa (fail-fast nie moze ukryc diagnostyki):
#   faza A (diagnostyka storage) NAJPIERW na rm -rf data — przypadek
#     brakujacego katalogu, bez zaleznosci od seeda aplikacji;
#   faza B (pelny start) POTEM na odtworzonym stanie fresh-clone
#     (git checkout -- data/ → trackowane seed_*.json, brak sqlite).
#
# Workflow NIE zmienia runtime ani danych — tworzy tylko pliki .p03-*,
# usuwane w tych samych krokach. Nigdy `docker compose down -v`.
# Decyzja A/B/C na podstawie raportu — implementacja naprawy osobnym GO.

name: P0.3 docker data permissions

'on':
    workflow_dispatch:
    push:
        paths:
            - Dockerfile
            - docker-compose.yml
            - scripts/docker-entrypoint.sh
            - .github/workflows/p03-docker-data.yml

jobs:
    docker-data:
        name: P0.3 UID plus bind mount plus SQLite WAL plus start
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            P03_IMAGE: sok-p03:ci
            DEFAULT_ADMIN_PASSWORD: p03-ci-dummy-password
        steps:
            - uses: actions/checkout@v7

            - name: Build image
              run: docker build -t "$P03_IMAGE" .

            # ---- faza A: diagnostyka storage PRZED startem aplikacji ----
            - name: KROK 1 - UID GID node w obrazie
              run: |
                  docker run --rm --entrypoint id "$P03_IMAGE" node
                  docker run --rm --entrypoint id "$P03_IMAGE"
                  docker run --rm --entrypoint getent "$P03_IMAGE" passwd node

            - name: KROK 3 - usun data w izolowanym CI workspace
              run: rm -rf ./data && ls -la

            - name: KROK 4 - fakty host vs kontener
              run: |
                  echo "HOST_RUNNER=$(id -u):$(id -g)"
                  docker run --rm --entrypoint stat -v "$PWD/data:/var/data" "$P03_IMAGE" -c 'owner=%U(%u) group=%G(%g) mode=%a' /var/data
                  echo "HOST_DATA=$(stat -c 'owner=%U(%u) group=%G(%g) mode=%a' ./data)"
                  docker run --rm --entrypoint sh -v "$PWD/data:/var/data" "$P03_IMAGE" -c 'id; id node; ls -ld /var/data; getent passwd node'

            - name: KROK 4b - kontrola repro (oczekiwany EACCES bez prepare)
              run: |
                  if docker run --rm --entrypoint sh -v "$PWD/data:/var/data" "$P03_IMAGE" -c 'touch /var/data/.p03-probe && rm /var/data/.p03-probe'; then
                    echo "REPRO_MISSING - srodowisko nie odtwarza bledu P0.3 (zapis dziala bez prepare)"
                    exit 1
                  else
                    echo "REPRO_OK - EACCES bez prepare potwierdzony"
                  fi

            - name: KROK 4c - prepare ownership
              run: |
                  sudo -E bash scripts/docker-prepare-data.sh
                  echo "HOST_DATA_AFTER=$(stat -c 'owner=%U(%u) group=%G(%g) mode=%a' ./data)"

            - name: KROK 5 - write test jako node
              run: |
                  if docker run --rm --entrypoint sh -v "$PWD/data:/var/data" "$P03_IMAGE" -c 'touch /var/data/.p03-write && rm /var/data/.p03-write'; then
                    echo "WRITE_OK"
                  else
                    echo "WRITE_FAIL"
                    exit 1
                  fi

            - name: KROK 6 - SQLite WAL test tylko pliki p03
              run: |
                  docker run --rm --entrypoint node -v "$PWD/data:/var/data" "$P03_IMAGE" -e "const{DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/var/data/.p03-test.sqlite');const jm=db.prepare('PRAGMA journal_mode=WAL').get().journal_mode;console.log('journal_mode='+jm);db.exec('CREATE TABLE p03_test(id INTEGER PRIMARY KEY,value TEXT)');db.prepare('INSERT INTO p03_test(value) VALUES (?)').run(jm);console.log('SQLITE_OK rows='+JSON.stringify(db.prepare('SELECT * FROM p03_test').all()));db.close()"
                  docker run --rm --entrypoint sh -v "$PWD/data:/var/data" "$P03_IMAGE" -c 'rm -f /var/data/.p03-test.sqlite /var/data/.p03-test.sqlite-wal /var/data/.p03-test.sqlite-shm'
                  echo "P03_CLEANUP_OK"

            # Model A: backups/ nalezy do hosta (backup dziala host-side),
            # kontenerowy node ma miec tam ODMOWIONY zapis. Rzeczywisty zapis
            # do backupow sprawdza faza C (BACKUPS_DELETE_OK, BACKUP_HOST_OK).
            - name: KROK 7 - backups ownership (host owner, node write denied)
              run: |
                  echo "HOST_BACKUPS=$(stat -c 'owner=%U(%u) group=%G(%g) mode=%a' ./data/backups)"
                  echo "CONTAINER_BACKUPS=$(docker run --rm --entrypoint stat -v "$PWD/data:/var/data" "$P03_IMAGE" -c 'owner=%U(%u) group=%G(%g) mode=%a' /var/data/backups)"
                  HOST_UID="$(id -u)"
                  BACKUPS_UID="$(stat -c '%u' ./data/backups)"
                  if [ "$BACKUPS_UID" = "$HOST_UID" ]; then
                    echo "BACKUPS_OWNER_OK (host caller)"
                  else
                    echo "BACKUPS_OWNER_MISMATCH backup=$BACKUPS_UID host=$HOST_UID"
                    exit 1
                  fi
                  if docker run --rm --entrypoint sh -v "$PWD/data:/var/data" "$P03_IMAGE" -c 'touch /var/data/backups/.p03-write'; then
                    echo "NODE_BACKUPS_WRITE_UNEXPECTED - node nie powinien pisac do hostowych backups"
                    docker run --rm --entrypoint sh -v "$PWD/data:/var/data" "$P03_IMAGE" -c 'rm -f /var/data/backups/.p03-write' || true
                    exit 1
                  else
                    echo "NODE_BACKUPS_WRITE_DENIED (oczekiwane)"
                  fi
                  echo "BACKUPS_DIR_OK"

            # ---- faza B: pelny start na odtworzonym fresh-clone ----
            # Faza B testuje RZECZYWISTY przeplyw deploymentu (deploy-core krok 9):
            # prepare PRZED compose up. Bez tego fresh-clone (runner 1001) pada
            # na migrate dokladnie jak run bazowy 35751272651.
            - name: KROK 8 - odtworz fresh-clone po fazie A
              run: |
                  sudo rm -rf ./data
                  git checkout -- data/
                  ls -la ./data
                  test ! -e ./data/app_database.sqlite && echo "FRESH_CLONE_OK"
                  sudo -E bash scripts/docker-prepare-data.sh
                  echo "HOST_DATA_PHASEB=$(stat -c 'owner=%U(%u) group=%G(%g) mode=%a' ./data)"

            - name: KROK 8 - start aplikacji compose
              run: docker compose up -d --build

            - name: KROK 8 - czekaj na health ready
              run: |
                  for i in $(seq 1 48); do
                    if curl -sf http://localhost:3000/health/ready >/dev/null 2>&1; then
                      echo "HEALTH_READY_OK proba $i"
                      curl -s http://localhost:3000/health/ready
                      echo
                      exit 0
                    fi
                    sleep 5
                  done
                  echo "HEALTH_READY_FAIL"
                  docker compose logs --tail=100 app || true
                  exit 1

            - name: KROK 8 - WAL aktywny na zywym kontenerze
              run: |
                  docker compose exec -T app sh -c 'ls -la /var/data/*.sqlite*'
                  docker compose exec -T app node -e "const{DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/var/data/app_database.sqlite',{readOnly:true});console.log('LIVE_JOURNAL_MODE='+db.prepare('PRAGMA journal_mode').get().journal_mode);db.close()"

            - name: KROK 8 - stop bez minus v
              if: always()
              run: docker compose stop || true

            # ---- faza C: hostowy backup/restore jako runner (nie root) ----
            - name: KROK 10 - toolchain hosta dla backupu
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: KROK 10 - npm ci plus prisma generate
              run: |
                  npm ci --no-audit --no-fund
                  export DATABASE_URL="file:$PWD/data/app_database.sqlite?connection_limit=1&busy_timeout=30000"
                  npx prisma generate

            - name: KROK 10 - backup jako host runner
              run: |
                  echo "BACKUP_RUNNER=$(id -u):$(id -g)"
                  stat -c 'backups przed: owner=%U(%u) mode=%a' ./data/backups || true
                  touch ./data/backups/.p03-del && rm ./data/backups/.p03-del && echo "BACKUPS_DELETE_OK"
                  export DATABASE_URL="file:$PWD/data/app_database.sqlite?connection_limit=1&busy_timeout=30000"
                  npm run backup
                  BACKUP_FILE="$(ls -t ./data/backups/backup_*.sqlite | head -1)"
                  test -n "$BACKUP_FILE" && test -f "$BACKUP_FILE.sha256" && echo "BACKUP_HOST_OK plik=$BACKUP_FILE"
                  echo "$BACKUP_FILE" > /tmp/p03-backup-file.txt

            # Kontrakt: restore to operacja uprzywilejowana. Zwykly host user MA
            # dostac EACCES na node-owned DB (dowod granicy), sudo MA przejsc.
            - name: KROK 11 - restore jako host runner (oczekiwany EACCES)
              run: |
                  echo "RESTORE_RUNNER=$(id -u):$(id -g)"
                  stat -c 'db przed: owner=%U(%u) group=%G(%g) mode=%a' ./data/app_database.sqlite
                  export DATABASE_URL="file:$PWD/data/app_database.sqlite?connection_limit=1&busy_timeout=30000"
                  if npm run restore -- "$(cat /tmp/p03-backup-file.txt)" --yes; then
                    echo "RESTORE_DENIED_MISSING - zwykly user nie powinien nadpisac node-owned DB"
                    exit 1
                  else
                    echo "RESTORE_DENIED_OK - granica ownership potwierdzona"
                  fi

            - name: KROK 11b - restore przez sudo (kontrakt)
              run: |
                  export DATABASE_URL="file:$PWD/data/app_database.sqlite?connection_limit=1&busy_timeout=30000"
                  sudo -E npm run restore -- "$(cat /tmp/p03-backup-file.txt)" --yes
                  echo "RESTORE_HOST_OK"
                  stat -c 'db po: owner=%U(%u) group=%G(%g) mode=%a' ./data/app_database.sqlite

            - name: KROK 9 - klasyfikacja A B C
              if: always()
              run: |
                  echo "P0.3-CLASSIFY A gdy WRITE_OK plus SQLITE_OK plus BACKUPS_DIR_OK plus NODE_BACKUPS_WRITE_DENIED plus HEALTH_READY_OK plus BACKUP_HOST_OK plus RESTORE_HOST_OK - bez zmian runtime."
                  echo "P0.3-CLASSIFY B gdy WRITE_FAIL EACCES z winy wlasciciela hosta - host-side prep, UID dynamicznie z obrazu."
                  echo "P0.3-CLASSIFY C gdy B niewystarczajace - model user UID, projekt osobny, bez auto-implementacji."

            - name: Sprzatanie bez minus v
              if: always()
              run: |
                  docker compose down || true
                  docker rm -f sok-oferty || true
                  sudo rm -rf ./data || rm -rf ./data || true
