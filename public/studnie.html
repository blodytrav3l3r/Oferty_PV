        <style id="page-loader-critical">
            html:not(.is-loaded) {
                visibility: hidden;
            }
            html.is-loaded {
                visibility: visible;
            }
            #page-loader {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                align-content: center;
                gap: 0.75rem;
                background: var(--bg-primary, #0a0e1a);
                z-index: 9999;
                transition: opacity 0.25s ease;
            }
            html.is-loaded #page-loader {
                opacity: 0;
                pointer-events: none;
                visibility: hidden;
            }
            .page-loader-spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(99, 102, 241, 0.15);
                border-top-color: #6366f1;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                html:not(.is-loaded) {
                    visibility: visible;
                }
                #page-loader {
                    transition: none;
                }
                .page-loader-spinner {
                    animation: none;
                }
            }
        </style>
        <noscript
            ><style>
                html:not(.is-loaded) {
                    visibility: visible;
                }
                #page-loader {
                    display: none !important;
                }
            </style></noscript
        >

                                grid-template-columns: repeat(3, 1fr);
                                justify-items: stretch;
                            "

                                <div class="ws-label fs-065-nowrap">Wymagane</div>
                                <div class="ws-value fs-075-nowrap" id="ws-req-height">—</div>
                            </div>
                            <div class="ws-item p-2">
                                <div class="ws-label fs-065-nowrap">Zbudowano</div>
                                <div class="ws-value accent fs-075-nowrap" id="ws-height">0 mm</div>
                            </div>
                            <div class="ws-item p-2">
                                <div class="ws-label fs-065-nowrap">Zostało</div>
                                <div class="ws-value fs-075-nowrap" id="ws-diff-height">—</div>
                            </div>
                        </div>
                        <div class="preview-row">
                            <div class="preview-tile preview-tile--unit" id="unit-tile">
                                <button
                                    type="button"
                                    id="unit-settings-btn"
                                    class="preview-tile__btn"
                                    onclick="openUnitSettingsPopup(this)"
                                    title="Jednostki wysokości"
                                    aria-label="Ustawienia jednostek"
                                    aria-haspopup="dialog"
                                >
                                    <i data-lucide="ruler"></i>
                                </button>
                            </div>
                            <div class="preview-tile preview-tile--price">
                                <span class="preview-tile__label">Cena:</span>
                                <span class="preview-tile__value" id="ws-price">0</span>
                            </div>
                            <div
                                class="preview-tile preview-tile--delete"
                                id="svg-trash"
                                title="Kliknij, aby usunąć studnię"
                                onclick="removeWell(currentWellIndex)"
                                onmouseenter="
                                    if (window.svgDragStartIndex >= 0) {
                                        this.style.background = 'rgba(var(--danger-rgb), 0.2)';
                                        this.style.borderColor = 'var(--danger)';
                                    }
                                "
                                onmouseleave="
                                    this.style.background = 'rgba(var(--danger-rgb), 0.08)';
                                    this.style.borderColor = 'rgba(var(--danger-rgb), 0.22)';
                                "
                            >
                                <button
                                    type="button"
                                    class="preview-tile__btn preview-tile__btn--danger"
                                    tabindex="-1"
                                    aria-label="Usuń studnię"
                                >
                                    <i data-lucide="trash-2"></i>
                                </button>
                            </div>
                        </div>

            (function () {
                var loadPromise =
                    document.readyState === 'complete'
                        ? Promise.resolve()
                        : new Promise(function (r) {
                              window.addEventListener('load', r, { once: true });
                          });
                var fontsPromise =
                    document.fonts && document.fonts.ready
                        ? document.fonts.ready
                        : Promise.resolve();
                Promise.race([
                    Promise.all([loadPromise, fontsPromise]),
                    new Promise(function (r) {
                        setTimeout(r, 3000);
                    })
                ]).then(function () {
                    document.documentElement.classList.add('is-loaded');
                    var loader = document.getElementById('page-loader');
                    if (loader)
                        setTimeout(function () {
                            loader.remove();
                        }, 300);
                });
            })();
