        <main class="main">
            <div class="section active" id="section-builder">
                <div class="well-app-layout intro-mode">
                    <!-- LEFT: Well Diagram -->
                    <div
                        class="well-diagram-panel"
                        id="drop-zone-diagram"
                        ondragover="allowDropWellComponent(event)"
                        ondragleave="dragLeaveWellComponent(event)"
                        ondrop="dropWellComponent(event)"
                    >
                        <div class="well-summary-mini gap-1 ws-grid-4">
                            <div class="ws-item p-2">
                                <div class="ws-label fs-065-nowrap">Wymagane</div>
                                <div class="ws-value fs-075-nowrap" id="ws-req-height">—</div>
                            </div>
                            <div class="ws-item p-2">
                                <div class="ws-label fs-065-nowrap">Zbudowano</div>
                                <div class="ws-value accent fs-075-nowrap" id="ws-height">0 mm</div>
                            </div>
                            <div class="ws-item p-2">
                                <div class="ws-label fs-065-nowrap">Zostało</div>
                                <div class="ws-value fs-075-nowrap" id="ws-diff-height">—</div>
                            </div>
                            <button
                                type="button"
                                id="svg-trash"
                                class="ws-item btn-icon-danger"
                                aria-label="Usuń studnię"
                                title="Usuń studnię"
                                onclick="removeWell(currentWellIndex)"
                            >
                                <div class="ws-label ws-label-danger">Usuń</div>
                                <div class="ws-value ws-value-icon">
                                    <i data-lucide="trash-2" aria-hidden="true"></i>
                                </div>
                            </button>
                        </div>
                        <div class="well-summary-mini gap-1 ws-price-bar">
                            <div class="ws-label ws-label-success">Cena:</div>
                            <div class="ws-value ws-value-success" id="ws-price">0</div>
                        </div>
                        <svg
                            id="well-diagram"
                            class="well-diagram-svg"
                            viewBox="0 0 300 500"
                            preserveAspectRatio="xMidYMax meet"
                        ></svg>
                    </div>

                    <!-- CENTER COLUMN -->
                    <div class="well-center-column">
                        <!-- Wizard Step Indicator -->
                        <div
                            id="partial-wizard-nav"
                            data-partial="partials/shared/wizard-nav.html"
                        ></div>

                        <!-- Spinner ładowania widoczny podczas wczytywania danych z URL -->
                        <div id="wizard-loading-spinner" class="wizard-loading-spinner gap-4">
                            <div class="spinner-loader"></div>
                            <span class="wizard-loading-text">Wczytywanie konfiguracji...</span>
                        </div>

                        <!-- ====== WIZARD STEP 1: Client & Offer Data ====== -->

                            id="partial-step1"
                            data-partial="partials/shared/step1-client.html"
                        ></div>
                        <div

                        ></div>
                        <div

                        <!-- ====== WIZARD STEP 4: KARTA BUDOWY ====== -->
                        <div
                            id="partial-step4"
                            data-partial="partials/studnie/step4-build-card.html"
                        ></div>
                    </div>
                    <!-- /well-center-column -->

                    <div id="partial-sidebar" data-partial="partials/studnie/sidebar.html"></div>
                    <!-- /wells-sidebar -->
                </div>
                <!-- /well-app-layout -->

                    </button>
                </div>
            </div>
