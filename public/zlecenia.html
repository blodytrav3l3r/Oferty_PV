<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="{{APP_NAME}} — Kartoteka Zleceń Produkcyjnych." />
        <title>{{APP_NAME}} — Kartoteka Zleceń</title>
        <link rel="stylesheet" href="css/style.base.css?v=1.17.1" />
        <link rel="stylesheet" href="css/style.cards.css?v=1.17.1" />
        <link rel="stylesheet" href="css/style.responsive.css?v=1.17.1" />
        <link rel="stylesheet" href="css/print.css?v=1.17.1" media="print" />
        <link rel="stylesheet" href="css/style.utilities.css?v=1.17.1" />
        <link rel="stylesheet" href="css/zlecenia.css?v=1.17.1" />
    </head>

    <body>
        <!-- HEADER (hidden when inside SPA iframe) -->
        <header class="header">
            <div class="header-inner">
                <div class="header-left">
                    <div class="logo">
                        <span>Kartoteka Zleceń</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="section active" id="section-zlecenia">
                <div class="zlecenia-page">
                    <!-- Summary stats -->
                    <div class="zlecenia-stats" id="zlecenia-stats"></div>

                    <!-- Main card -->
                    <section class="zl-section">
                        <!-- Header: search + refresh -->
                        <div class="zlecenia-header">
                            <div class="search-box zl-search-box">
                                <svg
                                    class="ka-search-icon"
                                    aria-hidden="true"
                                    focusable="false"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <circle cx="11" cy="11" r="7" />
                                    <path d="m21 21-4.35-4.35" />
                                </svg>
                                <input
                                    type="text"
                                    id="zlecenia-search-input"
                                    class="form-input form-input-sm zl-search-input"
                                    placeholder="Szukaj: firma, NIP, budowa, nr, użytkownik..."
                                    aria-label="Szukaj zleceń"
                                />
                            </div>

                            <button
                                type="button"
                                class="btn btn-secondary btn-sm shrink-0"
                                onclick="AppZlecenia.loadOrders()"
                                title="Odśwież bazę zleceń"
                            >
                                <i data-lucide="refresh-cw"></i> Odśwież
                            </button>
                        </div>

                        <!-- Toolbar dodatkowych filtrów: status, daty, użytkownik, czyszczenie -->
                        <div class="zlecenia-virtual-toolbar" id="zlecenia-toolbar">
                            <div class="zlecenia-filters">
                                <button
                                    type="button"
                                    class="zlecenia-filter-tab active"
                                    data-filter="all"
                                    onclick="AppZlecenia.setFilter('all')"
                                >
                                    Wszystkie
                                </button>
                                <button
                                    type="button"
                                    class="zlecenia-filter-tab"
                                    data-filter="draft"
                                    onclick="AppZlecenia.setFilter('draft')"
                                >
                                    <i data-lucide="hourglass-2"></i> Oczekujące
                                </button>
                                <button
                                    type="button"
                                    class="zlecenia-filter-tab"
                                    data-filter="accepted"
                                    onclick="AppZlecenia.setFilter('accepted')"
                                >
                                    <i data-lucide="check-check"></i> Zatwierdzone
                                </button>
                            </div>

                            <div class="zlecenia-date-filter" id="zlecenia-date-filter">
                                <label for="zlecenia-date-from" class="toolbar-label"
                                    >Data od</label
                                >
                                <input
                                    type="date"
                                    id="zlecenia-date-from"
                                    class="form-input form-input-sm"
                                    title="Data od"
                                    aria-label="Data od"
                                />
                                <span class="zlecenia-date-sep" aria-hidden="true">&ndash;</span>
                                <label for="zlecenia-date-to" class="toolbar-label">Data do</label>
                                <input
                                    type="date"
                                    id="zlecenia-date-to"
                                    class="form-input form-input-sm"
                                    title="Data do"
                                    aria-label="Data do"
                                />
                                <button
                                    type="button"
                                    id="zlecenia-date-clear"
                                    class="btn btn-sm btn-secondary"
                                    title="Wyczyść filtr dat"
                                    aria-label="Wyczyść filtr dat"
                                >
                                    <i data-lucide="x"></i>
                                </button>
                            </div>

                            <label for="zlecenia-user-filter" class="toolbar-label">Opiekun:</label>
                            <select
                                id="zlecenia-user-filter"
                                class="form-select zlecenia-select-sm"
                                aria-label="Użytkownik"
                                title="Filtruj po użytkowniku"
                            >
                                <option value="">Użytkownik: wszyscy</option>
                            </select>

                            <button
                                type="button"
                                id="zlecenia-clear-filters"
                                class="btn btn-secondary btn-sm"
                                onclick="AppZlecenia.clearAllFilters()"
                                title="Wyczyść wszystkie aktywne filtry"
                            >
                                Wyczyść filtry (0)
                            </button>
                        </div>

                        <!-- Batch action bar (visible when items selected) -->
                        <div class="zlecenia-batch-bar" id="zlecenia-batch-bar">
                            <div class="batch-info">
                                <i data-lucide="check-check"></i> Zaznaczono:
                                <span class="batch-count">0</span>
                                <span class="batch-scope"></span>
                            </div>
                            <div class="batch-actions">
                                <button
                                    type="button"
                                    class="batch-btn batch-btn-print"
                                    onclick="AppZlecenia.printBatchZlecenia()"
                                >
                                    <i data-lucide="printer"></i> Drukuj zlecenia
                                </button>
                                <button
                                    type="button"
                                    class="batch-btn batch-btn-label"
                                    onclick="AppZlecenia.printBatchEtykiety()"
                                >
                                    <i data-lucide="tag"></i> Drukuj etykiety
                                </button>
                                <button
                                    type="button"
                                    class="batch-btn batch-btn-select-all"
                                    id="zlecenia-select-all-btn"
                                    onclick="AppZlecenia.selectAllRows()"
                                >
                                    <i data-lucide="check-check"></i> Zaznacz wszystkie
                                </button>
                                <button
                                    type="button"
                                    class="batch-btn batch-btn-delete"
                                    onclick="AppZlecenia.deleteSelectedOrders()"
                                >
                                    <i data-lucide="trash-2"></i> Usuń zaznaczone
                                </button>
                            </div>
                        </div>

                        <!-- Table -->
                        <div class="zlecenia-table-container">
                            <table class="zlecenia-table" id="zlecenia-table">
                                <thead>
                                    <tr>
                                        <th class="col-w40" scope="col" aria-sort="none">
                                            <input
                                                type="checkbox"
                                                id="zlecenia-select-all"
                                                class="zlecenia-master-cb"
                                                onclick="AppZlecenia.toggleSelectAll(this)"
                                                title="Klik: nic -> widoczne -> wszystkie spełniające filtr -> nic"
                                                aria-label="Zaznacz wszystkie"
                                                aria-checked="false"
                                            />
                                        </th>
                                        <th class="col-w140" scope="col" aria-sort="none">
                                            Nr zlecenia
                                        </th>
                                        <th class="col-w130" scope="col" aria-sort="none">Data</th>
                                        <th scope="col" aria-sort="none">Budowa / Studnia</th>
                                        <th class="col-w150" scope="col" aria-sort="none">
                                            Nr zamówienia
                                        </th>
                                        <th scope="col" aria-sort="none">Element</th>
                                        <th scope="col" aria-sort="none">Opiekun</th>
                                        <th scope="col" aria-sort="none">Wygenerował</th>
                                        <th class="col-w105" scope="col" aria-sort="none">
                                            Status
                                        </th>
                                        <th class="col-w150-right" scope="col" aria-sort="none">
                                            Akcje
                                        </th>
                                    </tr>
                                </thead>
                                <tbody id="zlecenia-table-body">
                                    <tr>
                                        <td class="zl-empty-cell" colspan="10">
                                            Ładowanie danych z serwera...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div
                            class="zlecenia-sentinel"
                            id="zlecenia-sentinel"
                            aria-live="polite"
                            aria-busy="false"
                        ></div>
                    </section>
                </div>
            </div>
        </main>

        <!-- Toast container -->
        <div id="toast-container" class="toast-container" aria-live="polite"></div>

        <!-- Dependencies -->
        <script src="js/shared/formatters.js?v=1.17.1"></script>
        <script src="js/shared/auth.js?v=1.17.1"></script>
        <script src="js/shared/logger.js?v=1.17.1"></script>
        <script src="js/shared/constants.js?v=1.17.1"></script>
        <script type="module" src="js/shared/escapeHtml.js?v=1.17.1"></script>
        <script type="module" src="js/shared/modalCore.js?v=1.17.1"></script>
        <script type="module" src="js/shared/toast.js?v=1.17.1"></script>
        <script type="module" src="js/shared/fetchJson.js?v=1.17.1"></script>
        <script type="module" src="js/shared/debounce.js?v=1.17.1"></script>
        <script src="js/shared/ui.js?v=1.17.1"></script>
        <script src="js/spa/zleceniaHelpers.js?v=1.17.1"></script>
        <script src="js/spa/zleceniaRender.js?v=1.17.1"></script>
        <script src="js/spa/zlecenia.js?v=1.17.1"></script>
        <script src="js/shared/iconsSlim.js?v=1.17.1"></script>

        <!-- Wymuszenie jedynego punktu wejścia: app.html#/<module> -->
        <script>
            if (window.top === window.self) {
                const module =
                    location.pathname
                        .split('/')
                        .pop()
                        .replace(/\.html?$/, '') || 'zlecenia';
                window.location.replace('/app.html#/' + module);
            }
        </script>
    </body>
</html>
