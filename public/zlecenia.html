<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="{{APP_NAME}} — Kartoteka Zleceń Produkcyjnych." />
        <title>{{APP_NAME}} — Kartoteka Zleceń</title>
        <style id="page-loader-critical">
            html:not(.is-loaded) {
                visibility: hidden;
            }
            html.is-loaded {
                visibility: visible;
            }
            #page-loader {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                align-content: center;
                gap: 0.75rem;
                background: var(--bg-primary, #0a0e1a);
                z-index: 9999;
                transition: opacity 0.25s ease;
            }
            html.is-loaded #page-loader {
                opacity: 0;
                pointer-events: none;
                visibility: hidden;
            }
            .page-loader-spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(99, 102, 241, 0.15);
                border-top-color: #6366f1;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                html:not(.is-loaded) {
                    visibility: visible;
                }
                #page-loader {
                    transition: none;
                }
                .page-loader-spinner {
                    animation: none;
                }
            }
        </style>
        <noscript
            ><style>
                html:not(.is-loaded) {
                    visibility: visible;
                }
                #page-loader {
                    display: none !important;
                }
            </style></noscript
        >
        <link rel="stylesheet" href="css/style.base.css?v=1.19.6" />
        <link rel="stylesheet" href="css/style.cards.css?v=1.19.6" />
        <link rel="stylesheet" href="css/style.responsive.css?v=1.19.6" />
        <link rel="stylesheet" href="css/style.utilities.css?v=1.19.6" />
        <link rel="stylesheet" href="css/zlecenia.css?v=1.19.6" />
    </head>

    <body>
        <div id="page-loader" aria-hidden="true">
            <div class="page-loader-spinner" aria-hidden="true"></div>
            <span
                style="
                    color: var(--text-muted, #94a3b8);
                    font:
                        500 0.85rem Inter,
                        sans-serif;
                    letter-spacing: 0.5px;
                "
                >Ładowanie...</span
            >
        </div>
        <!-- HEADER (hidden when inside SPA iframe) -->
        <header class="header">
            <div class="header-inner">
                <div class="header-left">
                    <div class="logo">
                        <span>Kartoteka Zleceń</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="section active" id="section-zlecenia">
                <div class="zlecenia-page">
                    <!-- Summary stats -->
                    <div class="zlecenia-stats" id="zlecenia-stats"></div>

                    <!-- Main card -->
                    <section style="margin-bottom: var(--section-gap-lg)">
                        <!-- Header: search + refresh -->
                        <div class="zlecenia-header">
                            <div
                                class="search-box"
                                style="margin: 0; position: relative; flex: 1; min-width: 300px"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    style="
                                        position: absolute;
                                        left: 0.7rem;
                                        top: 50%;
                                        transform: translateY(-50%);
                                        width: 1rem;
                                        color: var(--text-muted);
                                    "
                                >
                                    <circle cx="11" cy="11" r="7" />
                                    <path d="m21 21-4.35-4.35" />
                                </svg>
                                <input
                                    type="text"
                                    id="zlecenia-search-input"
                                    class="form-input form-input-sm"
                                    placeholder="Szukaj: studnia, budowa, element, SNR, opiekun, nr zlecenia/zamówienia..."
                                    style="
                                        font-weight: normal;
                                        padding-left: 2.4rem !important;
                                        width: 100%;
                                    "
                                />
                            </div>

                            <button
                                type="button"
                                class="btn btn-secondary btn-sm"
                                onclick="AppZlecenia.loadOrders()"
                                title="Odśwież bazę zleceń"
                                style="flex-shrink: 0"
                            >
                                <i data-lucide="refresh-cw"></i> Odśwież
                            </button>
                        </div>

                        <!-- Toolbar dodatkowych filtrów: status, daty, użytkownik, czyszczenie -->
                        <div class="zlecenia-virtual-toolbar" id="zlecenia-toolbar">
                            <div class="zlecenia-filters">
                                <button
                                    type="button"
                                    class="zlecenia-filter-tab active"
                                    data-filter="all"
                                    onclick="AppZlecenia.setFilter('all')"
                                >
                                    Wszystkie
                                </button>
                                <button
                                    type="button"
                                    class="zlecenia-filter-tab"
                                    data-filter="draft"
                                    onclick="AppZlecenia.setFilter('draft')"
                                >
                                    <i data-lucide="hourglass-2"></i> Oczekujące
                                </button>
                                <button
                                    type="button"
                                    class="zlecenia-filter-tab"
                                    data-filter="accepted"
                                    onclick="AppZlecenia.setFilter('accepted')"
                                >
                                    <i data-lucide="check-check"></i> Zatwierdzone
                                </button>
                            </div>

                            <div class="zlecenia-date-filter" id="zlecenia-date-filter">
                                <span class="toolbar-label">Data od</span>
                                <input
                                    type="date"
                                    id="zlecenia-date-from"
                                    class="form-input form-input-sm"
                                    title="Data od"
                                    aria-label="Data od"
                                />
                                <span class="zlecenia-date-sep" aria-hidden="true">&ndash;</span>
                                <span class="toolbar-label">Data do</span>
                                <input
                                    type="date"
                                    id="zlecenia-date-to"
                                    class="form-input form-input-sm"
                                    title="Data do"
                                    aria-label="Data do"
                                />
                                <button
                                    type="button"
                                    id="zlecenia-date-clear"
                                    class="btn btn-sm btn-secondary"
                                    title="Wyczyść filtr dat"
                                    aria-label="Wyczyść filtr dat"
                                >
                                    <i data-lucide="x"></i>
                                </button>
                            </div>

                            <input
                                type="text"
                                id="zlecenia-prod-number-input"
                                class="form-input form-input-sm zlecenia-filter-input"
                                placeholder="Nr zlecenia"
                                aria-label="Nr zlecenia"
                                title="Filtruj po numerze zlecenia produkcyjnego"
                                style="width: 150px"
                            />
                            <input
                                type="text"
                                id="zlecenia-sales-number-input"
                                class="form-input form-input-sm zlecenia-filter-input"
                                placeholder="Nr zamówienia"
                                aria-label="Nr zamówienia"
                                title="Filtruj po numerze zamówienia handlowego"
                                style="width: 150px"
                            />

                            <span class="toolbar-label">Opiekun:</span>
                            <select
                                id="zlecenia-user-filter"
                                class="form-select zlecenia-select-sm"
                                aria-label="Użytkownik"
                                title="Filtruj po użytkowniku"
                            >
                                <option value="">Użytkownik: wszyscy</option>
                            </select>

                            <select
                                id="zlecenia-sort-select"
                                class="form-select zlecenia-select-sm"
                                aria-label="Sortowanie"
                                title="Sortowanie wyników"
                            >
                                <option value="createdAt-desc">Data ↓ (najnowsze)</option>
                                <option value="createdAt-asc">Data ↑ (najstarsze)</option>
                                <option value="productionOrderNumber-asc">Nr zlecenia A→Z</option>
                                <option value="productionOrderNumber-desc">Nr zlecenia Z→A</option>
                            </select>

                            <button
                                type="button"
                                id="zlecenia-preset-today"
                                class="btn btn-secondary btn-sm"
                                title="Ustaw daty na dziś"
                                aria-label="Filtr: dziś"
                            >
                                Dziś
                            </button>
                            <button
                                type="button"
                                id="zlecenia-preset-7d"
                                class="btn btn-secondary btn-sm"
                                title="Ostatnie 7 dni"
                                aria-label="Filtr: ostatnie 7 dni"
                            >
                                7 dni
                            </button>
                            <button
                                type="button"
                                id="zlecenia-preset-30d"
                                class="btn btn-secondary btn-sm"
                                title="Ostatnie 30 dni"
                                aria-label="Filtr: ostatnie 30 dni"
                            >
                                30 dni
                            </button>

                            <button
                                type="button"
                                id="zlecenia-clear-filters"
                                class="btn btn-secondary btn-sm"
                                onclick="AppZlecenia.clearAllFilters()"
                                title="Wyczyść wszystkie aktywne filtry"
                            >
                                Wyczyść filtry (0)
                            </button>
                        </div>

                        <!-- Batch action bar (visible when items selected) -->
                        <div class="zlecenia-batch-bar" id="zlecenia-batch-bar">
                            <div class="batch-info">
                                <i data-lucide="check-check"></i> Zaznaczono:
                                <span class="batch-count">0</span>
                                <span class="batch-scope"></span>
                            </div>
                            <div class="batch-actions">
                                <button
                                    type="button"
                                    class="batch-btn batch-btn-print"
                                    onclick="AppZlecenia.printBatchZlecenia()"
                                >
                                    <i data-lucide="printer"></i> Drukuj zlecenia
                                </button>
                                <button
                                    type="button"
                                    class="batch-btn batch-btn-label"
                                    onclick="AppZlecenia.printBatchEtykiety()"
                                >
                                    <i data-lucide="tag"></i> Drukuj etykiety
                                </button>
                                <button
                                    type="button"
                                    class="batch-btn batch-btn-select-all"
                                    id="zlecenia-select-all-btn"
                                    onclick="AppZlecenia.selectAllRows()"
                                >
                                    <i data-lucide="check-check"></i> Zaznacz wszystkie
                                </button>
                                <button
                                    type="button"
                                    class="batch-btn batch-btn-delete"
                                    onclick="AppZlecenia.deleteSelectedOrders()"
                                >
                                    <i data-lucide="trash-2"></i> Usuń zaznaczone
                                </button>
                            </div>
                        </div>

                        <!-- Table -->
                        <div class="zlecenia-table-container">
                            <table class="zlecenia-table" id="zlecenia-table">
                                <thead>
                                    <tr>
                                        <th style="width: 40px; text-align: center">
                                            <input
                                                type="checkbox"
                                                id="zlecenia-select-all"
                                                class="zlecenia-master-cb"
                                                onclick="AppZlecenia.toggleSelectAll(this)"
                                                title="Klik: nic -> widoczne -> wszystkie spełniające filtr -> nic"
                                                aria-label="Zaznacz wszystkie"
                                                aria-checked="false"
                                            />
                                        </th>
                                        <th style="width: 140px">Nr zlecenia</th>
                                        <th style="width: 130px">Data</th>
                                        <th>Budowa / Studnia</th>
                                        <th style="width: 150px">Nr zamówienia</th>
                                        <th>Element</th>
                                        <th>Opiekun</th>
                                        <th>Wygenerował</th>
                                        <th style="width: 105px">Status</th>
                                        <th style="width: 150px; text-align: right">Akcje</th>
                                    </tr>
                                </thead>
                                <tbody id="zlecenia-table-body">
                                    <tr>
                                        <td
                                            colspan="10"
                                            style="
                                                text-align: center;
                                                padding: 2rem;
                                                color: var(--text-muted);
                                                font-style: italic;
                                            "
                                        >
                                            Ładowanie danych z serwera...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="zlecenia-sentinel" id="zlecenia-sentinel"></div>
                    </section>
                </div>
            </div>
        </main>

        <!-- Toast container -->
        <div id="toast-container" class="toast-container" aria-live="polite"></div>

        <!-- Dependencies -->
        <script src="js/shared/formatters.js?v=1.19.6"></script>
        <script src="js/shared/auth.js?v=1.19.6"></script>
        <script src="js/shared/logger.js?v=1.19.6"></script>
        <script src="js/shared/constants.js?v=1.19.6"></script>
        <script type="module" src="js/shared/escapeHtml.js?v=1.19.6"></script>
        <script type="module" src="js/shared/modalCore.js?v=1.19.6"></script>
        <script type="module" src="js/shared/toast.js?v=1.19.6"></script>
        <script type="module" src="js/shared/fetchJson.js?v=1.19.6"></script>
        <script type="module" src="js/shared/debounce.js?v=1.19.6"></script>
        <script src="js/shared/ui.js?v=1.19.6"></script>
        <script src="js/spa/zleceniaHelpers.js?v=1.19.6"></script>
        <script src="js/spa/zleceniaRender.js?v=1.19.6"></script>
        <script src="js/spa/zlecenia.js?v=1.19.6"></script>
        <script src="js/shared/iconsSlim.js?v=1.19.6"></script>

        <!-- Wymuszenie jedynego punktu wejścia: app.html#/<module> -->
        <script>
            if (window.top === window.self) {
                const module =
                    location.pathname
                        .split('/')
                        .pop()
                        .replace(/\.html?$/, '') || 'zlecenia';
                window.location.replace('/app.html#/' + module);
            }
        </script>
        <script>
            (function () {
                var loadPromise =
                    document.readyState === 'complete'
                        ? Promise.resolve()
                        : new Promise(function (r) {
                              window.addEventListener('load', r, { once: true });
                          });
                var fontsPromise =
                    document.fonts && document.fonts.ready
                        ? document.fonts.ready
                        : Promise.resolve();
                Promise.race([
                    Promise.all([loadPromise, fontsPromise]),
                    new Promise(function (r) {
                        setTimeout(r, 3000);
                    })
                ]).then(function () {
                    document.documentElement.classList.add('is-loaded');
                    var loader = document.getElementById('page-loader');
                    if (loader)
                        setTimeout(function () {
                            loader.remove();
                        }, 300);
                });
            })();
        </script>
    </body>
</html>
