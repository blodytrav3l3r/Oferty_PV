<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%">
    <defs>
        <!-- Gradienty dopasowane do modułów z UI -->
        <linearGradient id="uiStudnie" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34D399" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>

        <linearGradient id="uiRury" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#2563EB" />
        </linearGradient>

        <linearGradient id="uiZlecenia" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FBBF24" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>

        <linearGradient id="uiPurpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="50%" stop-color="#8B5CF6" />
            <stop offset="100%" stop-color="#34D399" />
        </linearGradient>

        <!-- Subtelna poświata (Glow) -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Obszar animowanego podkreślenia -->
        <clipPath id="lineClip">
            <rect x="0" y="44" width="215" height="3.5" rx="1.75" />
        </clipPath>
    </defs>

    <style>
        /* KEYFRAME ANIMATIONS */
        @keyframes orbitPulse {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes calcScanner {
            0%,
            100% {
                transform: translateY(-7px);
                opacity: 0.3;
            }
            50% {
                transform: translateY(7px);
                opacity: 0.9;
            }
        }

        @keyframes dotGlow {
            0%,
            100% {
                fill: #8b5cf6;
                filter: drop-shadow(0 0 2px #8b5cf6);
            }
            33% {
                fill: #34d399;
                filter: drop-shadow(0 0 3px #34d399);
            }
            66% {
                fill: #38bdf8;
                filter: drop-shadow(0 0 3px #38bdf8);
            }
        }

        /* Animacja płynącego rozświetlenia podkreślenia */
        @keyframes flowLine {
            0% {
                x: -120px;
                width: 80px;
                opacity: 0.2;
            }
            50% {
                opacity: 1;
            }
            100% {
                x: 300px;
                width: 120px;
                opacity: 0.2;
            }
        }

        /* KLASY ANIMACJI */
        .anim-orbit {
            transform-origin: 140px 65px;
            animation: orbitPulse 12s linear infinite;
        }

        .anim-scan {
            animation: calcScanner 2.5s ease-in-out infinite;
        }

        .anim-dot-1 {
            animation: dotGlow 4s infinite 0s;
        }
        .anim-dot-2 {
            animation: dotGlow 4s infinite 1.3s;
        }
        .anim-dot-3 {
            animation: dotGlow 4s infinite 2.6s;
        }

        .anim-underline {
            animation: flowLine 3s ease-in-out infinite;
        }

        /* TYPOGRAFIA (Powiększone S.O.K.) */
        .sok-heading-large {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 900;
            font-size: 64px;
            fill: #ffffff;
            letter-spacing: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            .anim-orbit,
            .anim-scan,
            .anim-dot-1,
            .anim-dot-2,
            .anim-dot-3,
            .anim-underline {
                animation: none;
            }
        }
    </style>

    <!-- SYGNET LOGO -->
    <g id="logo-mark">
        <!-- Ciemny kontener wpisujący się w tło modułów -->
        <rect x="85" y="10" width="110" height="110" rx="22" fill="#111827" stroke="#1F2937" stroke-width="1.5" />

        <!-- Pierścień 1: Studnia Betonowa (Zielony) -->
        <circle cx="140" cy="65" r="38" fill="none" stroke="url(#uiStudnie)" stroke-width="4" opacity="0.85" />

        <!-- Pierścień 2: Rury Betonowe (Niebieski obracający się) -->
        <circle cx="140" cy="65" r="28" fill="none" stroke="url(#uiRury)" stroke-width="3.5" stroke-dasharray="10 6" class="anim-orbit" />

        <!-- Skaner kalkulatora (Żółty akcent) -->
        <line x1="115" y1="65" x2="165" y2="65" stroke="url(#uiZlecenia)" stroke-width="2.5" stroke-linecap="round" class="anim-scan" filter="url(#softGlow)" />

        <!-- Centralne jądro przeliczeniowe -->
        <circle cx="140" cy="65" r="10" fill="#0B0F19" stroke="url(#uiPurpleGlow)" stroke-width="3" filter="url(#softGlow)" />
        <circle cx="140" cy="65" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- TYPOGRAFIA (TYLKO DUŻE S.O.K. + ANIMOWANE PODKREŚLENIE) -->
    <g transform="translate(220, 55)">
        <!-- Powiększony akronim S.O.K. -->
        <text x="0" y="24" class="sok-heading-large" textLength="215" lengthAdjust="spacing">
            S<tspan class="anim-dot-1">.</tspan>O<tspan class="anim-dot-2">.</tspan>K<tspan class="anim-dot-3">.</tspan>
        </text>

        <!-- Baza linii podkreślenia (ciemne tło) -->
        <rect x="0" y="44" width="215" height="3.5" rx="1.75" fill="#1F2937" />

        <!-- Animowany, płynący promień świetlny na podkreśleniu -->
        <g clip-path="url(#lineClip)">
            <rect class="anim-underline" x="-120" y="44" width="80" height="3.5" rx="1.75" fill="url(#uiPurpleGlow)" filter="url(#softGlow)" />
        </g>
    </g>
</svg>
