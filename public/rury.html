        <style id="page-loader-critical">
            html:not(.is-loaded) {
                visibility: hidden;
            }
            html.is-loaded {
                visibility: visible;
            }
            #page-loader {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                align-content: center;
                gap: 0.75rem;
                background: var(--bg-primary, #0a0e1a);
                z-index: 9999;
                transition: opacity 0.25s ease;
            }
            html.is-loaded #page-loader {
                opacity: 0;
                pointer-events: none;
                visibility: hidden;
            }
            .page-loader-spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(99, 102, 241, 0.15);
                border-top-color: #6366f1;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                html:not(.is-loaded) {
                    visibility: visible;
                }
                #page-loader {
                    transition: none;
                }
                .page-loader-spinner {
                    animation: none;
                }
            }
        </style>
        <noscript
            ><style>
                html:not(.is-loaded) {
                    visibility: visible;
                }
                #page-loader {
                    display: none !important;
                }
            </style></noscript

        <script>
            (function () {
                var loadPromise =
                    document.readyState === 'complete'
                        ? Promise.resolve()
                        : new Promise(function (r) {
                              window.addEventListener('load', r, { once: true });
                          });
                var fontsPromise =
                    document.fonts && document.fonts.ready
                        ? document.fonts.ready
                        : Promise.resolve();
                Promise.race([
                    Promise.all([loadPromise, fontsPromise]),
                    new Promise(function (r) {
                        setTimeout(r, 3000);
                    })
                ]).then(function () {
                    document.documentElement.classList.add('is-loaded');
                    var loader = document.getElementById('page-loader');
                    if (loader)
                        setTimeout(function () {
                            loader.remove();
                        }, 300);
                });
            })();
        </script>
