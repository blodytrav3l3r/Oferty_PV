<!-- Wizard indicator -->
<div class="wizard-indicator" id="wizard-indicator" role="list" aria-label="Postęp kreatora">
    <div
        class="wizard-step-dot active"
        data-step="1"
        role="button"
        tabindex="0"
        aria-current="step"
        aria-label="Krok 1 z 5: Dane klienta"
    >
        <div class="wizard-dot-number">1</div>
        <div class="wizard-dot-label">Dane klienta</div>
    </div>
    <div class="wizard-step-line" id="wizard-line-1"></div>
    <div
        class="wizard-step-dot"
        data-step="2"
        role="button"
        tabindex="0"
        aria-label="Krok 2 z 5: Produkty"
        aria-disabled="true"
    >
        <div class="wizard-dot-number">2</div>
        <div class="wizard-dot-label">Produkty</div>
    </div>
    <div class="wizard-step-line" id="wizard-line-2"></div>
    <div
        class="wizard-step-dot"
        data-step="3"
        role="button"
        tabindex="0"
        aria-label="Krok 3 z 5: Oferta"
        aria-disabled="true"
    >
        <div class="wizard-dot-number">3</div>
        <div class="wizard-dot-label">Oferta</div>
    </div>
    <div class="wizard-step-line" id="wizard-line-3"></div>
    <div
        class="wizard-step-dot"
        data-step="4"
        role="button"
        tabindex="0"
        aria-label="Krok 4 z 5: Karta budowy"
        aria-disabled="true"
    >
        <div class="wizard-dot-number">4</div>
        <div class="wizard-dot-label">Karta budowy</div>
    </div>
    <div class="wizard-step-line" id="wizard-line-4"></div>
    <div
        class="wizard-step-dot"
        data-step="5"
        role="button"
        tabindex="0"
        aria-label="Krok 5 z 5: Zamówienie"
        aria-disabled="true"
    >
        <div class="wizard-dot-number">5</div>
        <div class="wizard-dot-label">Zamówienie</div>
    </div>
</div>
