<!-- PARTIAL: step1-client.html (shared studnie/rury) -->
<!-- ===== FAZA 1: DANE KLIENTA I OFERTY ===== -->
<div class="wizard-step active" id="wizard-step-1">
    <div class="wizard-card">
        <div class="wizard-card-header gap-2 util-2x-21">
            <div class="util-2x-22">
                <i data-lucide="clipboard-list"></i>
            </div>
            <div>
                <h2 id="offer-form-title" class="wizard-card-title util-2x-23">
                    Dane klienta i oferty
                </h2>
                <p class="wizard-card-subtitle util-2x-24">
                    Uzupełnij dane klienta i podstawowe informacje o ofercie
                </p>
            </div>
            <div class="gap-2 util-single-127">
                <button type="button" class="btn btn-secondary btn-sm" onclick="showClientsDb()">
                    <i data-lucide="folder-open"></i> Wczytaj klienta
                </button>
                <button type="button" class="btn btn-primary btn-sm" onclick="saveClientToDb()">
                    <i data-lucide="save"></i> Zapisz klienta
                </button>
            </div>
        </div>

        <div class="wizard-card-body">
            <div class="wizard-section-title"><i data-lucide="user"></i> Dane klienta</div>
            <div class="wizard-form-grid cols-2">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-number">Nr klienta</label>
                    <input class="wizard-form-input" id="client-number" placeholder="K-001" />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-name">Firma</label>
                    <input
                        class="wizard-form-input"
                        id="client-name"
                        placeholder="Budimex S.A."
                        oninput="updateStep1NextState()"
                        required
                        aria-required="true"
                        aria-describedby="err-client-name"
                        autocomplete="organization"
                    />
                    <span id="err-client-name" role="alert" hidden>Podaj nazwę firmy</span>
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-nip">NIP</label>
                    <input
                        class="wizard-form-input"
                        id="client-nip"
                        placeholder="1234567890"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                        required
                        aria-required="true"
                        aria-describedby="err-client-nip"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="10"
                        autocomplete="off"
                    />
                    <span id="err-client-nip" role="alert" hidden>Podaj NIP (10 cyfr)</span>
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-address">Adres firmy</label>
                    <input
                        class="wizard-form-input"
                        id="client-address"
                        placeholder="ul. Przykładowa 1, Warszawa"
                        required
                        aria-required="true"
                        aria-describedby="err-client-address"
                        autocomplete="street-address"
                    />
                    <span id="err-client-address" role="alert" hidden>Podaj adres firmy</span>
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-contact">Kontakt</label>
                    <input
                        class="wizard-form-input"
                        id="client-contact"
                        placeholder="Jan Kowalski, 600 100 200"
                    />
                </div>
            </div>

            <div class="wizard-section-title util-single-128">
                <i data-lucide="hard-hat"></i> Inwestycja
            </div>
            <div class="wizard-form-grid cols-3">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="invest-name">Obiekt</label>
                    <input
                        class="wizard-form-input"
                        id="invest-name"
                        placeholder="Budowa kanalizacji deszczowej"
                        required
                        aria-required="true"
                        aria-describedby="err-invest-name"
                    />
                    <span id="err-invest-name" role="alert" hidden>Podaj nazwę obiektu</span>
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="invest-address">Adres</label>
                    <input
                        class="wizard-form-input"
                        id="invest-address"
                        placeholder="ul. Nowa 5, Kraków"
                        required
                        aria-required="true"
                        aria-describedby="err-invest-address"
                    />
                    <span id="err-invest-address" role="alert" hidden>Podaj adres inwestycji</span>
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="invest-contractor">Wykonawca</label>
                    <input
                        class="wizard-form-input"
                        id="invest-contractor"
                        placeholder="Imię i nazwisko"
                    />
                </div>
            </div>

            <div class="util-single-129">
                <div class="wizard-section-title util-2x-25">
                    <i data-lucide="file-text"></i> Oferta
                </div>
                <button
                    type="button"
                    id="btn-change-offer-user"
                    class="btn btn-sm util-single-130"
                    onclick="changeOfferUser()"
                >
                    <i data-lucide="user"></i> Zmień opiekuna
                </button>
            </div>
            <div class="wizard-form-grid cols-4">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-number">Nr oferty</label>
                    <input class="wizard-form-input" id="offer-number" />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-date">Data</label>
                    <input class="wizard-form-input" type="date" id="offer-date" />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="transport-km">Kilometry</label>
                    <input
                        class="wizard-form-input"
                        type="number"
                        step="1"
                        id="transport-km"
                        value="100"
                        oninput="
                            if (typeof onRuryTransportFormChange === 'function')
                                onRuryTransportFormChange();
                        "
                    />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="transport-rate">PLN/km</label>
                    <input
                        class="wizard-form-input"
                        type="number"
                        step="0.1"
                        id="transport-rate"
                        value="10"
                        oninput="
                            if (typeof onRuryTransportFormChange === 'function')
                                onRuryTransportFormChange();
                        "
                    />
                </div>
            </div>
            <div class="wizard-form-grid mt-3">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-notes">Uwagi</label>
                    <textarea
                        class="wizard-form-textarea util-single-131"
                        id="offer-notes"
                        rows="5"
                        placeholder="np. Cena obejmuje transport do 100 km..."
                    ></textarea>
                </div>
            </div>
            <div class="wizard-form-grid cols-3fr-1fr mt-3">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-payment-terms"
                        >Warunki płatności</label
                    >
                    <textarea
                        class="wizard-form-textarea util-single-132"
                        id="offer-payment-terms"
                        rows="1"
                    >
Do uzgodnienia lub według indywidualnych warunków handlowych.</textarea>
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-validity"
                        >Data ważności oferty</label
                    >
                    <input
                        class="wizard-form-input"
                        id="offer-validity"
                        value="7 dni"
                        onclick="this.select()"
                    />
                </div>
            </div>
            <div class="wizard-nav">
                <div></div>
                <button
                    type="button"
                    class="wizard-btn wizard-btn-next"
                    id="wizard-next-step1"
                    onclick="typeof phaseNext === 'function' ? phaseNext() : wizardNext()"
                >
                    Dalej →
                </button>
            </div>
        </div>
    </div>
</div>
