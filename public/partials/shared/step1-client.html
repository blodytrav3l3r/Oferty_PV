<!-- Wspólny formularz danych klienta, inwestycji i oferty dla Rur oraz Studni. -->
<div class="wizard-step wizard-step-client active" id="wizard-step-1">
    <div class="wizard-card">
        <div class="wizard-client-header">
            <div class="wizard-client-header-icon">
                <i data-lucide="clipboard-list"></i>
            </div>
            <div>
                <h2 id="offer-form-title" class="wizard-card-title wizard-client-title">
                    Dane klienta i oferty
                </h2>
                <p class="wizard-card-subtitle wizard-client-subtitle">
                    Uzupełnij dane klienta i podstawowe informacje o ofercie
                </p>
            </div>
            <div class="wizard-client-header-actions">
                <button
                    type="button"
                    class="btn btn-secondary btn-sm wizard-client-action"
                    data-csp="showClientsDb"
                >
                    <i data-lucide="folder-open"></i> Wczytaj klienta
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm wizard-client-action"
                    data-csp="saveClientToDb"
                >
                    <i data-lucide="save"></i> Zapisz klienta
                </button>
            </div>
        </div>

        <div class="wizard-card-body">
            <div class="wizard-section-title wizard-client-section-title">
                <i data-lucide="user"></i> Dane klienta
            </div>
            <div class="wizard-form-grid wizard-client-grid wizard-client-grid--two">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-number">Nr klienta</label>
                    <input class="wizard-form-input" id="client-number" placeholder="K-001" />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-name">Firma</label>
                    <input
                        class="wizard-form-input"
                        id="client-name"
                        placeholder="Budimex S.A."
                        data-csp="updateStep1NextState"
                        data-csp-on="input"
                    />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-nip">NIP</label>
                    <input
                        class="wizard-form-input"
                        id="client-nip"
                        placeholder="1234567890"
                        data-csp="$digitsOnly"
                        data-csp-on="input"
                    />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="client-address">Adres firmy</label>
                    <input
                        class="wizard-form-input"
                        id="client-address"
                        placeholder="ul. Przykładowa 1, Warszawa"
                    />
                </div>
                <div class="wizard-form-group wizard-client-span-all">
                    <span class="wizard-form-label" id="client-contacts-label"
                        >Osoby do kontaktu — klient</span
                    >
                    <div
                        id="client-contacts"
                        data-cc-hidden="client-contact"
                        role="group"
                        aria-labelledby="client-contacts-label"
                    ></div>
                    <input type="hidden" id="client-contact" />
                    <p class="text-muted fs-md wizard-client-help">
                        Kontakt ofertowy — zapisuje się z tą ofertą. „Zapisz klienta” odkłada firmę
                        + wszystkie osoby do katalogu.
                    </p>
                </div>
            </div>

            <div class="wizard-section-title wizard-client-section-title">
                <i data-lucide="hard-hat"></i> Inwestycja
            </div>
            <div class="wizard-form-grid investment-form-grid" id="invest-location-fields">
                <div class="wizard-form-group investment-object">
                    <label class="wizard-form-label" for="invest-name">Obiekt</label>
                    <input
                        class="wizard-form-input"
                        id="invest-name"
                        placeholder="Budowa kanalizacji deszczowej"
                    />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="invest-postal-code">Kod pocztowy</label>
                    <input
                        class="wizard-form-input"
                        id="invest-postal-code"
                        autocomplete="postal-code"
                        maxlength="20"
                        placeholder="00-000"
                    />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="invest-city">Miejscowość</label>
                    <input
                        class="wizard-form-input"
                        id="invest-city"
                        autocomplete="address-level2"
                        maxlength="120"
                    />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="invest-street">Ulica i numer</label>
                    <input
                        class="wizard-form-input"
                        id="invest-street"
                        autocomplete="street-address"
                        maxlength="200"
                    />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="invest-country">Kraj</label>
                    <select class="wizard-form-input" id="invest-country" autocomplete="country">
                        <option value="PL">Polska</option>
                    </select>
                </div>
                <div class="wizard-form-group investment-location-description">
                    <label class="wizard-form-label" for="invest-location-description"
                        >Opis lokalizacji</label
                    >
                    <textarea
                        class="wizard-form-input"
                        id="invest-location-description"
                        rows="2"
                        maxlength="500"
                        placeholder="Dodatkowe wskazówki dojazdu lub położenia obiektu"
                    ></textarea>
                </div>
            </div>
            <p
                class="text-muted fs-md investment-legacy-address"
                id="invest-legacy-address"
                hidden
            ></p>
            <div class="wizard-form-group investment-contact-group">
                <span class="wizard-form-label" id="invest-contacts-label"
                    >Osoby do kontaktu — inwestycja</span
                >
                <div
                    id="invest-contacts"
                    data-cc-hidden="invest-contact"
                    data-cc-autoinit
                    data-cc-add-label="Dodaj kontakt na budowę"
                    role="group"
                    aria-labelledby="invest-contacts-label"
                ></div>
                <input type="hidden" id="invest-contact" />
                <input type="hidden" id="invest-address" />
                <input type="hidden" id="invest-contractor" />
            </div>

            <div class="wizard-client-offer-header">
                <div class="wizard-section-title wizard-client-section-title">
                    <i data-lucide="file-text"></i> Oferta
                </div>
                <button
                    type="button"
                    id="btn-change-offer-user"
                    class="btn btn-sm wizard-client-supervisor"
                    data-csp="changeOfferUser"
                >
                    <i data-lucide="user"></i> Zmień opiekuna
                </button>
            </div>
            <div class="wizard-form-grid wizard-client-grid wizard-client-grid--four">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-number">Nr oferty</label>
                    <input class="wizard-form-input" id="offer-number" />
                </div>
                <div class="wizard-form-group" id="order-number-group" hidden>
                    <label class="wizard-form-label" for="order-number">Nr zamówienia</label>
                    <input class="wizard-form-input" id="order-number" readonly />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-date">Data</label>
                    <input class="wizard-form-input" type="date" id="offer-date" />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="transport-km">Kilometry</label>
                    <input
                        class="wizard-form-input"
                        type="number"
                        step="1"
                        id="transport-km"
                        value="100"
                    />
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="transport-rate">PLN/km</label>
                    <input
                        class="wizard-form-input"
                        type="number"
                        step="0.1"
                        id="transport-rate"
                        value="10"
                    />
                </div>
            </div>
            <div class="wizard-form-grid wizard-client-grid wizard-client-grid--one">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-notes">Uwagi</label>
                    <textarea
                        class="wizard-form-textarea wizard-client-notes"
                        id="offer-notes"
                        rows="5"
                        placeholder="np. Cena obejmuje transport do 100 km..."
                    ></textarea>
                </div>
            </div>
            <div class="wizard-form-grid wizard-client-grid wizard-client-grid--payment">
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-payment-terms"
                        >Warunki płatności</label
                    >
                    <textarea class="wizard-form-textarea" id="offer-payment-terms" rows="1">
Do uzgodnienia lub według indywidualnych warunków handlowych.</textarea>
                </div>
                <div class="wizard-form-group">
                    <label class="wizard-form-label" for="offer-validity"
                        >Data ważności oferty</label
                    >
                    <input
                        class="wizard-form-input"
                        id="offer-validity"
                        value="7 dni"
                        data-csp="$select"
                    />
                </div>
            </div>
            <div class="wizard-nav">
                <div></div>
                <button
                    type="button"
                    class="wizard-btn wizard-btn-next"
                    id="wizard-next-step1"
                    data-wizard-action="next"
                >
                    Dalej <i data-lucide="chevron-right" class="icon-xs" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</div>
