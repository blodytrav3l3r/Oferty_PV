<!-- PARTIAL: pricelist.html -->
<div class="section" id="section-pricelist">
    <div class="toolbar">
        <h2 class="pricelist-toolbar-title">
            <i data-lucide="clipboard-list"></i>
            <span id="pv-title-text">Cennik Rur</span>
            <span id="pv-title-version" class="pv-title-version" hidden></span>
        </h2>
        <div class="toolbar-spacer"></div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <input
                class="form-input form-input-sm"
                id="pricelist-search"
                placeholder="Szukaj..."
                title="Szukaj produktu w cenniku"
                aria-label="Szukaj produktu w cenniku"
            />
        </div>
        <button
            type="button"
            class="btn btn-secondary"
            data-csp="toggleRuryVersionsPanel"
            data-pv-dock-toggle
            aria-controls="pv-dock"
            aria-expanded="false"
            title="Zarządzanie cennikiem: wersje, pliki, domyślne"
        >
            <i data-lucide="panel-left"></i> Panel
        </button>
    </div>
    <div id="pricelist-status-strip" class="pv-status-strip" aria-live="polite"></div>

    <!-- Akcje siatki: przenoszone do raila „Zarządzanie cennikami" (jedyny pasek akcji). -->
    <div
        id="pv-grid-actions"
        class="pv-grid-actions"
        role="group"
        aria-label="Akcje siatki cen"
        hidden
    >
        <div class="pv-grid-actions__head">
            <span class="pv-grid-actions__title">Siatka cen</span>
            <span id="pv-grid-actions-state" class="pv-grid-actions__state" data-mode="view">
                Podgląd
            </span>
        </div>
        <div id="pv-editor-actions" class="pv-editor-actions"></div>
        <div class="pv-grid-actions__row">
            <button
                type="button"
                class="btn btn-primary"
                id="btn-add-product"
                data-csp="showAddProductModal"
                title="Dodaj nowy produkt do cennika"
            >
                <i data-lucide="plus"></i> Dodaj
            </button>
            <button
                type="button"
                class="btn btn-secondary"
                id="btn-save-pricelist"
                data-csp="savePriceList"
                title="Zapisz zmiany w cenniku"
            >
                <i data-lucide="save"></i> Zapisz
            </button>
        </div>
    </div>

    <div id="pricelist-body" style="margin-top: 1rem"></div>
</div>
