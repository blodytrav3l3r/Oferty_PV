<!-- PARTIAL: pricelist.html -->
<div class="section" id="section-pricelist">
    <div class="toolbar">
        <h2 class="pricelist-toolbar-title">
            <i data-lucide="clipboard-list"></i> Cennik produktów
        </h2>
        <div class="toolbar-spacer"></div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <input
                class="form-input form-input-sm"
                id="pricelist-search"
                placeholder="Szukaj..."
                title="Szukaj produktu w cenniku"
                aria-label="Szukaj produktu w cenniku"
            />
        </div>
        <button
            type="button"
            class="btn btn-primary"
            onclick="showAddProductModal()"
            title="Dodaj nowy produkt do cennika"
        >
            <i data-lucide="plus"></i> Dodaj
        </button>
        <button
            type="button"
            class="btn btn-secondary"
            id="btn-save-pricelist"
            onclick="savePriceList()"
            title="Zapisz zmiany w cenniku"
        >
            <i data-lucide="save"></i> Zapisz
        </button>
        <button
            type="button"
            class="btn btn-secondary"
            onclick="openRuryVersionsPanel()"
            title="Zarządzanie cennikiem: wersje, pliki, domyślne"
        >
            <i data-lucide="sliders-horizontal"></i> Zarządzaj
        </button>
    </div>

    <div id="pricelist-body" style="margin-top: 1rem"></div>
</div>
