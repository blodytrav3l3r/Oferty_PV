<!-- PARTIAL: offer.html -->
<!-- ===== SECTION: OFFER (PODSUMOWANIE) ===== -->
<div class="section" id="section-offer" style="padding-bottom: 220px">
    <!-- Baner kontekstu: oferta / zamówienie -->
    <div id="offer-context-banner" class="util-2x-1">
        <div class="card gap-3 util-2x-2">
            <span id="offer-context-badge" class="gap-1 util-2x-3"></span>
            <span id="offer-context-text" class="util-2x-4"></span>
        </div>
    </div>
    <!-- Dane klienta i oferty -->
    <div class="card card-compact mb-1">
        <div class="card-title-sm util-2x-5">
            <span id="offer-form-title-rury"
                ><i data-lucide="clipboard-list"></i> Dane klienta i oferty</span
            >
        </div>
        <div class="card-content mt-5">
            <div id="offer-client-summary" class="gap-2 util-2x-6">
                <div>
                    <span class="fs-xs-muted">Data:</span>
                    <span id="offer-disp-date">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">Nr klienta:</span>
                    <span id="offer-disp-client-number">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">Firma:</span>
                    <span id="offer-disp-name">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">NIP:</span>
                    <span id="offer-disp-nip">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">Nr oferty:</span>
                    <span id="offer-disp-number">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">Inwestycja:</span>
                    <span id="offer-disp-invest">—</span>
                </div>
            </div>
        </div>
    </div>

    <!-- UWAGI DO OFERTY -->
    <div class="card util-2x-7">
        <div class="card-header-row">
            <label class="rury-offer-label">
                <i data-lucide="edit-3"></i> Uwagi do oferty (widoczne na wydruku)
            </label>
            <button
                type="button"
                class="btn btn-secondary btn-sm util-2x-8"
                onclick="generateOfferNotes()"
            >
                <i data-lucide="refresh-cw" class="icon-xxs"></i>
                Auto-generuj uwagi
            </button>
        </div>
        <textarea
            id="offer-tab-notes"
            class="wizard-form-input rury-offer-textarea"
            rows="4"
            placeholder="Uwagi zostaną automatycznie wygenerowane..."
        ></textarea>
    </div>

    <!-- WARUNKI PŁATNOŚCI + DATA WAŻNOŚCI -->
    <div class="card util-2x-9">
        <div class="card-header-row">
            <label class="rury-offer-label">
                <i data-lucide="credit-card"></i> Warunki płatności
            </label>
            <label class="rury-offer-label">Data ważności</label>
        </div>
        <div class="gap-3 util-2x-10">
            <textarea
                id="offer-tab-payment-terms"
                class="wizard-form-input rury-offer-textarea"
                rows="2"
                placeholder="Domyślnie przepisywane z kroku 1..."
            ></textarea>
            <input
                id="offer-tab-validity"
                class="wizard-form-input util-2x-11"
                onclick="this.select()"
            />
        </div>
    </div>

    <!-- ZESTAWIENIE OFERTOWE -->
    <div class="card mb-1">
        <div class="toolbar util-2x-12">
            <h2 class="fs-2xl-bold-plain">
                <i data-lucide="bar-chart-2"></i> Zestawienie ofertowe (Rury)
            </h2>
            <div class="toolbar-spacer"></div>
            <div class="zt-toggle-wrap">
                <span class="zt-toggle-label">Zabezp. transp.</span>
                <div class="zt-toggle-group">
                    <button
                        type="button"
                        class="zt-toggle-btn zt-toggle-tak-btn active"
                        id="zt-toggle-tak-oferta"
                        onclick="setZabezpieczenieTransportu(true)"
                    >
                        TAK
                    </button>
                    <button
                        type="button"
                        class="zt-toggle-btn zt-toggle-nie-btn"
                        id="zt-toggle-nie-oferta"
                        onclick="setZabezpieczenieTransportu(false)"
                    >
                        NIE
                    </button>
                </div>
            </div>
        </div>
        <div id="offer-tab-summary-body"></div>
    </div>
</div>
