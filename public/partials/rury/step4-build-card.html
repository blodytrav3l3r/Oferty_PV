<!-- PARTIAL: step4-build-card.html -->
<!-- ===== FAZA 4: KARTA BUDOWY ===== -->
<div class="wizard-step" id="wizard-step-4">
    <div class="wizard-card">
        <div class="wizard-card-content karta-card-content">
            <!-- Wiersz 0: Kopiuj Kartę Budowy z istniejącego zamówienia -->
            <div class="karta-copy-row gap-3">
                <div class="karta-copy-select">
                    <select id="step4-copy-order-select" class="form-input form-input-wide">
                        <option value="">Wybierz kartę budowy do skopiowania</option>
                    </select>
                    <div id="step4-copy-order-help" class="karta-help">
                        Wybierz istniejące zamówienie, aby skopiować jego dane Karty Budowy.
                    </div>
                </div>
                <button
                    type="button"
                    id="step4-copy-toggle-btn"
                    class="wizard-btn wizard-btn-secondary"
                    onclick="copyKartaBudowyFromOrder()"
                    class="karta-copy-btn"
                >
                    Kopiuj Kartę Budowy z zamówienia
                </button>
            </div>

            <!-- Wiersz 1: Emaile i numer oferty -->
            <div class="karta-email-row gap-4">
                <div class="flex-1-240">
                    <label class="karta-label karta-label--warn">
                        Aktualnie przypisane emaile do faktury
                    </label>
                    <input
                        type="email"
                        id="step4-email-faktura"
                        class="form-input karta-input karta-input--readonly"
                        placeholder="np. faktura@firma.pl"
                        readonly
                    />
                </div>
                <div class="flex-1-240">
                    <label class="karta-label karta-label--success">
                        Email e-faktura
                        <span class="karta-badge--tu">(TU DOPISYWAĆ)</span>
                    </label>
                    <input
                        type="email"
                        id="step4-email-efaktura"
                        class="form-input"
                        placeholder="np. efaktura@firma.pl"
                        class="karta-input"
                    />
                </div>
                <div class="flex-1-240">
                    <label class="karta-label karta-label--accent">
                        Zamówienie według oferty nr.
                    </label>
                    <input
                        type="text"
                        id="step4-offer-nr-input"
                        class="form-input"
                        placeholder="np. OF/2026/001, OF/2026/002"
                        class="karta-input"
                    />
                    <div class="karta-help">Numery ofert oddzielaj przecinkiem</div>
                </div>
            </div>

            <!-- Wiersz 2: Adres i Płatności -->
            <div class="flex-wrap-start p-6-12">
                <div class="flex-2-240">
                    <label class="karta-label karta-label--blue"> Adres wysyłki faktury </label>
                    <input
                        type="text"
                        id="step4-adres-wysylki"
                        class="form-input"
                        placeholder="Wpisz adres wysyłki faktury..."
                        class="karta-input"
                    />
                </div>
                <div style="flex: 1; min-width: 150px">
                    <label class="karta-label karta-label--accent2"> Warunki płatności </label>
                    <select id="step4-warunki-platnosci" class="form-input form-input-wide">
                        <option value="przelew">Przelew</option>
                        <option value="gotówka">Gotówka</option>
                        <option value="przedpłata">Przedpłata</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 100px; max-width: 150px">
                    <label class="karta-label karta-label--accent2"> Ilość dni </label>
                    <input
                        type="number"
                        id="step4-ilosc-dni"
                        class="form-input"
                        placeholder="np. 14"
                        min="0"
                        class="karta-input"
                    />
                </div>
            </div>

            <!-- Wiersz 3: Ubezpieczenie -->
            <div class="flex-wrap-start p-6-12">
                <div class="flex-1-240">
                    <label class="karta-label karta-label--success"> Ubezpieczenie </label>
                    <input
                        type="text"
                        id="step4-ubezpieczenie"
                        class="form-input"
                        placeholder="Wpisz dane ubezpieczenia..."
                        class="karta-input"
                    />
                </div>
            </div>

            <!-- Wiersz 4: Osoba do kontaktu -->
            <div class="flex-wrap-start p-6-12">
                <div class="flex-1-240">
                    <label class="karta-label karta-label--pink">
                        Osoba do kontaktu tel. / email
                    </label>
                    <input
                        type="text"
                        id="step4-osoba-kontakt"
                        class="form-input"
                        placeholder="Wpisz dane osoby do kontaktu..."
                        class="karta-input"
                    />
                </div>
            </div>

            <!-- Wiersz 5: Transport -->
            <div class="flex-wrap-start p-6-12">
                <div class="flex-1-180">
                    <label class="karta-label karta-label--danger">
                        Zabezpieczenie transportu
                    </label>
                    <select id="step4-zabezpieczenie-transportu" class="form-input form-input-wide">
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="Podkłady jednorazowe">Podkłady jednorazowe</option>
                        <option value="Podkłady zwrotne">Podkłady zwrotne</option>
                    </select>
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--warn"> Rodzaj transportu </label>
                    <select id="step4-rodzaj-transportu" class="form-input form-input-wide">
                        <option value="W kółko">W kółko</option>
                        <option value="Spedycja">Spedycja</option>
                        <option value="Transport P.V." selected>Transport P.V.</option>
                        <option value="Odbiór własny">Odbiór własny</option>
                    </select>
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--accent2">
                        Wyliczony transport z zam.
                    </label>
                    <input
                        type="text"
                        id="step4-wyliczony-transport"
                        class="form-input karta-input karta-input--computed"
                        placeholder="Brak danych"
                    />
                </div>
            </div>

            <!-- Wiersz 6: Rodzaj studni, Uszczelka do studni, Rodzaj stopni -->
            <div class="flex-wrap-start p-6-12">
                <div class="flex-1-180">
                    <label class="karta-label karta-label--blue-alt"> Rodzaj studni </label>
                    <select id="step4-rodzaj-studni" class="form-input form-input-wide">
                        <option value="Nie dotyczy">Nie dotyczy</option>
                        <option value="Beton" selected>Beton</option>
                        <option value="Żelbet">Żelbet</option>
                    </select>
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--cyan"> Uszczelka do studni </label>
                    <select
                        id="step4-uszczelka-studni"
                        class="form-input form-input-wide"
                        onchange="
                            document.getElementById(
                                'step4-uszczelka-studni-inne-wrap'
                            ).style.display = this.value === 'Inne' ? 'block' : 'none'
                        "
                    >
                        <option value="Nie dotyczy">Nie dotyczy</option>
                        <option value="Brak" selected>Brak</option>
                        <option value="GSG">GSG</option>
                        <option value="SDV">SDV</option>
                        <option value="SDV PO">SDV PO</option>
                        <option value="NBR">NBR</option>
                        <option value="Inne">Inne</option>
                    </select>
                </div>
                <div class="flex-1-180-hidden" id="step4-uszczelka-studni-inne-wrap">
                    <label class="karta-label karta-label--cyan"> Jakie (Inne) </label>
                    <input
                        type="text"
                        id="step4-uszczelka-studni-inne"
                        class="form-input"
                        placeholder="Wpisz uszczelkę..."
                        class="karta-input"
                    />
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--warn"> Rodzaj stopni </label>
                    <select
                        id="step4-rodzaj-stopni"
                        class="form-input form-input-wide"
                        onchange="
                            document.getElementById('step4-rodzaj-stopni-inne-wrap').style.display =
                                this.value === 'Inne' ? 'block' : 'none'
                        "
                    >
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="Brak">Brak</option>
                        <option value="Drabinka">Drabinka</option>
                        <option value="Drabinka nierdzewna">Drabinka nierdzewna</option>
                        <option value="Inne">Inne</option>
                    </select>
                </div>
                <div class="flex-1-180-hidden" id="step4-rodzaj-stopni-inne-wrap">
                    <label class="karta-label karta-label--warn"> Jakie (Inne) </label>
                    <input
                        type="text"
                        id="step4-rodzaj-stopni-inne"
                        class="form-input"
                        placeholder="Wpisz rodzaj stopni..."
                        class="karta-input"
                    />
                </div>
            </div>

            <!-- Wiersz 7: Kineta i Wysokość spocznika -->
            <div class="flex-wrap-start p-6-12">
                <div class="flex-1-180">
                    <label class="karta-label karta-label--accent2"> Kineta </label>
                    <select
                        id="step4-kineta"
                        class="form-input form-input-wide"
                        onchange="
                            document.getElementById('step4-kineta-inne-wrap').style.display =
                                this.value === 'Inne' ? 'block' : 'none'
                        "
                    >
                        <option value="Nie dotyczy">Nie dotyczy</option>
                        <option value="Brak" selected>Brak</option>
                        <option value="Beton">Beton</option>
                        <option value="Beton z GFK">Beton z GFK</option>
                        <option value="Klinkier">Klinkier</option>
                        <option value="Preco">Preco</option>
                        <option value="PrecoTop">PrecoTop</option>
                        <option value="UnoLith">UnoLith</option>
                        <option value="Predl">Predl</option>
                        <option value="Kamionka">Kamionka</option>
                        <option value="Inne">Inne</option>
                    </select>
                </div>
                <div class="flex-1-180-hidden" id="step4-kineta-inne-wrap">
                    <label class="karta-label karta-label--accent2"> Jakie (Inne) </label>
                    <input
                        type="text"
                        id="step4-kineta-inne"
                        class="form-input"
                        placeholder="Wpisz rodzaj kinety..."
                        class="karta-input"
                    />
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--success"> Wysokość spocznika </label>
                    <select id="step4-wysokosc-spocznika" class="form-input form-input-wide">
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="1/2">1/2</option>
                        <option value="2/3">2/3</option>
                        <option value="3/4">3/4</option>
                        <option value="1/1">1/1</option>
                    </select>
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--danger"> Usytuowanie </label>
                    <select id="step4-usytuowanie" class="form-input form-input-wide">
                        <option value="Nie dotyczy">Nie dotyczy</option>
                        <option value="Linia dolna" selected>Linia dolna</option>
                        <option value="Linia górna">Linia górna</option>
                    </select>
                </div>
            </div>

            <!-- Wiersz 8: Kaskada i Ślepa kineta -->
            <div class="flex-wrap-start p-6-12">
                <div style="flex: 1; min-width: 140px">
                    <label class="karta-label karta-label--blue"> Kaskada </label>
                    <select id="step4-kaskada" class="form-input form-input-wide">
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="Tak">Tak</option>
                        <option value="Nie">Nie</option>
                    </select>
                </div>
                <div style="flex: 2; min-width: 180px">
                    <label class="karta-label karta-label--blue"> Uwagi (Kaskada) </label>
                    <input
                        type="text"
                        id="step4-kaskada-uwagi"
                        class="form-input"
                        placeholder="Wpisz uwagi..."
                        class="karta-input"
                    />
                </div>
                <div style="flex: 1; min-width: 140px">
                    <label class="karta-label karta-label--accent2"> Ślepa kineta </label>
                    <select id="step4-slepa-kineta" class="form-input form-input-wide">
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="Tak">Tak</option>
                        <option value="Nie">Nie</option>
                    </select>
                </div>
                <div style="flex: 2; min-width: 180px">
                    <label class="karta-label karta-label--accent2"> Uwagi (Ślepa kineta) </label>
                    <input
                        type="text"
                        id="step4-slepa-kineta-uwagi"
                        class="form-input"
                        placeholder="Wpisz uwagi..."
                        class="karta-input"
                    />
                </div>
            </div>

            <!-- Wiersz 9: Redukcja kinety, Przejścia tulejowe, Przejścia szczelne -->
            <div class="flex-wrap-start p-6-12">
                <div class="flex-1-180">
                    <label class="karta-label karta-label--success"> Redukcja kinety </label>
                    <select id="step4-redukcja-kinety" class="form-input form-input-wide">
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="Nie">Nie</option>
                        <option value="Tak">Tak</option>
                    </select>
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--blue-alt"> Przejścia tulejowe </label>
                    <select id="step4-przejscia-tulejowe" class="form-input form-input-wide">
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="Tak">Tak</option>
                        <option value="Nie">Nie</option>
                    </select>
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--accent2"> Przejścia szczelne </label>
                    <select id="step4-przejscia-szczelne" class="form-input form-input-wide">
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="W zakresie P.V.">W zakresie P.V.</option>
                        <option value="Dostarcza klient">Dostarcza klient</option>
                    </select>
                </div>
                <div class="flex-1-180">
                    <label class="karta-label karta-label--slate"> Przejścia zamówione </label>
                    <select
                        id="step4-przejscia-zamowione"
                        class="form-input form-input-wide"
                        onchange="handlePrzejsciaZamowioneChange(this)"
                    >
                        <option value="Nie dotyczy" selected>Nie dotyczy</option>
                        <option value="Tak">Tak</option>
                        <option value="Nie">Nie</option>
                    </select>
                </div>
                <div class="flex-2-240">
                    <label class="karta-label karta-label--slate"> Data zamówienia </label>
                    <input
                        type="date"
                        id="step4-data-zamowienia"
                        class="form-input form-input-wide"
                    />
                </div>
            </div>

            <!-- Wiersz 10: Właściwości betonu, Pozostałe właściwości -->
            <div class="flex-wrap-start p-6-12">
                <div class="flex-1-180">
                    <label class="karta-label karta-label--slate"> Właściwości betonu </label>
                    <select id="step4-wlasciwosci-betonu" class="form-input form-input-wide">
                        <option value="C40/50" selected>C40/50</option>
                        <option value="C40/50 HSR">C40/50 HSR</option>
                        <option value="C45/55">C45/55</option>
                        <option value="C45/55 HSR">C45/55 HSR</option>
                        <option value="C70/85">C70/85</option>
                        <option value="C70/80 HSR">C70/80 HSR</option>
                    </select>
                </div>
                <div class="flex-2-240">
                    <label class="karta-label karta-label--slate"> Pozostałe właściwości </label>
                    <input
                        type="text"
                        id="step4-pozostale-wlasciwosci"
                        class="form-input"
                        placeholder="Wpisz właściwości (np. Agresja mrozowa)..."
                        class="karta-input"
                    />
                </div>
            </div>

            <!-- Wiersz 11: Przejścia szczelne — szczegóły z oferty -->
            <div style="padding: 0.6rem 1.2rem">
                <div
                    style="
                        background: rgba(var(--accent2-rgb), 0.05);
                        border: 1px solid rgba(var(--accent2-rgb), 0.2);
                        border-radius: var(--radius-sm);
                        padding: 0.8rem;
                        position: relative;
                    "
                >
                    <div
                        style="
                            display: flex;
                            justify-content: space-between;
                            align-items: center;
                            margin-bottom: 0.6rem;
                        "
                    >
                        <label
                            class="gap-2"
                            style="
                                display: flex;
                                align-items: center;
                                font-size: var(--fs-base);
                                font-weight: var(--fw-bold);
                                color: var(--accent2-hover);
                                text-transform: uppercase;
                                letter-spacing: 0.3px;
                            "
                        >
                            <i data-lucide="link"></i> Przejścia szczelne — szczegóły z oferty
                        </label>
                        <button
                            type="button"
                            id="step4-add-custom-przejscie-btn"
                            onclick="addCustomPrzejscieRow()"
                            class="gap-1"
                            style="
                                display: flex;
                                align-items: center;
                                background: rgba(var(--accent2-rgb), 0.1);
                                border: 1px solid rgba(var(--accent2-rgb), 0.3);
                                color: var(--accent2-hover);
                                font-size: var(--fs-xs);
                                font-weight: var(--fw-bold);
                                padding: 0.3rem 0.6rem;
                                border-radius: var(--radius-sm);
                                cursor: pointer;
                                transition: all 0.15s;
                                text-transform: uppercase;
                                letter-spacing: 0.3px;
                            "
                            onmouseenter="
                                this.style.background = 'rgba(var(--accent2-rgb), 0.3)';
                                this.style.borderColor = 'rgba(var(--accent2-rgb), 0.5)';
                            "
                            onmouseleave="
                                this.style.background = 'rgba(var(--accent2-rgb), 0.1)';
                                this.style.borderColor = 'rgba(var(--accent2-rgb), 0.3)';
                            "
                        >
                            <i data-lucide="plus" style="width: 12px; height: 12px"></i>
                            Dodaj niestandardowe
                        </button>
                    </div>
                    <div id="step4-przejscia-details-table"></div>
                </div>
            </div>

            <!-- Wiersz 12: Uwagi ogólne -->
            <div style="padding: 0.6rem 1.2rem">
                <label class="karta-label karta-label--slate"> Uwagi </label>
                <textarea
                    id="step4-uwagi-ogolne"
                    class="form-input"
                    rows="9"
                    style="
                        width: 100%;
                        font-size: var(--fs-lg);
                        padding: 0.6rem 0.8rem;
                        resize: vertical;
                    "
                    placeholder="Wpisz uwagi..."
                ></textarea>
            </div>
        </div>
    </div>
</div>
