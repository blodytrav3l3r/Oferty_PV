<!-- PARTIAL: transport-modal.html -->
<!-- ===== OFFER TRANSPORT MODAL (Rury) ===== -->
<div id="rury-transport-modal" class="modal-overlay util-single-118">
    <div class="rury-transport-modal">
        <div class="rury-transport-header">
            <div id="rury-transport-modal-title" class="rury-transport-title gap-2">
                <i data-lucide="truck" class="util-single-119"></i> Koszty Transportu
            </div>
            <button
                type="button"
                class="btn btn-icon util-single-120"
                onclick="handleRuryTransportCancel()"
            >
                <i data-lucide="x" class="util-single-121"></i>
            </button>
        </div>
        <div class="util-single-122">
            <p class="util-single-123">
                Wprowadź dystans oraz stawkę. Formularz jest zsynchronizowany z danymi oferty i
                ulegnie przedawnieniu tylko po odrzuceniu zmian.
            </p>
            <div class="gap-4 util-2x-14">
                <div class="form-group flex-1-m0">
                    <label class="transport-label">Odległość (km)</label>
                    <input
                        type="number"
                        id="rury-transport-modal-km"
                        class="input-modern transport-input"
                        min="0"
                        oninput="
                            if (typeof syncRuryTransportFromModal === 'function')
                                syncRuryTransportFromModal();
                        "
                    />
                </div>
                <div class="form-group flex-1-m0">
                    <label class="transport-label">Stawka (PLN/km)</label>
                    <input
                        type="number"
                        id="rury-transport-modal-rate"
                        class="input-modern transport-input"
                        min="0"
                        step="0.01"
                        oninput="
                            if (typeof syncRuryTransportFromModal === 'function')
                                syncRuryTransportFromModal();
                        "
                    />
                </div>
            </div>
            <div class="util-2x-15">
                <label class="util-2x-16">Tryb transportu:</label>
                <button
                    type="button"
                    id="rury-transport-mode-btn"
                    type="button"
                    onclick="toggleRuryTransportMode()"
                    class="util-2x-17"
                >
                    <i data-lucide="truck" class="icon-xxs"></i>
                    <span id="rury-transport-mode-label">Pełne</span>
                </button>
            </div>
            <div id="rury-transport-modal-trips-info" class="util-single-124"></div>
            <div id="rury-transport-modal-cost-details" class="gap-3 util-2x-18">
                <div class="transport-cost-card">
                    <div class="transport-cost-label">Koszt / transport</div>
                    <div
                        id="rury-transport-modal-cost-per-trip"
                        class="transport-cost-value transport-cost-value--warn"
                    >
                        0 PLN
                    </div>
                </div>
                <div class="transport-cost-card">
                    <div class="transport-cost-label">Ilość transportów</div>
                    <div
                        id="rury-transport-modal-count"
                        class="transport-cost-value transport-cost-value--blue"
                    >
                        0
                    </div>
                </div>
                <div class="transport-cost-card">
                    <div class="transport-cost-label">Koszt transportu</div>
                    <div
                        id="rury-transport-modal-total-cost"
                        class="transport-cost-value transport-cost-value--success"
                    >
                        0 PLN
                    </div>
                </div>
            </div>
            <div class="util-single-125">
                <div class="util-2x-19">Aktualna Łączna Suma Netto</div>
                <div id="rury-transport-modal-total-val" class="util-2x-20">0 PLN</div>
            </div>
        </div>
        <div class="gap-3 util-single-126">
            <button
                type="button"
                class="btn btn-secondary fs-sm-04-1-bold"
                onclick="handleRuryTransportCancel()"
            >
                Zamknij
            </button>
            <button
                type="button"
                class="btn btn-primary fs-sm-04-12-eb"
                onclick="handleRuryTransportSave()"
            >
                <i data-lucide="check" class="icon-11"></i>
                Zastosuj
            </button>
        </div>
    </div>
</div>
