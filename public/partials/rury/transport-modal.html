<!-- PARTIAL: transport-modal.html -->
<!-- ===== OFFER TRANSPORT MODAL (Rury) ===== -->
<div id="rury-transport-modal" class="modal-overlay" style="display: none; z-index: 10000">
    <div class="rury-transport-modal">
        <div class="rury-transport-header">
            <div id="rury-transport-modal-title" class="rury-transport-title gap-2">
                <i data-lucide="truck" style="width: 18px; height: 18px"></i> Koszty Transportu
            </div>
            <button
                type="button"
                class="btn btn-icon"
                onclick="handleRuryTransportCancel()"
                style="color: var(--text-muted)"
            >
                <i data-lucide="x" style="width: 16px; height: 16px"></i>
            </button>
        </div>
        <div style="padding: 2rem 1.5rem">
            <p
                style="
                    color: var(--text-muted);
                    margin-bottom: 1.75rem;
                    font-size: var(--fs-sm);
                    line-height: 1.5;
                "
            >
                Wprowadź dystans oraz stawkę. Formularz jest zsynchronizowany z danymi oferty i
                ulegnie przedawnieniu tylko po odrzuceniu zmian.
            </p>
            <div class="gap-4" style="display: flex; align-items: flex-end">
                <div class="form-group" style="flex: 1; margin: 0">
                    <label class="transport-label">Odległość (km)</label>
                    <input
                        type="number"
                        id="rury-transport-modal-km"
                        class="input-modern transport-input"
                        min="0"
                        oninput="
                            if (typeof syncRuryTransportFromModal === 'function')
                                syncRuryTransportFromModal();
                        "
                    />
                </div>
                <div class="form-group" style="flex: 1; margin: 0">
                    <label class="transport-label">Stawka (PLN/km)</label>
                    <input
                        type="number"
                        id="rury-transport-modal-rate"
                        class="input-modern transport-input"
                        min="0"
                        step="0.01"
                        oninput="
                            if (typeof syncRuryTransportFromModal === 'function')
                                syncRuryTransportFromModal();
                        "
                    />
                </div>
            </div>
            <div
                style="
                    margin-top: 0.8rem;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 0.6rem;
                "
            >
                <label
                    style="
                        font-size: var(--fs-xs);
                        color: var(--text-muted);
                        font-weight: var(--fw-semibold);
                    "
                    >Tryb transportu:</label
                >
                <button
                    type="button"
                    id="rury-transport-mode-btn"
                    type="button"
                    onclick="toggleRuryTransportMode()"
                    style="
                        display: inline-flex;
                        align-items: center;
                        gap: 0.35rem;
                        padding: 0.3rem 0.7rem;
                        border-radius: var(--radius-sm);
                        border: 1px solid var(--border-glass);
                        background: rgba(var(--black-rgb), 0.2);
                        color: var(--text-heading);
                        font-size: var(--fs-sm);
                        font-weight: var(--fw-bold);
                        cursor: pointer;
                        transition: all 0.15s;
                    "
                >
                    <i data-lucide="truck" style="width: 12px; height: 12px"></i>
                    <span id="rury-transport-mode-label">Pełne</span>
                </button>
            </div>
            <div
                id="rury-transport-modal-trips-info"
                style="
                    margin-top: 1rem;
                    text-align: center;
                    font-size: var(--fs-sm);
                    color: var(--text-muted);
                "
            ></div>
            <div
                id="rury-transport-modal-cost-details"
                class="gap-3"
                style="margin-top: 1rem; display: grid; grid-template-columns: 1fr 1fr 1fr"
            >
                <div class="transport-cost-card">
                    <div class="transport-cost-label">Koszt / transport</div>
                    <div
                        id="rury-transport-modal-cost-per-trip"
                        class="transport-cost-value transport-cost-value--warn"
                    >
                        0 PLN
                    </div>
                </div>
                <div class="transport-cost-card">
                    <div class="transport-cost-label">Ilość transportów</div>
                    <div
                        id="rury-transport-modal-count"
                        class="transport-cost-value transport-cost-value--blue"
                    >
                        0
                    </div>
                </div>
                <div class="transport-cost-card">
                    <div class="transport-cost-label">Koszt transportu</div>
                    <div
                        id="rury-transport-modal-total-cost"
                        class="transport-cost-value transport-cost-value--success"
                    >
                        0 PLN
                    </div>
                </div>
            </div>
            <div
                style="
                    margin-top: 1.75rem;
                    text-align: center;
                    background: rgba(var(--black-rgb), 0.3);
                    border: 1px dashed var(--border-glass);
                    padding: 1rem;
                    border-radius: var(--radius);
                "
            >
                <div
                    style="
                        font-size: var(--fs-xs);
                        color: var(--text-muted);
                        text-transform: uppercase;
                        font-weight: var(--fw-bold);
                        margin-bottom: 0.25rem;
                        letter-spacing: 2px;
                    "
                >
                    Aktualna Łączna Suma Netto
                </div>
                <div
                    id="rury-transport-modal-total-val"
                    style="
                        font-size: var(--fs-2xl);
                        font-weight: var(--fw-black);
                        color: var(--success);
                        letter-spacing: -1px;
                    "
                >
                    0 PLN
                </div>
            </div>
        </div>
        <div
            class="gap-3"
            style="
                padding: 1rem 1.5rem;
                border-top: 1px solid var(--border-glass);
                background: rgba(var(--black-rgb), 0.2);
                display: flex;
                justify-content: flex-end;
            "
        >
            <button
                type="button"
                class="btn btn-secondary"
                onclick="handleRuryTransportCancel()"
                style="font-size: var(--fs-sm); padding: 0.4rem 1rem; font-weight: var(--fw-bold)"
            >
                Zamknij
            </button>
            <button
                type="button"
                class="btn btn-primary"
                onclick="handleRuryTransportSave()"
                style="
                    font-size: var(--fs-sm);
                    padding: 0.4rem 1.2rem;
                    font-weight: var(--fw-extrabold);
                "
            >
                <i data-lucide="check" style="width: 11px; height: 11px; margin-right: 0.25rem"></i>
                Zastosuj
            </button>
        </div>
    </div>
</div>
