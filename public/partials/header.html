<!-- HEADER -->
<header class="header" aria-label="Nagłówek aplikacji">
    <div class="header-inner">
        <div class="header-left">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="url(#lg-s-header)" stroke-width="2">
                    <defs>
                        <linearGradient id="lg-s-header" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" class="util-single-100" />
                            <stop offset="100%" class="util-single-101" />
                        </linearGradient>
                    </defs>
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <path d="M4 12h16M12 4v16" />
                </svg>
                <h1>Kalkulator Studni</h1>
            </div>
            <nav class="nav-apps" aria-label="Główna">
                <a href="index.html" target="_parent" class="nav-tile">
                    <span class="nav-tile-icon"><i data-lucide="home"></i></span>
                    <span class="nav-tile-text">Pulpit</span>
                </a>
                <a
                    href="app.html#/studnie"
                    target="_parent"
                    class="nav-tile active nav-tile--studnie"
                >
                    <span class="nav-tile-icon"><i data-lucide="cylinder"></i></span>
                    <span class="nav-tile-text">Studnie</span>
                </a>
                <a href="app.html#/rury" target="_parent" class="nav-tile">
                    <span class="nav-tile-icon"
                        ><i data-lucide="cylinder" class="lucide-rotate-n90"></i
                    ></span>
                    <span class="nav-tile-text">Rury</span>
                </a>
                <a href="app.html#/kartoteka" target="_parent" class="nav-tile">
                    <span class="nav-tile-icon"><i data-lucide="archive"></i></span>
                    <span class="nav-tile-text">Kartoteka</span>
                </a>
            </nav>
        </div>
        <div class="header-center">
            <nav class="nav">
                <button
                    type="button"
                    class="nav-btn nav-tile active nav-tile--studnie"
                    data-section="builder"
                    id="nav-builder"
                    onclick="showSection('builder')"
                >
                    <span class="nav-tile-icon"><i data-lucide="hard-hat"></i></span>
                    <span class="nav-tile-text">Konfiguracja</span>
                </button>
                <button
                    type="button"
                    class="nav-btn nav-tile nav-tile--oferta"
                    data-section="offer"
                    id="nav-offer"
                    onclick="showSection('offer')"
                >
                    <span class="nav-tile-icon"><i data-lucide="bar-chart-2"></i></span>
                    <span class="nav-tile-text">Oferta</span>
                </button>
                <button
                    type="button"
                    class="nav-btn nav-tile nav-tile--cennik"
                    data-section="pricelist"
                    id="nav-pricelist"
                    onclick="showSection('pricelist')"
                >
                    <span class="nav-tile-icon"><i data-lucide="clipboard-list"></i></span>
                    <span class="nav-tile-text">Cennik</span>
                </button>
            </nav>
        </div>
        <div class="header-right">
            <div id="header-user-info" class="header-user-info">
                <span id="header-username" class="header-username"></span>
                <span id="header-role-badge" class="header-role-badge"></span>
                <button type="button" onclick="appLogout()" class="header-logout">Wyloguj</button>
            </div>
        </div>
    </div>
</header>
