<!-- SIDEBAR: Wells list and discounts -->
<!-- RIGHT: Wells list sidebar -->
<div class="wells-sidebar">
    <div class="wells-sidebar-panel">
        <div class="wells-sidebar-header gap-1 wells-sidebar-header--stack">
            <!-- Main Action Buttons at the very top -->
            <div class="wells-sidebar-actions cols-1">
                <button
                    type="button"
                    class="btn btn-secondary btn-sm btn-sidebar btn-sidebar--excel util-single-165"
                    onclick="openExcelTableModal()"
                >
                    <span><i data-lucide="table"></i></span>
                    <span class="btn-sidebar-label">Excel</span>
                </button>
            </div>
            <div class="wells-sidebar-actions cols-2">
                <button
                    type="button"
                    class="btn btn-secondary btn-sm btn-sidebar util-single-166"
                    onclick="window.openGlobalRecalcModal()"
                >
                    <span class="fs-1"><i data-lucide="settings"></i></span>
                    <span class="btn-sidebar-label">Przelicz</span>
                </button>
                <button
                    type="button"
                    class="btn btn-secondary btn-sm btn-sidebar util-single-167"
                    onclick="openTransitionManagerModal()"
                >
                    <span class="fs-1"><i data-lucide="droplets"></i></span>
                    <span class="btn-sidebar-label">M. Przejść</span>
                </button>
                <button
                    type="button"
                    class="btn btn-success btn-sm btn-sidebar"
                    id="btn-save-studnie-sidebar"
                    onclick="saveOfferStudnie()"
                >
                    <span class="fs-1"><i data-lucide="save"></i></span>
                    <span class="btn-sidebar-label">Zapisz</span>
                </button>
                <button
                    type="button"
                    class="btn btn-success btn-sm btn-sidebar util-single-168"
                    id="btn-save-zamowienie-sidebar"
                    onclick="saveCurrentOrder()"
                >
                    <span class="fs-1"><i data-lucide="save"></i></span>
                    <span class="btn-sidebar-label">Zapisz</span>
                </button>
                <button
                    type="button"
                    class="btn btn-sm btn-sidebar util-single-169"
                    onclick="handlePrintClick()"
                >
                    <span class="fs-1"><i data-lucide="printer"></i></span>
                    <span class="btn-sidebar-label">Wydruk</span>
                </button>
                <button
                    type="button"
                    class="btn btn-sm btn-sidebar util-single-170"
                    onclick="createOrderFromOffer()"
                >
                    <span class="fs-1"><i data-lucide="package"></i></span>
                    <span class="btn-sidebar-label">Zamów</span>
                </button>
                <button
                    type="button"
                    id="btn-zlecenia-sidebar"
                    class="btn btn-sm btn-sidebar util-single-171"
                    onclick="openZleceniaProdukcyjne()"
                >
                    <span class="fs-1"><i data-lucide="factory"></i></span>
                    <span class="btn-sidebar-label">Zlecenia</span>
                </button>
            </div>

            <!-- Add Well Buttons -->
            <div class="wells-sidebar-actions cols-6">
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(1000)"
                >
                    +1000
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(1200)"
                >
                    +1200
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(1500)"
                >
                    +1500
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(2000)"
                >
                    +2000
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(2500)"
                >
                    +2500
                </button>
                <button
                    type="button"
                    class="btn btn-sm btn-well-add btn-well-add--styczna"
                    onclick="addNewWell('styczna')"
                >
                    +Styczeń
                </button>
            </div>

            <!-- Tabs Switcher -->
            <div class="sidebar-tabs gap-1">
                <button
                    type="button"
                    class="s-tab-btn active"
                    onclick="switchSidebarTab('list')"
                    id="stab-list"
                >
                    <i data-lucide="folder-open"></i> Lista studni
                    <span id="wells-counter" class="util-single-172">(0)</span>
                </button>
                <button
                    type="button"
                    class="s-tab-btn"
                    onclick="switchSidebarTab('discounts')"
                    id="stab-discounts"
                >
                    <i data-lucide="banknote"></i> Rabaty
                </button>
            </div>
        </div>

        <!-- Content below header -->
        <div id="sidebar-list-content" class="sidebar-content">
            <div class="util-single-173">
                <div class="util-single-174">
                    <input
                        type="text"
                        id="wells-search-input"
                        class="wells-search-input"
                        placeholder="Szukaj po numerze..."
                        aria-label="Szukaj studni po numerze"
                        oninput="renderWellsList()"
                    />
                </div>
            </div>
            <div id="wells-list" class="util-single-175"></div>
        </div>
        <div id="sidebar-discounts-content" class="util-single-176">
            <div id="wells-discount-panel"></div>
        </div>
    </div>
    <!-- /wells-sidebar-panel -->
</div>
