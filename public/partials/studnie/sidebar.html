<!-- SIDEBAR: Wells list and discounts -->
<!-- RIGHT: Wells list sidebar -->
<div class="wells-sidebar">
    <div class="wells-sidebar-panel">
        <div class="wells-sidebar-header gap-1 wells-sidebar-header--stack">
            <!-- Main Action Buttons at the very top -->
            <div class="wells-sidebar-actions cols-1">
                <button
                    type="button"
                    class="btn btn-secondary btn-sm btn-sidebar btn-sidebar--excel"
                    style="
                        background: rgba(var(--success-rgb), 0.15);
                        color: var(--success-hover);
                        border-color: rgba(var(--success-rgb), 0.3);
                    "
                    onclick="openExcelTableModal()"
                >
                    <span><i data-lucide="table"></i></span>
                    <span class="btn-sidebar-label">Excel</span>
                </button>
            </div>
            <div class="wells-sidebar-actions cols-2">
                <button
                    type="button"
                    class="btn btn-secondary btn-sm btn-sidebar"
                    style="
                        background: rgba(var(--accent-rgb), 0.15);
                        color: var(--accent-text);
                        border-color: rgba(var(--accent-rgb), 0.3);
                    "
                    onclick="window.openGlobalRecalcModal()"
                >
                    <span class="fs-1"><i data-lucide="settings"></i></span>
                    <span class="btn-sidebar-label">Przelicz</span>
                </button>
                <button
                    type="button"
                    class="btn btn-secondary btn-sm btn-sidebar"
                    style="
                        background: rgba(var(--accent2-rgb), 0.15);
                        color: var(--accent2-hover);
                        border-color: rgba(var(--accent2-rgb), 0.3);
                    "
                    onclick="openTransitionManagerModal()"
                >
                    <span class="fs-1"><i data-lucide="droplets"></i></span>
                    <span class="btn-sidebar-label">M. Przejść</span>
                </button>
                <button
                    type="button"
                    class="btn btn-success btn-sm btn-sidebar"
                    id="btn-save-studnie-sidebar"
                    onclick="saveOfferStudnie()"
                >
                    <span class="fs-1"><i data-lucide="save"></i></span>
                    <span class="btn-sidebar-label">Zapisz</span>
                </button>
                <button
                    type="button"
                    class="btn btn-success btn-sm btn-sidebar"
                    id="btn-save-zamowienie-sidebar"
                    style="
                        display: none;
                        background: rgba(var(--success-rgb), 0.2);
                        border-color: rgba(var(--success-rgb), 0.5);
                        color: var(--success-hover);
                    "
                    onclick="saveCurrentOrder()"
                >
                    <span class="fs-1"><i data-lucide="save"></i></span>
                    <span class="btn-sidebar-label">Zapisz</span>
                </button>
                <button
                    type="button"
                    class="btn btn-sm btn-sidebar"
                    style="
                        background: rgba(var(--danger-rgb), 0.1);
                        border: 1px solid rgba(var(--danger-rgb), 0.3);
                        color: var(--danger-hover);
                    "
                    onclick="handlePrintClick()"
                >
                    <span class="fs-1"><i data-lucide="printer"></i></span>
                    <span class="btn-sidebar-label">Wydruk</span>
                </button>
                <button
                    type="button"
                    class="btn btn-sm btn-sidebar"
                    style="
                        display: none !important;
                        background: var(--slate-800);
                        border: 1px solid var(--success-bg);
                        color: var(--success-hover);
                    "
                    onclick="createOrderFromOffer()"
                >
                    <span class="fs-1"><i data-lucide="package"></i></span>
                    <span class="btn-sidebar-label">Zamów</span>
                </button>
                <button
                    type="button"
                    id="btn-zlecenia-sidebar"
                    class="btn btn-sm btn-sidebar"
                    style="
                        display: none;
                        grid-column: span 2;
                        background: var(--warn-bg);
                        border: 1px solid var(--warn-border);
                        color: var(--warn);
                    "
                    onclick="openZleceniaProdukcyjne()"
                >
                    <span class="fs-1"><i data-lucide="factory"></i></span>
                    <span class="btn-sidebar-label">Zlecenia</span>
                </button>
            </div>

            <!-- Add Well Buttons -->
            <div class="wells-sidebar-actions cols-6">
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(1000)"
                >
                    +1000
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(1200)"
                >
                    +1200
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(1500)"
                >
                    +1500
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(2000)"
                >
                    +2000
                </button>
                <button
                    type="button"
                    class="btn btn-primary btn-sm btn-well-add"
                    onclick="addNewWell(2500)"
                >
                    +2500
                </button>
                <button
                    type="button"
                    class="btn btn-sm btn-well-add btn-well-add--styczna"
                    onclick="addNewWell('styczna')"
                >
                    +Styczeń
                </button>
            </div>

            <!-- Tabs Switcher -->
            <div
                class="sidebar-tabs gap-1"
                style="
                    display: flex;
                    margin-top: 0.4rem;
                    padding: 0.2rem;
                    background: rgba(var(--black-rgb), 0.3);
                    border-radius: var(--radius-sm);
                    border: 1px solid rgba(var(--white-rgb), 0.05);
                "
            >
                <button
                    type="button"
                    class="s-tab-btn active"
                    onclick="switchSidebarTab('list')"
                    id="stab-list"
                    style="flex: 1; font-size: var(--fs-xs); padding: 0.35rem 0.2rem"
                >
                    <i data-lucide="folder-open"></i> Lista studni
                    <span id="wells-counter" style="opacity: 0.6; margin-left: 2px">(0)</span>
                </button>
                <button
                    type="button"
                    class="s-tab-btn"
                    onclick="switchSidebarTab('discounts')"
                    id="stab-discounts"
                    style="flex: 1; font-size: var(--fs-xs); padding: 0.35rem 0.2rem"
                >
                    <i data-lucide="banknote"></i> Rabaty
                </button>
            </div>
        </div>

        <!-- Content below header -->
        <div
            id="sidebar-list-content"
            style="flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden"
        >
            <div
                style="
                    padding: 0.4rem;
                    border-bottom: 1px solid rgba(var(--white-rgb), 0.05);
                    background: rgba(var(--white-rgb), 0.05);
                "
            >
                <div style="position: relative; display: flex; align-items: center">
                    <input
                        type="text"
                        id="wells-search-input"
                        placeholder="Szukaj po numerze..."
                        aria-label="Szukaj studni po numerze"
                        oninput="renderWellsList()"
                        style="
                            width: 100%;
                            padding: 0.4rem 0.6rem;
                            background: rgba(var(--black-rgb), 0.2);
                            border: 1px solid rgba(var(--white-rgb), 0.1);
                            border-radius: var(--radius-sm);
                            color: var(--white);
                            font-size: var(--fs-base);
                            outline: none;
                            transition: all 0.2s;
                        "
                        onfocus="
                            this.style.borderColor = 'rgba(var(--accent-rgb), 0.5)';
                            this.style.background = 'rgba(var(--black-rgb), 0.3)';
                        "
                        onblur="
                            this.style.borderColor = 'rgba(var(--white-rgb), 0.1)';
                            this.style.background = 'rgba(var(--black-rgb), 0.2)';
                        "
                    />
                </div>
            </div>
            <div id="wells-list" style="padding: 0.4rem"></div>
        </div>
        <div
            id="sidebar-discounts-content"
            style="flex: 1; display: none; flex-direction: column; overflow: hidden"
        >
            <div id="wells-discount-panel"></div>
        </div>
    </div>
    <!-- /wells-sidebar-panel -->
</div>
