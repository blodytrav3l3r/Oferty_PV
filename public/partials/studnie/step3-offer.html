<!-- STEP 3: Calculator / Config -->
<!-- ====== WIZARD STEP 3: Calculator ====== -->
<div class="wizard-step" id="wizard-step-3">
    <!-- Summary bar -->
    <div class="wizard-summary-bar" id="wizard-summary-bar">
        <span class="wizard-summary-item"
            ><i data-lucide="file-text"></i> <strong id="wsb-offer">—</strong></span
        >
        <span class="wizard-summary-divider"></span>
        <span class="wizard-summary-item"
            ><i data-lucide="clipboard-list"></i> <strong id="wsb-client">—</strong></span
        >
        <span class="wizard-summary-divider"></span>
        <span class="wizard-summary-item"
            ><i data-lucide="hard-hat"></i> <strong id="wsb-invest">—</strong></span
        >
        <span class="wizard-summary-divider"></span>
        <span class="wizard-summary-item"
            ><i data-lucide="map-pin"></i> <strong id="wsb-address">—</strong></span
        >
        <span class="wizard-summary-divider"></span>
        <span class="wizard-summary-item"
            ><i data-lucide="settings"></i> <strong id="wsb-params">—</strong></span
        >

        <button type="button" class="wizard-summary-edit" onclick="goToWizardStep(1)">
            <i data-lucide="pencil"></i> Edytuj dane
        </button>
        <button type="button" class="wizard-summary-edit" onclick="goToWizardStep(2)">
            <i data-lucide="settings"></i> Edytuj parametry
        </button>
    </div>

    <!-- CENTER: Config area -->
    <div>
        <!-- Błędy konfiguracji studni -->
        <div id="well-config-errors-container" class="well-config-errors"></div>
        <!-- Toolbar: DN + Elevations + Height + Controls -->
        <div class="well-info-card p-6-8">
            <!-- Row 1: Title -->
            <div class="util-single-187">
                <span class="util-single-188"
                    ><i data-lucide="settings"></i> Konfiguracja studni</span
                >
            </div>
            <!-- Row 2: Nr + Rz fields + indicators -->
            <div class="gap-1 util-single-189">
                <div class="flex-center-gap-2">
                    <label class="well-label">Nr</label>
                    <input
                        type="text"
                        id="input-well-numer"
                        class="well-input well-input--accent"
                        placeholder="Nr studni"
                        oninput="updateWellNumer()"
                        onclick="this.select()"
                    />
                </div>
                <div class="util-2x-37"></div>
                <div class="flex-center-gap-2">
                    <label class="well-label">Rz. włazu</label>
                    <input
                        type="text"
                        inputmode="decimal"
                        step="0.001"
                        id="input-rzedna-wlazu"
                        class="well-input well-input--primary"
                        placeholder="100.50"
                        onfocus="this.select()"
                        onblur="
                            resolveFieldValue(this);
                            updateElevations();
                        "
                        onclick="this.select()"
                        onkeydown="
                            if (event.key === 'Enter') {
                                this.blur();
                            }
                        "
                    />
                </div>
                <div class="flex-center-gap-2">
                    <label class="well-label">Rz. dna</label>
                    <input
                        type="text"
                        inputmode="decimal"
                        step="0.001"
                        id="input-rzedna-dna"
                        class="well-input well-input--primary"
                        placeholder="97.20"
                        onfocus="this.select()"
                        onblur="
                            resolveFieldValue(this);
                            updateElevations();
                        "
                        onclick="this.select()"
                        onkeydown="
                            if (event.key === 'Enter') {
                                this.blur();
                            }
                        "
                    />
                </div>
                <div class="util-2x-37"></div>
                <div class="gap-2 util-single-190">
                    <span
                        >Wym:
                        <strong id="well-required-height" class="util-single-191">— m</strong></span
                    >
                    <span
                        >Konf:
                        <strong id="well-configured-height" class="util-single-192"
                            >0 m</strong
                        ></span
                    >
                    <span id="height-diff-indicator"></span>
                </div>
                <div class="util-2x-38"></div>
                <div class="flex-center-gap-2">
                    <label class="well-label">Dopłata</label>
                    <input
                        type="text"
                        inputmode="decimal"
                        step="1"
                        id="input-doplata"
                        class="well-input well-input--success"
                        placeholder="0"
                        onblur="
                            resolveFieldValue(this);
                            updateDoplata();
                        "
                        onclick="this.select()"
                        onkeydown="
                            if (event.key === 'Enter') {
                                this.blur();
                            }
                        "
                    />
                </div>
            </div>

            <!-- Row 2: DN selector + controls -->
            <div class="gap-2 util-single-193">
                <div class="gap-1 util-single-194">
                    <span class="util-single-195">DN</span>
                    <div class="dn-selector mb-0">
                        <button type="button" class="dn-btn active" onclick="selectDN(1000)">
                            1000
                        </button>
                        <button type="button" class="dn-btn" onclick="selectDN(1200)">1200</button>
                        <button type="button" class="dn-btn" onclick="selectDN(1500)">1500</button>
                        <button type="button" class="dn-btn" onclick="selectDN(2000)">2000</button>
                        <button type="button" class="dn-btn" onclick="selectDN(2500)">2500</button>
                        <button
                            type="button"
                            class="dn-btn util-single-196"
                            onclick="selectDN('styczna')"
                        >
                            Styczna
                        </button>
                    </div>
                </div>
                <div class="util-2x-38"></div>
                <div class="gap-1 util-2x-29">
                    <button
                        type="button"
                        class="btn btn-secondary btn-sm well-toolbar-btn"
                        onclick="toggleAutoLock()"
                        id="btn-lock-auto"
                    >
                        <i data-lucide="unlock"></i> Ręczny
                    </button>
                    <button
                        type="button"
                        class="btn btn-secondary btn-sm well-toolbar-btn"
                        onclick="toggleRedukcja()"
                        id="btn-redukcja"
                    >
                        <i data-lucide="arrow-down"></i> Redukcja
                    </button>
                    <button
                        type="button"
                        class="btn btn-secondary btn-sm well-toolbar-btn"
                        onclick="togglePsiaBuda()"
                        id="btn-psia-buda"
                    >
                        🐶 Psia buda
                    </button>
                    <button
                        type="button"
                        class="btn btn-secondary btn-sm well-toolbar-btn hidden"
                        onclick="toggleStyczna1200()"
                        id="btn-styczna-1200"
                    >
                        Nadbudowa DN1200
                    </button>
                    <div id="redukcja-min-wrap" class="gap-1 util-single-197">
                        <label class="util-single-198">Min:</label>
                        <input
                            type="number"
                            id="redukcja-min-h"
                            value="2.5"
                            step="0.1"
                            min="0.5"
                            max="10"
                            onchange="onRedukcjaMinChange(this.value)"
                            class="util-single-199"
                        />
                        <span class="util-2x-39">m</span>
                        <button
                            type="button"
                            class="btn btn-secondary btn-sm util-single-200"
                            onclick="openRedukcjaZakonczeniePopup()"
                            id="btn-redukcja-zak"
                        >
                            <span class="text-xs"><i data-lucide="chevron-down"></i></span>
                            Zak. DN1000
                        </button>
                    </div>
                    <button
                        type="button"
                        class="btn btn-secondary btn-sm well-toolbar-btn"
                        onclick="openZakonczeniePopup()"
                        id="btn-zakonczenie"
                    >
                        <span class="text-xs"><i data-lucide="chevron-down"></i></span>
                        Zakończenie
                    </button>
                    <button
                        type="button"
                        class="btn btn-primary btn-sm well-toolbar-btn"
                        onclick="autoSelectComponents()"
                        id="btn-auto-select"
                    >
                        <i data-lucide="settings"></i> Auto
                    </button>
                    <button
                        type="button"
                        class="btn btn-secondary btn-sm well-toolbar-btn"
                        onclick="clearWellConfig()"
                    >
                        <i data-lucide="refresh-cw"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Per-well parameters (editable, inherited from wizard step 2) -->
        <div class="card-sm p-6-8">
            <div
                class="card-title card-title--config"
                onclick="toggleCard('well-params-content', 'well-params-icon')"
            >
                <span><i data-lucide="clipboard-list"></i> Parametry tej studni</span>
                <span id="well-params-icon" class="fs-075"><i data-lucide="chevron-down"></i></span>
            </div>
            <div id="well-params-content" class="card-content util-single-201">
                <div id="well-params-container"></div>
            </div>
        </div>

        <!-- Builder tabs -->
        <div class="builder-sub-nav gap-1">
            <button
                type="button"
                class="b-tab-btn active"
                onclick="switchBuilderTab('concrete')"
                id="btab-concrete"
            >
                <i data-lucide="cylinder"></i> Prefabrykaty betonowe
            </button>
            <button
                type="button"
                class="b-tab-btn"
                onclick="switchBuilderTab('transitions')"
                id="btab-transitions"
            >
                <i data-lucide="droplets"></i> Przejścia szczelne
            </button>
        </div>

        <!-- TAB: CONCRETE CONTENT -->
        <div id="bcontent-concrete">
            <div class="card-sm p-6-8">
                <div
                    class="card-title card-title--config"
                    onclick="toggleCard('tiles-content', 'tiles-icon')"
                >
                    <span><i data-lucide="brick-wall"></i> Wybór elementów</span>
                    <span id="tiles-icon" class="fs-075"><i data-lucide="chevron-up"></i></span>
                </div>
                <div id="tiles-content" class="card-content mt-5">
                    <div id="tiles-container"></div>
                </div>
            </div>

            <div class="card card-sm">
                <div
                    class="card-title card-title--config util-single-202"
                    onclick="toggleCard('well-config-wrap', 'well-config-icon')"
                >
                    <span><i data-lucide="package"></i> Konfiguracja betonowa</span>
                    <span id="well-config-icon" class="fs-075"
                        ><i data-lucide="chevron-up"></i
                    ></span>
                </div>
                <div id="well-config-wrap" class="table-wrap card-content">
                    <div id="well-config-body" class="gap-2 well-config-body">
                        <div class="util-single-203">
                            Kliknij kafelki powyżej, aby dodać elementy studni
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB: TRANSITIONS CONTENT -->
        <div id="bcontent-transitions" class="hidden">
            <div class="card card-sm">
                <div
                    class="card-title card-title--config"
                    onclick="
                        window.toggleCard('inline-przejscia-app-container', 'przejscia-app-icon')
                    "
                >
                    <span><i data-lucide="plus"></i> Dodaj Przejście Szczelne</span>
                    <span id="przejscia-app-icon" class="fs-075"
                        ><i data-lucide="chevron-down"></i
                    ></span>
                </div>
                <div id="inline-przejscia-app-container" class="card-content util-single-204">
                    <div id="inline-przejscia-app"></div>
                </div>
            </div>
            <div class="card util-single-205">
                <div class="card-title util-single-206">
                    <span><i data-lucide="book-open"></i> Lista przejść</span>
                    <span id="przejscia-count" class="util-2x-39"></span>
                </div>
                <div id="well-przejscia-tiles"></div>
            </div>
        </div>

        <!-- Summary bar -->
        <div class="summary-bar">
            <div class="gap-2 summary-grid">
                <div>
                    <div class="summary-label">Cena netto</div>
                    <div class="summary-value summary-value--success" id="sum-price">0 PLN</div>
                </div>
                <div>
                    <div class="summary-label">Waga</div>
                    <div class="summary-value" id="sum-weight">0 kg</div>
                </div>
                <div>
                    <div class="summary-label">Wysokość</div>
                    <div class="summary-value" id="sum-height">0 mm</div>
                </div>
                <div>
                    <div class="summary-label">Pow. wewn.</div>
                    <div class="summary-value" id="sum-area-int">0 m²</div>
                </div>
                <div>
                    <div class="summary-label">Pow. zewn.</div>
                    <div class="summary-value" id="sum-area-ext">0 m²</div>
                </div>
            </div>
        </div>
    </div>
</div>
