<!-- ===== SECTION: PRICE LIST ===== -->
<div class="section" id="section-pricelist" style="padding: 0.8rem 0 200px">
    <div class="toolbar">
        <h2 class="pricelist-toolbar-title">
            <i data-lucide="clipboard-list"></i> Cennik elementów studni
        </h2>
        <div class="toolbar-spacer"></div>
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <input
                class="form-input form-input-sm"
                id="studnie-pricelist-search"
                placeholder="Szukaj..."
                title="Szukaj produktu w cenniku"
                aria-label="Szukaj produktu w cenniku"
            />
        </div>
        <div class="gap-2" style="display: flex; justify-content: flex-end">
            <button
                type="button"
                class="btn btn-primary"
                data-csp="showAddStudnieProductModal"
                title="Dodaj nowy produkt do cennika"
            >
                <i data-lucide="plus"></i> Dodaj
            </button>
            <button
                type="button"
                class="btn btn-secondary"
                id="btn-save-studnie-pricelist"
                data-csp="saveStudniePriceList"
                title="Zapisz zmiany w cenniku"
            >
                <i data-lucide="save"></i> Zapisz
            </button>
            <button
                type="button"
                class="btn btn-secondary"
                data-csp="openStudnieVersionsPanel"
                title="Zarządzanie cennikiem: wersje, pliki, domyślne"
            >
                <i data-lucide="sliders-horizontal"></i> Zarządzaj
            </button>
        </div>
    </div>
    <div class="gap-1" style="display: flex; margin-bottom: 0.8rem; flex-wrap: wrap">
        <button
            type="button"
            class="cennik-tab active"
            data-tab="dn1000"
            data-csp="selectCennikTab"
            data-csp-args='["dn1000"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--accent)"></span> DN1000
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dn1200"
            data-csp="selectCennikTab"
            data-csp-args='["dn1200"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--accent2)"></span> DN1200
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dn1500"
            data-csp="selectCennikTab"
            data-csp-args='["dn1500"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--pink)"></span> DN1500
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dn2000"
            data-csp="selectCennikTab"
            data-csp-args='["dn2000"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--warn)"></span> DN2000
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dn2500"
            data-csp="selectCennikTab"
            data-csp-args='["dn2500"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--danger)"></span> DN2500
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="styczne"
            data-csp="selectCennikTab"
            data-csp-args='["styczne"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--warn)"></span> Styczne
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dennicy"
            data-csp="selectCennikTab"
            data-csp-args='["dennicy"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--success)"></span> Dennicy
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="akcesoria"
            data-csp="selectCennikTab"
            data-csp-args='["akcesoria"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--slate-500)"></span>
            Akcesoria
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="przejscia"
            data-csp="selectCennikTab"
            data-csp-args='["przejscia"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--success)"></span> Przejścia
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="kinety"
            data-csp="selectCennikTab"
            data-csp-args='["kinety"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--accent2)"></span> Kinety
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="transport"
            data-csp="selectCennikTab"
            data-csp-args='["transport"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--warn)"></span> Transport
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="preco"
            data-csp="selectCennikTab"
            data-csp-args='["preco"]'
        >
            <span class="cennik-tab-icon" style="--pricelist-dot: var(--danger)"></span> Wkładki
            PRECO
        </button>
    </div>
    <div class="card">
        <div id="studnie-pricelist-body"></div>
    </div>
</div>
