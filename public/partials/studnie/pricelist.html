<!-- ===== SECTION: PRICE LIST ===== -->
<div class="section util-single-158" id="section-pricelist">
    <div class="toolbar util-single-159">
        <h2 class="fs-2xl-bold-plain">
            <i data-lucide="clipboard-list"></i> Cennik elementów studni
        </h2>
        <div class="toolbar-spacer"></div>
        <div class="search-box search-box--pricelist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <input
                class="form-input form-input-sm"
                id="studnie-pricelist-search"
                placeholder="Szukaj..."
                aria-label="Szukaj produktu w cenniku"
                title="Szukaj produktu w cenniku"
            />
        </div>
        <div class="cennik-actions gap-2 util-single-160">
            <button
                type="button"
                class="btn btn-primary"
                onclick="showAddStudnieProductModal()"
                title="Dodaj nowy produkt do cennika"
            >
                <i data-lucide="plus"></i> Dodaj
            </button>
            <button
                type="button"
                class="btn btn-secondary"
                id="btn-save-studnie-pricelist"
                onclick="saveStudniePriceList()"
                title="Zapisz zmiany w cenniku"
            >
                <i data-lucide="save"></i> Zapisz
            </button>
            <button
                type="button"
                id="btn-save-defaults"
                class="btn btn-secondary"
                onclick="window.parent.saveAllDefaults()"
                title="Zapisz bieżący stan cenników (rury, studnie, PRECO) jako domyślne"
            >
                <i data-lucide="bookmark"></i> Zapisz domyślne
            </button>
            <button
                type="button"
                class="btn btn-secondary"
                onclick="exportStudnieToExcel()"
                title="Eksportuj cennik do pliku Excel"
            >
                <i data-lucide="upload"></i> Eksportuj Excel
            </button>
            <button
                type="button"
                class="btn btn-secondary"
                onclick="document.getElementById('import-studnie-excel').click()"
                title="Importuj cennik z pliku Excel"
            >
                <i data-lucide="download"></i> Importuj Excel
            </button>
            <input
                type="file"
                id="import-studnie-excel"
                class="hidden"
                accept=".xlsx,.xls"
                onchange="importStudnieFromExcel(event)"
            />

            <button
                type="button"
                class="btn btn-danger"
                onclick="resetStudniePriceList()"
                title="Przywróć domyślne wartości cennika"
            >
                <i data-lucide="refresh-cw"></i> Reset
            </button>
        </div>
    </div>
    <div class="cennik-tabs gap-1 util-single-161">
        <button
            type="button"
            class="cennik-tab active"
            data-tab="dn1000"
            onclick="selectCennikTab('dn1000')"
        >
            <span class="cennik-tab-icon util-single-162"></span> DN1000
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dn1200"
            onclick="selectCennikTab('dn1200')"
        >
            <span class="cennik-tab-icon util-2x-32"></span> DN1200
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dn1500"
            onclick="selectCennikTab('dn1500')"
        >
            <span class="cennik-tab-icon util-single-163"></span> DN1500
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dn2000"
            onclick="selectCennikTab('dn2000')"
        >
            <span class="cennik-tab-icon util-2x-33"></span> DN2000
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dn2500"
            onclick="selectCennikTab('dn2500')"
        >
            <span class="cennik-tab-icon util-2x-34"></span> DN2500
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="styczne"
            onclick="selectCennikTab('styczne')"
        >
            <span class="cennik-tab-icon util-2x-33"></span> Styczne
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="dennicy"
            onclick="selectCennikTab('dennicy')"
        >
            <span class="cennik-tab-icon util-2x-35"></span> Dennicy
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="akcesoria"
            onclick="selectCennikTab('akcesoria')"
        >
            <span class="cennik-tab-icon util-single-164"></span> Akcesoria
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="przejscia"
            onclick="selectCennikTab('przejscia')"
        >
            <span class="cennik-tab-icon util-2x-35"></span> Przejścia
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="kinety"
            onclick="selectCennikTab('kinety')"
        >
            <span class="cennik-tab-icon util-2x-32"></span> Kinety
        </button>
        <button
            type="button"
            class="cennik-tab"
            data-tab="preco"
            onclick="selectCennikTab('preco')"
        >
            <span class="cennik-tab-icon util-2x-34"></span> Wkładki PRECO
        </button>
    </div>
    <div class="card">
        <div id="studnie-pricelist-body"></div>
    </div>
</div>
