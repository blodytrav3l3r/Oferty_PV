<!-- ===== SECTION: OFFER ===== -->
<div
    class="section"
    id="section-offer"
    style="padding: var(--tile-gap-sm-plus) var(--section-pad-x) 200px"
>
    <!-- Banner statusu zamówienia (renderOrderStatusBanner, tylko tryb zamówienia).
         Odstęp daje sam .order-banner (margin-bottom: 1rem = rytm strony). -->
    <div id="offer-order-banner-top" class="hidden"></div>
    <!-- Baner kontekstu: oferta / zamówienie (plain text, bez card) -->
    <div
        id="offer-context-banner-studnie"
        style="
            display: none;
            margin-bottom: var(--tile-gap-sm-plus);
            font-size: var(--fs-sm);
            color: var(--text-secondary);
        "
    >
        <strong
            id="offer-context-badge-studnie"
            style="font-weight: var(--fw-bold); color: var(--text-primary)"
        ></strong>
        <span id="offer-context-text-studnie"></span>
    </div>
    <!-- Client & offer info summary (read from builder form) -->
    <div class="card card-compact mb-1">
        <div
            class="card-title-sm"
            style="display: flex; align-items: center; justify-content: space-between; width: 100%"
        >
            <span id="offer-form-title-studnie" style="text-transform: uppercase"
                >Dane klienta i oferty</span
            >
        </div>
        <div class="card-content" style="margin-top: 0.5rem">
            <div
                id="offer-client-summary"
                class="gap-2"
                style="
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                    gap: var(--tile-gap-md);
                    font-size: var(--fs-base);
                    color: var(--text-secondary);
                "
            >
                <div>
                    <div style="color: var(--text-muted); font-size: var(--fs-xs)">Data</div>
                    <div style="font-weight: var(--fw-bold); color: var(--text-primary)">
                        <span id="offer-disp-date">—</span>
                    </div>
                </div>
                <div>
                    <div style="color: var(--text-muted); font-size: var(--fs-xs)">Nr klienta</div>
                    <div style="font-weight: var(--fw-bold); color: var(--text-primary)">
                        <span id="offer-disp-client-number">—</span>
                    </div>
                </div>
                <div>
                    <div style="color: var(--text-muted); font-size: var(--fs-xs)">Firma</div>
                    <div style="font-weight: var(--fw-bold); color: var(--text-primary)">
                        <span id="offer-disp-name">—</span>
                    </div>
                </div>
                <div>
                    <div style="color: var(--text-muted); font-size: var(--fs-xs)">NIP</div>
                    <div style="font-weight: var(--fw-bold); color: var(--text-primary)">
                        <span id="offer-disp-nip">—</span>
                    </div>
                </div>
                <div>
                    <div style="color: var(--text-muted); font-size: var(--fs-xs)">Nr oferty</div>
                    <div style="font-weight: var(--fw-bold); color: var(--text-primary)">
                        <span id="offer-disp-number">—</span>
                    </div>
                </div>
                <div>
                    <div style="color: var(--text-muted); font-size: var(--fs-xs)">
                        Nr zamówienia
                    </div>
                    <div style="font-weight: var(--fw-bold); color: var(--text-primary)">
                        <span id="offer-disp-order-number">—</span>
                    </div>
                </div>
                <div>
                    <div style="color: var(--text-muted); font-size: var(--fs-xs)">Inwestycja</div>
                    <div style="font-weight: var(--fw-bold); color: var(--text-primary)">
                        <span id="offer-disp-invest">—</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- UWAGI DO OFERTY + WARUNKI PŁATNOŚCI -->
    <div
        class="gap-3 mb-1"
        style="
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            gap: var(--tile-gap-md);
        "
    >
        <div class="card" style="padding: 0.8rem; margin: 0">
            <div class="card-header-row">
                <label
                    style="
                        font-size: var(--fs-lg);
                        color: var(--text-primary);
                        font-weight: var(--fw-bold);
                    "
                >
                    <i data-lucide="pencil"></i> Uwagi do oferty
                    <span
                        style="
                            color: var(--text-muted);
                            font-weight: var(--fw-normal);
                            font-size: var(--fs-sm);
                        "
                        >(widoczne na wydruku)</span
                    >
                </label>
                <button
                    type="button"
                    class="btn btn-secondary btn-sm"
                    data-csp="generateOfferNotes"
                    style="font-size: var(--fs-sm); padding: 0.3rem 0.6rem"
                >
                    <i data-lucide="refresh-cw" style="width: 12px; height: 12px"></i>
                    Auto-generuj uwagi
                </button>
            </div>
            <textarea
                id="offer-tab-notes"
                class="wizard-form-input"
                rows="4"
                placeholder="Uwagi zostaną automatycznie wygenerowane..."
                style="resize: vertical; width: 100%; font-size: var(--fs-base)"
            ></textarea>
        </div>

        <!-- WARUNKI PŁATNOŚCI + DATA WAŻNOŚCI -->
        <div class="card" style="padding: 0.8rem; margin: 0">
            <div class="card-header-row">
                <label
                    style="
                        font-size: var(--fs-lg);
                        color: var(--text-primary);
                        font-weight: var(--fw-bold);
                    "
                >
                    <i data-lucide="credit-card"></i> Warunki płatności i ważność oferty
                </label>
            </div>
            <div
                class="gap-3"
                style="
                    display: grid;
                    grid-template-columns: minmax(0, 3fr) minmax(0, 1fr);
                    gap: var(--tile-gap-md);
                "
            >
                <div>
                    <label
                        for="offer-tab-payment-terms"
                        style="
                            display: block;
                            color: var(--text-muted);
                            font-size: var(--fs-xs);
                            margin-bottom: var(--tile-gap-2xs);
                        "
                        >Warunki płatności</label
                    >
                    <textarea
                        id="offer-tab-payment-terms"
                        class="wizard-form-input"
                        rows="2"
                        placeholder="Domyślnie przepisywane z kroku 1..."
                        style="resize: vertical; width: 100%; font-size: var(--fs-base)"
                    ></textarea>
                </div>
                <div>
                    <label
                        for="offer-tab-validity"
                        style="
                            display: block;
                            color: var(--text-muted);
                            font-size: var(--fs-xs);
                            margin-bottom: var(--tile-gap-2xs);
                        "
                        >Data ważności</label
                    >
                    <input
                        id="offer-tab-validity"
                        class="wizard-form-input"
                        style="width: 100%; font-size: var(--fs-base)"
                        data-csp="$select"
                    />
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-1">
        <div class="toolbar" style="margin-top: 0; margin-bottom: 0.5rem; padding: 0">
            <h2 style="font-size: var(--fs-2xl); font-weight: var(--fw-bold)">
                <i data-lucide="bar-chart-2"></i> Zestawienie ofertowe (Studnie)
            </h2>
        </div>
        <div id="offer-summary-body"></div>
    </div>

    <!-- Summary Foot -->
    <div id="offer-summary-footer-fixed" class="offer-summary-footer-fixed">
        <div
            class="summary-grid gap-4"
            style="
                margin: 0 auto;
                max-width: 100%;
                display: grid;
                grid-template-columns: 0.85fr 1.05fr 0.95fr 3fr 1.6fr;
                align-items: stretch;
                text-align: center;
            "
        >
            <!-- CENA NETTO -->
            <div class="summary-card" style="align-items: center; text-align: center">
                <div class="studnie-summary-label">Cena Netto</div>
                <div class="studnie-summary-value accent" id="sum-netto-products">0,00 PLN</div>
            </div>
            <!-- TRANSPORT -->
            <div
                class="summary-card"
                data-csp="openTransportPopup"
                style="
                    align-items: center;
                    text-align: center;
                    cursor: pointer;
                    transition: background 0.2s;
                "
                data-csp-2="$styleSet"
                data-csp-2-on="mouseover"
                data-csp-2-args='["background", "rgba(var(--white-rgb), 0.05)"]'
                data-csp-3="$styleSet"
                data-csp-3-on="mouseout"
                data-csp-3-args='["background", "transparent"]'
            >
                <div class="studnie-summary-label" style="width: 100%">Koszt transportu</div>
                <div
                    class="studnie-summary-value warn gap-2"
                    id="sum-transport-cost"
                    style="
                        white-space: nowrap;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    "
                >
                    <i data-lucide="truck" style="width: 20px; height: 20px"></i> 0 PLN
                </div>
                <div
                    id="offer-active-transport-info"
                    style="
                        font-size: var(--fs-base);
                        color: var(--text-secondary);
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        line-height: 1.3;
                        text-align: center;
                        margin-top: 0.15rem;
                    "
                >
                    <!-- info o transporcie wg. JS -->
                </div>
            </div>
            <!-- RAZEM NETTO -->
            <div class="summary-card" style="align-items: center">
                <div class="studnie-summary-label">RAZEM Netto</div>
                <div class="studnie-summary-value success" id="sum-total-netto">0,00 PLN</div>
                <div class="studnie-summary-sub" id="sum-brutto-details">Brutto: 0,00 PLN</div>
            </div>
            <!-- RABATY -->
            <div
                class="summary-card"
                data-csp="openOfferDiscountsPopup"
                style="align-items: stretch; cursor: pointer; transition: background 0.2s"
                data-csp-2="$styleSet"
                data-csp-2-on="mouseover"
                data-csp-2-args='["background", "rgba(var(--white-rgb), 0.05)"]'
                data-csp-3="$styleSet"
                data-csp-3-on="mouseout"
                data-csp-3-args='["background", "transparent"]'
            >
                <div style="text-align: center; margin-bottom: 0.2rem">
                    <span class="studnie-summary-label" style="margin: 0"
                        >Zarządzanie Rabatami</span
                    >
                </div>
                <div id="offer-active-discounts-info" style="width: 100%; min-height: 22px">
                    <!-- Populated by updateOfferSummaryUI -->
                </div>
            </div>
            <!-- AKCJE -->
            <div class="summary-card summary-card-actions">
                <div class="summary-card-actions-grid">
                    <button
                        type="button"
                        id="btn-save-studnie-offer"
                        class="summary-action-btn summary-action-btn--save"
                        data-csp="saveOfferStudnie"
                    >
                        <i data-lucide="save"></i> Zapisz ofertę
                    </button>
                    <button
                        type="button"
                        id="btn-create-order-offer"
                        class="summary-action-btn summary-action-btn--order"
                        data-csp="createOrderFromOffer"
                    >
                        <i data-lucide="package"></i> Utwórz zamówienie
                    </button>
                    <button
                        type="button"
                        class="summary-action-btn summary-action-btn--print"
                        data-csp="showOfferExportChoice"
                    >
                        <i data-lucide="printer"></i> Wydruk
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
