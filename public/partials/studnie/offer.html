<!-- ===== SECTION: OFFER ===== -->
<div class="section util-single-148" id="section-offer">
    <!-- Baner kontekstu: oferta / zamówienie -->
    <div id="offer-context-banner-studnie" class="util-2x-1">
        <div class="card gap-3 util-2x-2">
            <span id="offer-context-badge-studnie" class="gap-1 util-2x-3"></span>
            <span id="offer-context-text-studnie" class="util-2x-4"></span>
        </div>
    </div>
    <!-- Client & offer info summary (read from builder form) -->
    <div class="card card-compact mb-1">
        <div class="card-title-sm util-2x-5">
            <span id="offer-form-title-studnie"
                ><i data-lucide="clipboard-list"></i> Dane klienta i oferty</span
            >
        </div>
        <div class="card-content mt-5">
            <div id="offer-client-summary" class="gap-2 util-2x-6">
                <div>
                    <span class="fs-xs-muted">Data:</span>
                    <span id="offer-disp-date">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">Nr klienta:</span>
                    <span id="offer-disp-client-number">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">Firma:</span>
                    <span id="offer-disp-name">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">NIP:</span>
                    <span id="offer-disp-nip">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">Nr oferty:</span>
                    <span id="offer-disp-number">—</span>
                </div>
                <div>
                    <span class="fs-xs-muted">Inwestycja:</span>
                    <span id="offer-disp-invest">—</span>
                </div>
            </div>
        </div>
    </div>

    <!-- UWAGI DO OFERTY -->
    <div class="card util-2x-7">
        <div class="card-header-row">
            <label class="fs-lg-primary-bold">
                <i data-lucide="edit-3"></i> Uwagi do oferty (widoczne na wydruku)
            </label>
            <button
                type="button"
                class="btn btn-secondary btn-sm util-2x-8"
                onclick="generateOfferNotes()"
            >
                <i data-lucide="refresh-cw" class="icon-xxs"></i>
                Auto-generuj uwagi
            </button>
        </div>
        <textarea
            id="offer-tab-notes"
            class="wizard-form-input util-2x-31"
            rows="4"
            placeholder="Uwagi zostaną automatycznie wygenerowane..."
        ></textarea>
    </div>

    <!-- WARUNKI PŁATNOŚCI + DATA WAŻNOŚCI -->
    <div class="card util-2x-9">
        <div class="card-header-row">
            <label class="fs-lg-primary-bold">
                <i data-lucide="credit-card"></i> Warunki płatności
            </label>
            <label class="fs-lg-primary-bold">Data ważności</label>
        </div>
        <div class="gap-3 util-2x-10">
            <textarea
                id="offer-tab-payment-terms"
                class="wizard-form-input util-2x-31"
                rows="2"
                placeholder="Domyślnie przepisywane z kroku 1..."
            ></textarea>
            <input
                id="offer-tab-validity"
                class="wizard-form-input util-2x-11"
                onclick="this.select()"
            />
        </div>
    </div>

    <div class="card mb-1">
        <div class="toolbar util-2x-12">
            <h2 class="fs-2xl-bold-plain">
                <i data-lucide="bar-chart-2"></i> Zestawienie ofertowe (Studnie)
            </h2>
        </div>
        <div id="offer-summary-body"></div>
    </div>

    <!-- Summary Foot -->
    <div id="offer-summary-footer-fixed" class="offer-summary-footer-fixed">
        <div class="summary-grid gap-4 util-single-149">
            <!-- CENA NETTO -->
            <div class="summary-card util-single-150">
                <div class="studnie-summary-label">Cena Netto</div>
                <div class="studnie-summary-value accent" id="sum-netto-products">0,00 PLN</div>
            </div>
            <!-- TRANSPORT -->
            <div
                class="summary-card util-single-151"
                onclick="openTransportPopup()"
                onmouseover="this.style.background = 'rgba(var(--white-rgb), 0.05)'"
                onmouseout="this.style.background = 'transparent'"
            >
                <div class="studnie-summary-label util-2x-30">Koszt transportu</div>
                <div
                    class="studnie-summary-value warn gap-2 util-single-152"
                    id="sum-transport-cost"
                >
                    <i data-lucide="truck" class="util-2x-13"></i> 0 PLN
                </div>
                <div id="offer-active-transport-info" class="util-single-153">
                    <!-- info o transporcie wg. JS -->
                </div>
            </div>
            <!-- RAZEM NETTO -->
            <div class="summary-card util-single-154" aria-live="polite">
                <div class="studnie-summary-label">RAZEM Netto</div>
                <div class="studnie-summary-value success" id="sum-total-netto">0,00 PLN</div>
                <div class="studnie-summary-sub" id="sum-brutto-details">Brutto: 0,00 PLN</div>
            </div>
            <!-- RABATY -->
            <div
                class="summary-card util-single-155"
                onclick="openOfferDiscountsPopup()"
                onmouseover="this.style.background = 'rgba(var(--white-rgb), 0.05)'"
                onmouseout="this.style.background = 'transparent'"
            >
                <div class="util-single-156">
                    <span class="studnie-summary-label util-2x-25">Zarządzanie Rabatami</span>
                </div>
                <div id="offer-active-discounts-info" class="util-single-157">
                    <!-- Populated by updateOfferSummaryUI -->
                </div>
            </div>
            <!-- AKCJE -->
            <div class="summary-card summary-card-actions">
                <div class="summary-card-actions-grid">
                    <button
                        type="button"
                        id="btn-save-studnie-offer"
                        class="summary-action-btn summary-action-btn--save"
                        onclick="saveOfferStudnie()"
                    >
                        <i data-lucide="save"></i> Zapisz ofertę
                    </button>
                    <button
                        type="button"
                        id="btn-create-order-offer"
                        class="summary-action-btn summary-action-btn--order"
                        onclick="createOrderFromOffer()"
                    >
                        <i data-lucide="package"></i> Utwórz zamówienie
                    </button>
                    <button
                        type="button"
                        class="summary-action-btn summary-action-btn--print"
                        onclick="showOfferExportChoice()"
                    >
                        <i data-lucide="printer"></i> Wydruk
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
