<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="{{APP_NAME}} — profesjonalny generator ofert handlowych na rury betonowe i studnie żelbetowe."
        />
        <title>{{APP_NAME}} — Generator Ofert</title>
        <link href="css/inter.css?v=1.13.1" rel="stylesheet" />
        <link rel="stylesheet" href="css/style.base.css?v=1.13.1" />
        <link rel="stylesheet" href="css/style.cards.css?v=1.13.1" />
        <link rel="stylesheet" href="css/style.responsive.css?v=1.13.1" />
        <link rel="stylesheet" href="css/style.utilities.css?v=1.13.1" />
        <link rel="stylesheet" href="css/spa.css?v=1.13.1" />
    </head>

    <body>
        <!-- ═══════ WSPÓLNY NAGŁÓWEK ═══════ -->
        <header class="header">
            <div class="header-inner">
                <div class="header-left">
                    <div class="logo logo-app">
                        <img
                            src="images/logo-sok.svg?v=1.13.1"
                            class="logo-sok"
                            alt="{{APP_NAME}}"
                            aria-label="{{APP_NAME}} — {{APP_SUBTITLE}}"
                        />
                        <span id="spa-logo-text" class="logo-app-module">
                            {{APP_SUBTITLE}}
                        </span>
                    </div>

                    <!-- Kafle nawigacji na poziomie aplikacji -->
                    <div class="nav-apps" id="spa-nav-apps">
                        <a href="index.html" class="nav-tile">
                            <span class="nav-tile-icon"><i data-lucide="home"></i></span>
                            <span class="nav-tile-text">Pulpit</span>
                        </a>
                        <a href="#/studnie" class="nav-tile" id="spa-app-studnie">
                            <span class="nav-tile-icon"><i data-lucide="cylinder"></i></span>
                            <span class="nav-tile-text">Studnie</span>
                        </a>
                        <a href="#/rury" class="nav-tile" id="spa-app-rury">
                            <span class="nav-tile-icon"
                                ><i data-lucide="cylinder" class="lucide-rotate-n90"></i
                            ></span>
                            <span class="nav-tile-text">Rury</span>
                        </a>
                        <a href="#/kartoteka" class="nav-tile" id="spa-app-kartoteka">
                            <span class="nav-tile-icon"><i data-lucide="archive"></i></span>
                            <span class="nav-tile-text">Kartoteka Ofert</span>
                        </a>
                        <a href="#/zlecenia" class="nav-tile" id="spa-app-zlecenia">
                            <span class="nav-tile-icon"><i data-lucide="factory"></i></span>
                            <span class="nav-tile-text">Zlecenia</span>
                        </a>
                    </div>
                </div>

                <!-- Nawigacja poziomu sekcji (wypełniana dynamicznie przez moduły) -->
                <div class="header-center">
                    <nav class="nav" id="spa-section-nav"></nav>
                </div>

                <div class="header-right">
                    <div id="header-user-info" class="header-user-info">
                        <span
                            id="ai-status-indicator"
                            class="header-chip"
                            style="visibility: hidden"
                        >
                            <span id="ai-status-dot" class="header-ai-dot"></span>
                            <span id="ai-status-text" style="min-width: 13ch">AI...</span>
                        </span>
                        <span id="header-username" class="header-username"></span>
                        <span id="header-role-badge" class="header-role-badge"></span>

                        <span id="app-version-toolbar" class="header-version"></span>
                        <span
                            class="connection-dot is-checking"
                            id="connection-dot"
                            title="Sprawdzanie połączenia..."
                        ></span>
                        <button type="button" onclick="appLogout()" class="header-logout">
                            Wyloguj
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- ═══════ GŁÓWNY KONTENER WIDOKÓW (iframy wstrzykiwane tutaj) ═══════ -->
        <div id="spa-main"></div>

        <!-- ═══════ WSPÓLNE SKRYPTY (tylko autoryzacja wymagana przez router) ═══════ -->
        <script src="js/shared/auth.js?v=1.13.1"></script>
        <script src="js/shared/logger.js?v=1.13.1"></script>
        <script src="js/shared/constants.js?v=1.13.1"></script>
        <script src="js/shared/ui.js?v=1.13.1"></script>
        <script src="js/shared/headerUser.js?v=1.13.1"></script>

        <!-- ═══════ ROUTER SPA ═══════ -->
        <script src="js/spa/router.js?v=1.13.1"></script>
        <script src="js/shared/iconsSlim.js?v=1.13.1"></script>
        <script src="js/versionDisplay.js?v=1.13.1"></script>
        <script src="js/aiStatusIndicator.js?v=1.13.1"></script>
        <script src="js/shared/priceDefaults.js?v=1.13.1"></script>
    </body>
</html>
