<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="{{APP_NAME}} — profesjonalny generator ofert handlowych na rury betonowe i studnie żelbetowe."
        />
        <title>{{APP_NAME}} — Generator Ofert</title>
        <style id="page-loader-critical">
            html:not(.is-loaded) {
                visibility: hidden;
            }
            html.is-loaded {
                visibility: visible;
            }
            #page-loader {
                position: fixed;
                inset: 0;
                display: grid;
                place-items: center;
                align-content: center;
                gap: 0.75rem;
                background: var(--bg-primary, #0a0e1a);
                z-index: 9999;
                transition: opacity 0.25s ease;
            }
            html.is-loaded #page-loader {
                opacity: 0;
                pointer-events: none;
                visibility: hidden;
            }
            .page-loader-spinner {
                width: 40px;
                height: 40px;
                border: 4px solid rgba(99, 102, 241, 0.15);
                border-top-color: #6366f1;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                html:not(.is-loaded) {
                    visibility: visible;
                }
                #page-loader {
                    transition: none;
                }
                .page-loader-spinner {
                    animation: none;
                }
            }
        </style>
        <noscript
            ><style>
                html:not(.is-loaded) {
                    visibility: visible;
                }
                #page-loader {
                    display: none !important;
                }
            </style></noscript
        >
        <link href="css/inter.css?v=1.22.0" rel="stylesheet" />
        <link rel="stylesheet" href="css/style.base.css?v=1.22.0" />
        <link rel="stylesheet" href="css/style.cards.css?v=1.22.0" />
        <link rel="stylesheet" href="css/style.responsive.css?v=1.22.0" />
        <link rel="stylesheet" href="css/style.utilities.css?v=1.22.0" />
        <link rel="stylesheet" href="css/spa.css?v=1.22.0" />
    </head>

    <body>
        <div id="page-loader" aria-hidden="true">
            <div class="page-loader-spinner" aria-hidden="true"></div>
            <span
                style="
                    color: var(--text-muted, #94a3b8);
                    font:
                        500 0.85rem Inter,
                        sans-serif;
                    letter-spacing: 0.5px;
                "
                >Ładowanie...</span
            >
        </div>
        <!-- ═══════ WSPÓLNY NAGŁÓWEK ═══════ -->
        <header class="header">
            <div class="header-inner">

                    <!-- Kafle nawigacji na poziomie aplikacji -->
                    <div class="nav-apps" id="spa-nav-apps">
                        <a href="index.html" class="nav-tile">
                            <span class="nav-tile-icon"><i data-lucide="home"></i></span>
                            <span class="nav-tile-text">Pulpit</span>
                        </a>
                        <a href="#/studnie" class="nav-tile" id="spa-app-studnie">
                            <span class="nav-tile-icon"><i data-lucide="cylinder"></i></span>
                            <span class="nav-tile-text">Studnie</span>
                        </a>
                        <a href="#/rury" class="nav-tile" id="spa-app-rury">
                            <span class="nav-tile-icon"
                                ><i data-lucide="cylinder" class="lucide-rotate-n90"></i
                            ></span>
                            <span class="nav-tile-text">Rury</span>
                        </a>
                        <a href="#/kartoteka" class="nav-tile" id="spa-app-kartoteka">
                            <span class="nav-tile-icon"><i data-lucide="archive"></i></span>
                            <span class="nav-tile-text">Kartoteka Ofert</span>
                        </a>
                        <a href="#/zlecenia" class="nav-tile" id="spa-app-zlecenia">
                            <span class="nav-tile-icon"><i data-lucide="factory"></i></span>
                            <span class="nav-tile-text">Zlecenia</span>
                        </a>
                    </div>
                </div>

                <!-- Nawigacja poziomu sekcji (wypełniana dynamicznie przez moduły) -->
                <div class="header-center">
                    <nav class="nav" id="spa-section-nav"></nav>
                </div>

                <div class="header-right">
                    <div id="header-user-info" class="header-user-info">
                        <span
                            id="ai-status-indicator"
                            class="header-chip"
                            style="visibility: hidden"
                        >
                            <span id="ai-status-dot" class="header-ai-dot"></span>
                            <span id="ai-status-text" style="min-width: 13ch">AI...</span>
                        </span>
                        <span id="header-username" class="header-username"></span>
                        <span id="header-role-badge" class="header-role-badge"></span>

                        <span id="app-version-toolbar" class="header-version"></span>
                        <span
                            class="connection-dot is-checking"
                            id="connection-dot"
                            title="Sprawdzanie połączenia..."
                        ></span>
                        <button type="button" onclick="appLogout()" class="header-logout">
                            Wyloguj
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- ═══════ GŁÓWNY KONTENER WIDOKÓW (iframy wstrzykiwane tutaj) ═══════ -->
        <div id="spa-main"></div>

        <div id="toast-container" class="toast-container" aria-live="polite"></div>

        <!-- ═══════ WSPÓLNE SKRYPTY (tylko autoryzacja wymagana przez router) ═══════ -->
        <script src="js/shared/auth.js?v=1.22.0"></script>
        <script src="js/shared/logger.js?v=1.22.0"></script>
        <script src="js/shared/constants.js?v=1.22.0"></script>
        <script type="module" src="js/shared/escapeHtml.js?v=1.22.0"></script>
        <script type="module" src="js/shared/modalCore.js?v=1.22.0"></script>
        <script type="module" src="js/shared/toast.js?v=1.22.0"></script>
        <script type="module" src="js/shared/fetchJson.js?v=1.22.0"></script>
        <script type="module" src="js/shared/debounce.js?v=1.22.0"></script>
        <script src="js/shared/ui.js?v=1.22.0"></script>
        <script src="js/shared/headerUser.js?v=1.22.0"></script>

        <!-- ═══════ ROUTER SPA ═══════ -->
        <script src="js/spa/router.js?v=1.22.0"></script>
        <script src="js/shared/iconsSlim.js?v=1.22.0"></script>
        <script src="js/versionDisplay.js?v=1.22.0"></script>
        <script src="js/aiStatusIndicator.js?v=1.22.0"></script>
        <script src="js/shared/priceDefaults.js?v=1.22.0"></script>
        <script>
            (function () {
                var loadPromise =
                    document.readyState === 'complete'
                        ? Promise.resolve()
                        : new Promise(function (r) {
                              window.addEventListener('load', r, { once: true });
                          });
                var fontsPromise =
                    document.fonts && document.fonts.ready
                        ? document.fonts.ready
                        : Promise.resolve();
                Promise.race([
                    Promise.all([loadPromise, fontsPromise]),
                    new Promise(function (r) {
                        setTimeout(r, 3000);
                    })
                ]).then(function () {
                    document.documentElement.classList.add('is-loaded');
                    var loader = document.getElementById('page-loader');
                    if (loader)
                        setTimeout(function () {
                            loader.remove();
                        }, 300);
                });
            })();
        </script>
    </body>
</html>
