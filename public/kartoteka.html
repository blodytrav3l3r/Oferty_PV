<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="{{APP_NAME}} — Kartoteka Ofert. Przeglądaj, filtruj i zarządzaj ofertami na rury i studnie."
        />
        <title>{{APP_NAME}} — Kartoteka Ofert</title>
        <link rel="stylesheet" href="css/style.base.css?v=1.19.4" />
        <link rel="stylesheet" href="css/style.cards.css?v=1.19.4" />
        <link rel="stylesheet" href="css/style.responsive.css?v=1.19.4" />
        <link rel="stylesheet" href="css/style.utilities.css?v=1.19.4" />
    </head>

    <body>
        <!-- HEADER (hidden when inside SPA iframe) -->
        <header class="header">
            <div class="header-inner">
                <div class="header-left">
                    <div class="logo logo-kartoteka">
                        <svg viewBox="0 0 24 24" fill="none" stroke="url(#lg)" stroke-width="2">
                            <defs>
                                <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" class="logo-stop-start" />
                                    <stop offset="100%" class="logo-stop-end" />
                                </linearGradient>
                            </defs>
                            <circle cx="12" cy="12" r="9" />
                            <path d="M12 3v18M3 12h18M7 7l10 10M17 7L7 17" />
                        </svg>
                        <span>Kartoteka Ofert</span>
                    </div>

                    <div class="nav-apps">
                        <a href="index.html" target="_parent" class="nav-tile">
                            <span class="nav-tile-icon"><i data-lucide="home"></i></span>
                            <span class="nav-tile-text">Pulpit</span>
                        </a>
                        <a href="app.html#/studnie" target="_parent" class="nav-tile">
                            <span class="nav-tile-icon"><i data-lucide="cylinder"></i></span>
                            <span class="nav-tile-text">Studnie</span>
                        </a>
                        <a href="app.html#/rury" target="_parent" class="nav-tile">
                            <span class="nav-tile-icon"
                                ><i data-lucide="cylinder" class="lucide-rotate-n90"></i
                            ></span>
                            <span class="nav-tile-text">Rury</span>
                        </a>
                        <a
                            href="app.html#/kartoteka"
                            target="_parent"
                            class="nav-tile active nav-tile--kartoteka"
                        >
                            <span class="nav-tile-icon"><i data-lucide="archive"></i></span>
                            <span class="nav-tile-text">Kartoteka</span>
                        </a>
                    </div>
                </div>

                <div class="header-right">
                    <div id="header-user-info" class="header-user-info">
                        <span id="header-username" class="header-username"></span>
                        <span id="header-role-badge" class="header-role-badge"></span>
                        <button type="button" onclick="appLogout()" class="header-logout">
                            Wyloguj
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="main">
            <!-- ===== KARTOTEKA: Full-width offers view ===== -->
            <div class="section active" id="section-kartoteka">
                <div class="app-container">
                    <!-- Unified Filter Bar -->
                    <div class="kartoteka-filter-bar">
                        <!-- Row 1: filtry -->
                        <div class="ka-filter-row">
                            <!-- Type Filters -->
                            <div class="ka-filter-group">
                                <span class="ka-label">Typ:</span>
                                <button
                                    type="button"
                                    class="btn btn-sm ka-type-filter-btn active ka-pill"
                                    data-type-filter="all"
                                    onclick="filterByType('all')"
                                >
                                    Wszystkie
                                </button>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-secondary ka-type-filter-btn ka-pill"
                                    data-type-filter="offer"
                                    onclick="filterByType('offer')"
                                >
                                    <i data-lucide="cylinder" class="lucide-rotate-n90"></i> Rury
                                </button>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-secondary ka-type-filter-btn ka-pill"
                                    data-type-filter="studnia_oferta"
                                    onclick="filterByType('studnia_oferta')"
                                >
                                    <i data-lucide="cylinder"></i> Studnie
                                </button>
                            </div>

                            <!-- Divider -->
                            <div class="divider-v" aria-hidden="true"></div>

                            <!-- Status Filters -->
                            <div class="ka-filter-group">
                                <span class="ka-label">Status:</span>
                                <button
                                    type="button"
                                    class="btn btn-sm ka-filter-btn active ka-pill"
                                    data-filter="all"
                                    onclick="
                                        window.kartotekaUI &&
                                            window.kartotekaUI.setFilterLocalOffers('all')
                                    "
                                >
                                    Wszystkie
                                </button>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-secondary ka-filter-btn ka-pill"
                                    data-filter="with_order"
                                    onclick="
                                        window.kartotekaUI &&
                                            window.kartotekaUI.setFilterLocalOffers('with_order')
                                    "
                                >
                                    Z zamówieniem
                                </button>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-secondary ka-filter-btn ka-pill"
                                    data-filter="without_order"
                                    onclick="
                                        window.kartotekaUI &&
                                            window.kartotekaUI.setFilterLocalOffers('without_order')
                                    "
                                >
                                    Bez zamówienia
                                </button>
                            </div>

                            <!-- Divider -->
                            <div class="divider-v" aria-hidden="true"></div>

                            <!-- Date Filter -->
                            <div class="ka-filter-group">
                                <span class="ka-label">Data:</span>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-secondary ka-date-preset-btn"
                                    data-date-range="today"
                                >
                                    Dzisiaj
                                </button>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-secondary ka-date-preset-btn"
                                    data-date-range="7d"
                                >
                                    7 dni
                                </button>
                                <button
                                    type="button"
                                    class="btn btn-sm btn-secondary ka-date-preset-btn"
                                    data-date-range="month"
                                >
                                    Ten miesiąc
                                </button>
                                <input
                                    type="date"
                                    id="ka-date-from"
                                    class="form-input form-input-sm"
                                    title="Data od"
                                    aria-label="Data od"
                                />
                                <span class="kartoteka-date-sep" aria-hidden="true">&ndash;</span>
                                <input
                                    type="date"
                                    id="ka-date-to"
                                    class="form-input form-input-sm"
                                    title="Data do"
                                    aria-label="Data do"
                                />
                                <button
                                    type="button"
                                    id="ka-date-clear"
                                    class="btn btn-sm btn-secondary"
                                    title="Wyczyść zakres dat"
                                    aria-label="Wyczyść zakres dat"
                                >
                                    <i data-lucide="x"></i>
                                </button>
                            </div>

                            <!-- Divider -->
                            <div class="divider-v" aria-hidden="true"></div>

                            <!-- User Filter -->
                            <div class="ka-filter-group">
                                <span class="ka-label">Opiekun:</span>
                                <select id="ka-user-filter" class="btn btn-sm ka-select">
                                    <option value="">Użytkownik: wszyscy</option>
                                </select>

                                <button
                                    type="button"
                                    id="ka-clear-filters"
                                    class="btn btn-secondary btn-sm ka-pill"
                                    onclick="
                                        window.kartotekaUI && window.kartotekaUI.clearAllFilters()
                                    "
                                    title="Wyczyść wszystkie aktywne filtry"
                                >
                                    Wyczyść filtry (0)
                                </button>
                            </div>
                        </div>

                        <!-- Row 2: szukaj + kompakt + odśwież -->
                        <div class="ka-search-row">
                            <div class="search-box ka-search-box">
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    class="ka-search-icon"
                                    aria-hidden="true"
                                >
                                    <circle cx="11" cy="11" r="7" />
                                    <path d="m21 21-4.35-4.35" />
                                </svg>
                                <label for="ka-local-search-input" class="sr-only"
                                    >Szukaj oferty</label
                                >
                                <input
                                    type="text"
                                    id="ka-local-search-input"
                                    class="form-input form-input-sm ka-search-input"
                                    placeholder="Szukaj po numerze oferty/zamówienia, kliencie, NIP, opiekunie, inwestycji, uwagach..."
                                    oninput="
                                        window.kartotekaUI &&
                                            window.kartotekaUI.onSearchInput &&
                                            window.kartotekaUI.onSearchInput()
                                    "
                                />
                            </div>

                            <button
                                type="button"
                                class="btn btn-sm btn-secondary ka-pill ka-noshrink"
                                id="btn-compact-mode"
                                onclick="toggleCompactMode()"
                                title="Przełącz tryb kompaktowy"
                            >
                                <i data-lucide="panel-right-close"></i> Kompakt
                            </button>
                            <button
                                type="button"
                                class="btn btn-secondary btn-sm ka-pill ka-noshrink"
                                onclick="window.kartotekaUI && window.kartotekaUI.loadLocalOffers()"
                                title="Odśwież bazę ofert"
                            >
                                <i data-lucide="refresh-cw"></i> Odśwież
                            </button>
                        </div>
                    </div>

                    <!-- IE Toolbar -->
                    <div id="ie-toolbar-host"></div>

                    <!-- Main Offers List -->
                    <section class="card ka-list-card">
                        <div id="ka-offers-list" class="kartoteka-offers-grid">
                            <div class="ka-loading">
                                <i data-lucide="archive" aria-hidden="true"></i>
                                <div>Ładowanie ofert z serwera...</div>
                            </div>
                        </div>
                    </section>
                    <div id="ka-offer-count" class="kartoteka-list-end hidden"></div>
                </div>
            </div>
        </main>

        <!-- Toast container -->
        <div id="toast-container" class="toast-container" aria-live="polite"></div>

        <!-- Dependencies -->
        <script defer src="js/shared/formatters.js?v=1.19.4"></script>
        <script defer src="js/shared/auth.js?v=1.19.4"></script>
        <script defer src="js/shared/logger.js?v=1.19.4"></script>
        <script defer src="js/shared/constants.js?v=1.19.4"></script>
        <script type="module" src="js/shared/escapeHtml.js?v=1.19.4"></script>
        <script type="module" src="js/shared/modalCore.js?v=1.19.4"></script>
        <script type="module" src="js/shared/toast.js?v=1.19.4"></script>
        <script type="module" src="js/shared/fetchJson.js?v=1.19.4"></script>
        <script type="module" src="js/shared/debounce.js?v=1.19.4"></script>
        <script defer src="js/shared/ui.js?v=1.19.4"></script>
        <script defer src="js/shared/headerUser.js?v=1.19.4"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                if (typeof fetchGlobalUsers === 'function') fetchGlobalUsers();
            });
        </script>
        <script defer src="js/shared/printModal.js?v=1.19.4"></script>
        <link rel="stylesheet" href="css/printModal.css?v=1.19.4" />
        <script defer src="js/studnie/offerPrintManager.js?v=1.19.4"></script>
        <script defer src="js/rury/offerPrintManager.js?v=1.19.4"></script>
        <script defer src="js/kartoteka/kartotekaHelpers.js?v=1.19.4"></script>
        <script type="module" src="js/kartoteka/kartotekaUi.js?v=1.19.4"></script>

        <script defer src="js/kartoteka/kartotekaInit.js?v=1.19.4"></script>
        <script defer src="js/shared/iconsSlim.js?v=1.19.4"></script>

        <!-- SheetJS do XLSX — ładowany leniwie przy pierwszej operacji importu/eksportu -->
        <script defer src="js/shared/xlsxLoader.js?v=1.19.4"></script>

        <!-- Import/Eksport ofert (feature flag) -->
        <script defer src="js/import-export/shared/featureFlag.js?v=1.19.4"></script>
        <script defer src="js/import-export/shared/xlsxImportShared.js?v=1.19.4"></script>
        <script defer src="js/import-export/shared/conflictModal.js?v=1.19.4"></script>
        <script defer src="js/import-export/shared/jsonOfferTransfer.js?v=1.19.4"></script>
        <script defer src="js/import-export/rury/externalImport.js?v=1.19.4"></script>
        <script defer src="js/import-export/rury/externalExportTemplate.js?v=1.19.4"></script>
        <script defer src="js/import-export/rury/transferJson.js?v=1.19.4"></script>
        <script defer src="js/import-export/studnie/externalImport.js?v=1.19.4"></script>
        <script defer src="js/import-export/studnie/externalExportTemplate.js?v=1.19.4"></script>
        <script defer src="js/import-export/studnie/transferJson.js?v=1.19.4"></script>
        <script defer src="js/import-export/toolbar.js?v=1.19.4"></script>

        <!-- Wymuszenie jedynego punktu wejścia: app.html#/<module> -->
        <script>
            if (window.top === window.self) {
                const module =
                    location.pathname
                        .split('/')
                        .pop()
                        .replace(/\.html?$/, '') || 'kartoteka';
                window.location.replace('/app.html#/' + module);
            }
        </script>
    </body>
</html>
